version: "3.9"
services:
  backend:
    build: ./backend
    # UI: open nibras_xray.html or https://nibrascode.com/xray (React frontend is an unused stub)
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

