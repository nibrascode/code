<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nibras Arabic</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F5973">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nibras Arabic">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        :root {
            --bg-1: #071A31;
            --bg-2: #0A2944;
            --bg-3: #06182C;
            --arabic-scale: 1;
            --text-color: #ffffff;
            --text-75: rgba(255,255,255,0.75);
            --text-50: rgba(255,255,255,0.5);
            --overlay-03: rgba(255,255,255,0.06);
            --overlay-08: rgba(255,255,255,0.10);
            --overlay-15: rgba(255,255,255,0.15);
            --overlay-20: rgba(255,255,255,0.20);
            --overlay-25: rgba(255,255,255,0.25);
            --overlay-35: rgba(255,255,255,0.35);
            --divider: rgba(255,255,255,0.1);
            --card-bg: rgba(255,255,255,0.10);
        }
        body.light-theme {
            --bg-1: #bfe3f5;
            --bg-2: #a5d4ee;
            --bg-3: #8ec3e6;
            --text-color: #0f2436;
            --text-75: rgba(15,36,54,0.75);
            --text-50: rgba(15,36,54,0.5);
            --overlay-03: rgba(15,36,54,0.05);
            --overlay-08: rgba(15,36,54,0.08);
            --overlay-15: rgba(15,36,54,0.12);
            --overlay-20: rgba(15,36,54,0.16);
            --overlay-25: rgba(15,36,54,0.20);
            --overlay-35: rgba(15,36,54,0.28);
            --divider: rgba(15,36,54,0.12);
            --card-bg: rgba(255,255,255,0.55);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100%;
            touch-action: pan-y;
            overscroll-behavior-y: auto;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(35, 105, 145, 0.18), transparent 34%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 54%, var(--bg-3));
            min-height: 100vh;
            color: var(--text-color);
            padding: max(8px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            height: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: auto;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.42;
            background:
                radial-gradient(ellipse at 92% 18%, transparent 0 42px, rgba(30, 90, 124, 0.16) 43px 45px, transparent 46px),
                radial-gradient(ellipse at 100% 20%, transparent 0 68px, rgba(30, 90, 124, 0.13) 69px 71px, transparent 72px),
                linear-gradient(115deg, transparent 0 11%, rgba(35, 91, 124, 0.08) 11.2% 11.7%, transparent 12% 100%);
        }
        .container {
            max-width: 30rem;
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        #content-area {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: hidden;
        }
        img, svg, video, canvas { max-width: 100%; }
        button, input, select, textarea { max-width: 100%; }
        .header { text-align: center; margin-bottom: 14px; padding: 8px 16px 0; position: relative; }
        .header::before {
            content: "";
            position: absolute;
            left: -18px;
            top: 6px;
            width: 86px;
            height: 86px;
            opacity: 0.38;
            border: 1px solid rgba(42, 100, 132, 0.45);
            border-radius: 50%;
            transform: rotate(28deg) skewX(-15deg);
            box-shadow: 16px 0 0 -15px rgba(42, 100, 132, 0.5), 0 14px 0 -15px rgba(42, 100, 132, 0.5);
            pointer-events: none;
        }
        .header::after {
            content: "";
            position: absolute;
            right: -14px;
            top: 2px;
            width: 82px;
            height: 120px;
            opacity: 0.34;
            border: 1px solid rgba(35, 101, 139, 0.44);
            border-bottom: 0;
            border-radius: 48% 48% 0 0;
            clip-path: polygon(0 100%, 16% 55%, 29% 72%, 41% 35%, 53% 68%, 68% 20%, 81% 68%, 100% 48%, 100% 100%);
            pointer-events: none;
        }
        .header h1 {
            display: block;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.86rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            line-height: 1;
            margin: 0 0 2px 0.12em;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-word { color: var(--text-color); display: block; }
        .brand-arabic {
            display: block;
            color: #f2c14e;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            line-height: 1.1;
            margin-left: 0.18em;
        }
        .header-mark {
            display: block;
            width: 58px;
            height: 42px;
            margin: 0 auto 2px;
        }
        .header-subtitle {
            color: var(--text-50);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            margin-top: 5px;
        }
        .header-back-btn {
            position: absolute;
            top: 54px;
            left: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-75);
            background: rgba(10, 38, 62, 0.72);
            border: 1px solid rgba(91, 157, 194, 0.48);
            border-radius: 50%;
            font-size: 1.9rem;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
        }
        .theme-toggle-btn {
            position: absolute;
            top: 54px;
            right: 22px;
            background: rgba(10, 38, 62, 0.72);
            border: 1px solid rgba(91, 157, 194, 0.48);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }
        .settings-toggle-btn {
            color: var(--text-75);
            background: rgba(8, 38, 61, 0.72);
            border: 1px solid rgba(91, 157, 194, 0.42);
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 0.72rem;
            cursor: pointer;
        }
        .settings-toggle-btn:hover {
            color: #f2c14e;
            border-color: rgba(242, 193, 78, 0.68);
        }
        .home-settings-row {
            display: flex;
            justify-content: flex-end;
            margin: 0 2px 9px;
        }
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--overlay-20);
            border-radius: 22px;
            /* Mobil WebView-də blur scroll zamanı hər kadrda bahalı repaint yaradır. */
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 24px;
            margin-bottom: 24px;
        }
        .glass-button {
            background: var(--overlay-15);
            border: 1px solid var(--overlay-25);
            border-radius: 16px;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
            text-align: center;
        }
        .glass-button:hover { background: var(--overlay-25); }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .arabic-text {
            font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            font-size: calc(1.8rem * var(--arabic-scale, 1));
            line-height: calc(2.2rem * var(--arabic-scale, 1));
            direction: rtl;
            text-align: right;
            unicode-bidi: isolate;
        }
        .arabic-text.text-lg { font-size: calc(1.125rem * var(--arabic-scale, 1)); line-height: calc(1.5rem * var(--arabic-scale, 1)); }
        .arabic-text.text-2xl { font-size: calc(1.5rem * var(--arabic-scale, 1)); line-height: calc(1.9rem * var(--arabic-scale, 1)); }
        .arabic-text.text-3xl { font-size: calc(1.875rem * var(--arabic-scale, 1)); line-height: calc(2.2rem * var(--arabic-scale, 1)); }
        .arabic-text.text-4xl { font-size: calc(2.25rem * var(--arabic-scale, 1)); line-height: calc(2.6rem * var(--arabic-scale, 1)); }
        .input-field {
            background: var(--overlay-08);
            border: 1px solid var(--overlay-35);
            border-radius: 12px;
            color: var(--text-color);
            padding: 10px 15px;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }
        .input-field:focus { border-color: var(--overlay-35); background: var(--overlay-15); }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .feedback { margin-top: 12px; text-align: center; font-weight: 600; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #facc15; }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-start; }
        .text-white-75 { color: var(--text-75); }
        .text-white-50 { color: var(--text-50); }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .text-center { text-align: center; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .font-bold { font-weight: bold; }
        .font-semibold { font-weight: 600; }
        .w-full { width: 100%; }
        .rounded-xl { border-radius: 12px; }
        .border-b { border-bottom: 1px solid var(--divider); }
        .py-2 { padding-top: 8px; padding-bottom: 8px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .px-6 { padding-left: 24px; padding-right: 24px; }
        .close-btn { background: none; border: none; color: var(--text-75); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: var(--text-color); }
        .option-label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--overlay-03);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-label:hover { background: var(--overlay-08); }
        .option-label input[type="radio"] { width: 20px; height: 20px; accent-color: #3b82f6; }
        .clickable { cursor: pointer; transition: transform 0.1s, background 0.2s; padding: 8px; border-radius: 8px; }
        .clickable:hover { background: var(--overlay-15); }
        .clickable:active { transform: scale(0.98); }
        .version-tag { text-align: center; font-size: 0.7rem; color: var(--text-50); margin-bottom: 8px; }
        .translation-toggle {
            background: var(--overlay-08);
            border: 1px solid var(--overlay-20);
            border-radius: 8px;
            padding: 4px 12px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.75rem;
            transition: background 0.2s;
            display: inline-block;
            margin-bottom: 8px;
        }
        .translation-toggle:hover { background: var(--overlay-20); }
        .dialogue-translation { display: block; direction: ltr; text-align: left; font-size: 0.875rem; color: var(--text-75); }
        .translation-hidden .dialogue-translation { display: none !important; }
        .nav-row { display: flex; gap: 10px; margin-top: 12px; }
        .nav-row .glass-button { flex: 1; padding: 14px; font-size: 1rem; }
        .glass-button:disabled { opacity: 0.35; cursor: not-allowed; }
        .glass-button:disabled:hover { background: var(--overlay-15); }
        .progress-text { text-align: center; font-size: 0.8rem; color: var(--text-50); margin-bottom: 10px; }
        .correct-answer-box {
            margin-top: 8px;
            background: rgba(74,222,128,0.14);
            border: 1px solid rgba(74,222,128,0.4);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .stats-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .stats-bar::-webkit-scrollbar { display: none; }
        .stat-pill {
            background: var(--overlay-15);
            border: 1px solid var(--overlay-20);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .xp-bar-wrap { margin-bottom: 14px; }
        .xp-bar {
            width: 100%;
            height: 10px;
            background: var(--overlay-15);
            border-radius: 6px;
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(to right, #facc15, #fb923c);
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        .daily-word-card {
            background: var(--overlay-08);
            border: 1px solid var(--overlay-20);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .daily-word-card:hover { background: var(--overlay-15); }
        #main-menu.home-shell {
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 0;
            margin-bottom: 18px;
            min-width: 0;
            overflow-x: hidden;
        }
        #home-stats .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            padding: 6px 3px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(9, 42, 66, 0.96), rgba(13, 58, 82, 0.82));
            border: 1px solid rgba(91, 157, 194, 0.3);
            border-radius: 16px;
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.16);
            overflow: visible;
        }
        #home-stats .home-stat {
            min-width: 0;
            padding: 3px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-right: 1px solid rgba(158, 201, 224, 0.16);
        }
        #home-stats .home-stat:last-child { border-right: 0; }
        .home-stat-icon {
            color: #f2c14e;
            font-size: 1.15rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .home-stat-copy { min-width: 0; text-align: left; }
        .home-stat-value {
            color: var(--text-color);
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .home-stat-label {
            color: var(--text-50);
            font-size: 0.56rem;
            white-space: nowrap;
            margin-top: 2px;
        }
        .goal-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(11, 52, 78, 0.97), rgba(10, 42, 66, 0.8));
            border: 1px solid rgba(91, 157, 194, 0.3);
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.14);
        }
        .goal-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            background: conic-gradient(#f2c14e var(--goal-progress), rgba(76, 130, 165, 0.32) 0);
            position: relative;
        }
        .goal-ring::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: #0b2c48;
        }
        .goal-ring span {
            position: relative;
            z-index: 1;
            font-size: 0.92rem;
            font-weight: 600;
        }
        .goal-content { min-width: 0; flex: 1; }
        .goal-title {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .goal-title-icon { color: #f2c14e; font-size: 1.1rem; }
        .goal-summary { color: var(--text-75); font-size: 0.72rem; margin-bottom: 6px; }
        .goal-progress {
            height: 7px;
            overflow: hidden;
            border-radius: 9px;
            background: rgba(112, 163, 193, 0.28);
            margin-bottom: 7px;
        }
        .goal-progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #f2c14e, #f5df8b);
        }
        .goal-select {
            width: 100%;
            min-height: 31px;
            color: var(--text-color);
            background: rgba(8, 38, 61, 0.65);
            border: 1px solid rgba(242, 193, 78, 0.4);
            border-radius: 11px;
            padding: 5px 9px;
            font-size: 0.72rem;
            outline: none;
        }
        .home-daily-word {
            background: linear-gradient(145deg, rgba(24, 61, 78, 0.98), rgba(10, 39, 60, 0.92));
            border: 1px solid rgba(242, 193, 78, 0.62);
            border-radius: 16px;
            padding: 10px 12px 9px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.14);
        }
        .home-daily-word .daily-word-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-75);
            font-size: 0.76rem;
            text-align: left;
            margin-bottom: 1px;
        }
        .daily-word-heading strong { color: var(--text-color); font-weight: 600; }
        .home-daily-word .speak-btn-inline {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(242, 193, 78, 0.45);
            border-radius: 50%;
            background: rgba(8, 38, 61, 0.52);
            font-size: 0.86rem;
        }
        .home-daily-word .arabic-text {
            color: #f2d27d;
            font-size: calc(2rem * var(--arabic-scale, 1));
            line-height: 1.1;
            text-align: center;
            margin: 1px 0 0;
        }
        .home-daily-word .daily-word-meaning {
            color: var(--text-color);
            font-size: 0.76rem;
            margin-top: 0;
            margin-bottom: 7px;
        }
        .daily-word-cta {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-color);
            background: rgba(8, 38, 61, 0.45);
            border: 1px solid rgba(242, 193, 78, 0.85);
            border-radius: 14px;
            padding: 6px 10px;
            font-size: 0.76rem;
            cursor: pointer;
        }
        .daily-word-cta span:first-child { color: #f2c14e; }
        .home-menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .home-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            min-height: 62px;
            color: var(--text-color);
            text-align: left;
            background: linear-gradient(135deg, rgba(13, 57, 84, 0.96), rgba(9, 39, 64, 0.88));
            border: 1px solid rgba(91, 157, 194, 0.28);
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .home-menu-item:hover {
            background: linear-gradient(135deg, rgba(21, 78, 105, 0.98), rgba(12, 52, 78, 0.92));
            border-color: rgba(242, 193, 78, 0.52);
        }
        .home-menu-item:active { transform: scale(0.985); }
        .home-menu-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 13px;
            color: #f2c14e;
            background: linear-gradient(145deg, rgba(242, 193, 78, 0.2), rgba(12, 82, 103, 0.55));
            border: 1px solid rgba(242, 193, 78, 0.38);
            font-size: 1.35rem;
        }
        .home-menu-copy { flex: 1; min-width: 0; }
        .home-menu-title { display: block; font-size: 0.94rem; font-weight: 700; }
        .home-menu-subtitle {
            display: block;
            color: var(--text-50);
            font-size: 0.68rem;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .home-menu-arrow { color: var(--text-75); font-size: 1.65rem; line-height: 1; }
        .home-divider {
            height: 12px;
            margin: 9px 26px 0;
            background: linear-gradient(90deg, transparent, rgba(242, 193, 78, 0.85), transparent);
            clip-path: polygon(0 45%, 45% 45%, 49% 0, 51% 0, 55% 45%, 100% 45%, 100% 55%, 55% 55%, 51% 100%, 49% 100%, 45% 55%, 0 55%);
            opacity: 0.8;
