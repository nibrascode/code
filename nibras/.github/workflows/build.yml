name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/hergun-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --no-frozen-lockfile
      - run: npx cap sync android
      - run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/nibras-upload-key.jks
      - name: Show upload key SHA-1 (compare with Play Console)
        run: keytool -list -v -keystore android/app/nibras-upload-key.jks -alias nibras-upload -storepass "$KS_PASS" | grep -E "SHA1|SHA256"
        env:
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/hergun-capacitor/android/app/build/outputs/bundle/release/app-release.aab
