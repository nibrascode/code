name: Play facts sync
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: play-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-play.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/play-facts.json; then echo "no change"; exit 0; fi
          git config user.name "Nibras Code"
          git config user.email "Nibrascode@gmail.com"
          git add src/data/play-facts.json
          git commit -m "Play məlumatları avtomatik yeniləndi"
          git pull --rebase origin main
          git push origin HEAD:main
