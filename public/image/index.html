<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Şəkil sıx və çevir — Nibras</title>
  <meta name="description" content="Şəkli sıx, JPG, PNG və WebP arasında çevir, ölçüsünü qısalt. Şəkil cihazdan çıxmır." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100dvh; color: #eef3ff;
      font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(80% 50% at 100% 0%, rgb(37 78 180 / 0.45), transparent 55%),
        radial-gradient(50% 40% at 0% 100%, rgb(20 60 140 / 0.35), transparent 60%),
        #05070f;
    }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 0; }
    .home { color: #d7e4ff; text-decoration: none; font-weight: 800; letter-spacing: -0.04em; }
    .langs { display: flex; gap: 6px; }
    .langs button {
      width: 36px; height: 32px; padding: 0; border-radius: 999px;
      border: 1px solid rgb(255 255 255 / 0.14); background: rgb(255 255 255 / 0.04);
      color: #d5def2; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .langs button.on { background: #fff; color: #111; border-color: transparent; }
    main { width: min(920px, calc(100% - 32px)); margin: 28px auto 56px; }
    .head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .mark {
      width: 58px; height: 58px; flex: none; border-radius: 16px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 20%, #ffe7a8, #c8922a 42%, #6d4a12);
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
    }
    .mark svg { width: 34px; height: 34px; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 44px); letter-spacing: -0.045em; line-height: 1; }
    .lead { margin: 6px 0 0; color: rgb(244 247 255 / 0.72); font-size: 15px; }
    .studio {
      padding: 10px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgb(14 18 32 / 0.92), rgb(8 10 18 / 0.92)) padding-box,
        linear-gradient(135deg, #f0d48a, rgb(126 182 255 / 0.55) 46%, rgb(255 255 255 / 0.12)) border-box;
      border: 1px solid transparent;
      box-shadow: 0 24px 70px rgb(0 0 0 / 0.45);
    }
    .stage {
      position: relative;
      min-height: 360px;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgb(90 130 255 / 0.16), transparent 58%),
        repeating-conic-gradient(#1b2333 0 25%, #10151f 0 50%) 0 0 / 22px 22px;
    }
    .view { display: grid; grid-template-columns: 1fr 1fr; min-height: 360px; }
    .view:not(:has(#after-fig:not([hidden]))) { grid-template-columns: 1fr; }
    .view figure { margin: 0; position: relative; }
    .view img { width: 100%; height: 360px; object-fit: contain; display: block; }
    .view figcaption {
      position: absolute; left: 12px; top: 12px;
      padding: 4px 10px; border-radius: 999px;
      background: rgb(6 8 14 / 0.72); color: #f4f7ff; font-size: 12px; font-weight: 650;
    }
    .drop {
      position: absolute; inset: 0; margin: 0;
      display: grid; place-content: center; text-align: center; gap: 6px;
      cursor: pointer; border: 0; background: transparent;
    }
    .drop input { display: none; }
    .drop b { font-size: 18px; letter-spacing: -0.03em; }
    .drop span { color: rgb(244 247 255 / 0.68); font-size: 13px; }
    .stage:has(#view:not([hidden])) .drop {
      inset: auto 14px 14px auto;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgb(8 12 20 / 0.78);
      border: 1px solid rgb(255 255 255 / 0.16);
    }
    .stage:has(#view:not([hidden])) .drop b { display: none; }
    .dock {
      margin-top: 10px; padding: 12px;
      border-radius: 18px;
      background: rgb(255 255 255 / 0.035);
      border: 1px solid rgb(255 255 255 / 0.06);
    }
    .field { margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    .field > span, .slide > span {
      display: block; margin-bottom: 6px;
      color: rgb(244 247 255 / 0.55); font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .seg {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
      padding: 4px; border-radius: 14px;
      background: rgb(0 0 0 / 0.35);
      border: 1px solid rgb(255 255 255 / 0.06);
    }
    .seg button {
      min-width: 0; min-height: 38px; padding: 6px 4px;
      border: 0; border-radius: 10px; background: transparent; color: inherit;
      font: inherit; font-size: 13px; font-weight: 750; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .seg button.on { background: #fff; color: #111; }
    .slide { display: grid; gap: 6px; margin-top: 12px; }
    .slide input { width: 100%; accent-color: #f0d48a; }
    #side-wrap select {
      width: 100%; min-height: 40px; border-radius: 12px; padding: 0 12px;
      border: 1px solid rgb(255 255 255 / 0.1); background: rgb(0 0 0 / 0.35);
      color: inherit; font: inherit;
    }
    .acts { display: flex; gap: 8px; margin-top: 14px; }
    .run, .ghost { border-radius: 12px; min-height: 44px; padding: 0 16px; font: inherit; font-weight: 750; cursor: pointer; }
    .run { flex: 1; border: 0; background: linear-gradient(180deg, #fff, #e7eaf2); color: #111; }
    .run:disabled { opacity: 1; background: rgb(255 255 255 / 0.12); color: rgb(244 247 255 / 0.4); cursor: default; }
    .ghost { border: 1px solid rgb(255 255 255 / 0.16); background: transparent; color: inherit; }
    .note { min-height: 1.3em; margin: 12px 4px 0; color: #f3e7c4; font-size: 14px; font-weight: 650; }
    @media (max-width: 720px) {
      .view, .view img, .stage { min-height: 220px; height: auto; }
      .view img { height: 220px; }
      .head { align-items: flex-start; }
      .seg button { font-size: 12.5px; }
      main { width: min(920px, calc(100% - 20px)); }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="home" href="/">Nibras Code</a>
    <div class="langs" id="langs"></div>
  </header>
  <main>
    <div class="head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="#1a1206" d="M4 7.2A2.2 2.2 0 0 1 6.2 5h11.6A2.2 2.2 0 0 1 20 7.2v9.6a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 16.8V7.2Z"/><circle cx="9" cy="9.2" r="1.3" fill="#f6e7c1"/><path fill="#f6e7c1" d="M6.8 16.2 10 12.2l2.1 2.2 1.5-1.5 3.6 3.3H6.8Z"/></svg>
      </div>
      <div>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
      </div>
    </div>
    <section class="studio">
      <div class="stage">
        <div class="view" id="view" hidden>
          <figure><img id="before" alt="" /><figcaption id="before-cap"></figcaption></figure>
          <figure id="after-fig" hidden><img id="after" alt="" /><figcaption id="after-cap"></figcaption></figure>
        </div>
        <label class="drop">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
          <b id="drop"></b>
          <span id="meta"></span>
        </label>
      </div>
      <div class="dock">
        <div class="field">
          <span id="job-label"></span>
          <div class="seg" id="jobs"></div>
        </div>
        <label class="slide" id="quality-wrap"><span id="quality-label"></span><input id="quality" type="range" min="40" max="95" value="72" /></label>
        <div class="field">
          <span id="format-label"></span>
          <div class="seg" id="formats"></div>
        </div>
        <div class="field" id="side-wrap"><span id="side-label"></span><select id="side"></select></div>
        <div class="acts">
          <button class="run" id="run" type="button" disabled></button>
          <button class="ghost" id="save" type="button" hidden></button>
          <button class="ghost" id="reset" type="button" hidden></button>
        </div>
      </div>
    </section>
    <p class="note" id="note"></p>
  </main>
  <script>
    var UI = {
      az: { title: "Nibras Image", lead: "Şəkli sıx, JPG, PNG və WebP arasında çevir, uzun tərəfi qısalt. Şəkil cihazdan çıxmır.", drop: "Şəkil seç", empty: "Şəkil cihazda qalır. Hesab lazım deyil.", job: "İş", compress: "Sıx", convert: "Çevir", resize: "Ölçü", quality: "Keyfiyyət", format: "Format", side: "Uzun tərəf", original: "Orijinal", run: "Hazırla", working: "Hazırlanır…", save: "Yüklə", reset: "Başqa şəkil", ready: "Hazırdır.", fail: "Bu şəkil açılmadı. JPG, PNG və ya WebP yoxla.", bigger: "Bu format kiçilmədi. JPG və ya WebP seç.", before: "Əvvəl", after: "Sonra" },
      en: { title: "Nibras Image", lead: "Compress a photo, convert JPG, PNG and WebP, and shorten the long side. The photo never leaves the device.", drop: "Choose a photo", empty: "The photo stays on this device.", job: "Job", compress: "Compress", convert: "Convert", resize: "Resize", quality: "Quality", format: "Format", side: "Long side", original: "Original", run: "Make it", working: "Working…", save: "Download", reset: "Another photo", ready: "Done.", fail: "This photo did not open. Try JPG, PNG or WebP.", bigger: "This format did not get smaller. Choose JPG or WebP.", before: "Before", after: "After" },
      tr: { title: "Nibras Image", lead: "Fotoğrafı sıkıştır, JPG, PNG ve WebP arasında çevir, uzun kenarı kısalt. Fotoğraf cihazdan çıkmaz.", drop: "Fotoğraf seç", empty: "Fotoğraf cihazda kalır.", job: "İş", compress: "Sıkıştır", convert: "Çevir", resize: "Boyut", quality: "Kalite", format: "Biçim", side: "Uzun kenar", original: "Orijinal", run: "Hazırla", working: "Hazırlanıyor…", save: "İndir", reset: "Başka fotoğraf", ready: "Hazır.", fail: "Bu fotoğraf açılmadı. JPG, PNG veya WebP dene.", bigger: "Bu biçim küçülmedi. JPG veya WebP seç.", before: "Önce", after: "Sonra" },
      ar: { title: "Nibras Image", lead: "اضغط الصورة، حوّل بين JPG وPNG وWebP، وقصّر الضلع الطويل. الصورة لا تغادر الجهاز.", drop: "اختر صورة", empty: "تبقى الصورة على الجهاز.", job: "العمل", compress: "اضغط", convert: "حوّل", resize: "الحجم", quality: "الجودة", format: "الصيغة", side: "الضلع الطويل", original: "الأصل", run: "جهّز", working: "جارٍ التجهيز…", save: "تنزيل", reset: "صورة أخرى", ready: "تم.", fail: "لم تُفتح الصورة. جرّب JPG أو PNG أو WebP.", bigger: "هذه الصيغة لم تصغر. اختر JPG أو WebP.", before: "قبل", after: "بعد" },
      ru: { title: "Nibras Image", lead: "Сожмите фото, переведите JPG, PNG и WebP и укоротите длинную сторону. Фото не уходит с устройства.", drop: "Выберите фото", empty: "Фото остаётся на устройстве.", job: "Задача", compress: "Сжать", convert: "Формат", resize: "Размер", quality: "Качество", format: "Формат", side: "Длинная сторона", original: "Оригинал", run: "Сделать", working: "Готовится…", save: "Скачать", reset: "Другое фото", ready: "Готово.", fail: "Фото не открылось. Попробуйте JPG, PNG или WebP.", bigger: "Этот формат не стал меньше. Выберите JPG или WebP.", before: "До", after: "После" }
    };
    var lang = localStorage.getItem("nibras-image-lang") || ((navigator.language || "az").slice(0, 2));
    if (!UI[lang]) lang = "az";
    var job = "compress", format = "webp", file = null, result = null, beforeUrl = "";
    var fileInput = document.getElementById("file");
    var quality = document.getElementById("quality");
    var side = document.getElementById("side");

    function t() { return UI[lang]; }
    function kb(n) { return n < 1024 ? n + " B" : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
    function paint() {
      var c = t();
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = c.title + " — Nibras";
      document.getElementById("title").textContent = c.title;
      document.getElementById("lead").textContent = c.lead;
      document.getElementById("drop").textContent = c.drop;
      document.getElementById("meta").textContent = file ? file.name + " · " + kb(file.size) : c.empty;
      document.getElementById("quality-label").textContent = c.quality + " " + quality.value;
      document.getElementById("side-label").textContent = c.side;
      document.getElementById("run").textContent = c.run;
      document.getElementById("save").textContent = c.save;
      document.getElementById("reset").textContent = c.reset;
      document.getElementById("before-cap").textContent = c.before;
      document.getElementById("after-cap").textContent = c.after;
      document.getElementById("quality-wrap").hidden = job === "resize";
      document.getElementById("side-wrap").hidden = job !== "resize";
      document.getElementById("langs").innerHTML = ["az", "en", "tr", "ar", "ru"].map(function (id) {
        return '<button type="button" data-lang="' + id + '"' + (id === lang ? ' class="on"' : "") + ">" + id.toUpperCase() + "</button>";
      }).join("");
      document.getElementById("job-label").textContent = c.job;
      document.getElementById("format-label").textContent = c.format;
      document.getElementById("jobs").innerHTML = ["compress", "convert", "resize"].map(function (id) {
        return '<button type="button" data-job="' + id + '"' + (id === job ? ' class="on"' : "") + ">" + c[id] + "</button>";
      }).join("");
      document.getElementById("formats").innerHTML = ["webp", "jpeg", "png"].map(function (id) {
        return '<button type="button" data-format="' + id + '"' + (id === format ? ' class="on"' : "") + ">" + (id === "jpeg" ? "JPG" : id.toUpperCase()) + "</button>";
      }).join("");
      side.innerHTML = [0, 640, 1280, 1920].map(function (px) {
        return '<option value="' + px + '"' + (Number(side.value || 1280) === px ? " selected" : "") + ">" + (px ? px + "px" : c.original) + "</option>";
      }).join("");
    }
    function loadImage(blob) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(blob);
        var image = new Image();
        image.onload = function () { URL.revokeObjectURL(url); resolve(image); };
        image.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image")); };
        image.src = url;
      });
    }
    function canvasBlob(canvas, mime, q) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("blob")); }, mime, q);
      });
    }
    async function run() {
      if (!file) return;
      var button = document.getElementById("run");
      button.disabled = true;
      button.textContent = t().working;
      document.getElementById("note").textContent = "";
      try {
        var image = await loadImage(file);
        var limit = job === "resize" ? Number(side.value) : job === "compress" ? 2560 : 0;
        var scale = limit > 0 ? Math.min(1, limit / Math.max(image.width, image.height)) : 1;
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        var ctx = canvas.getContext("2d");
        if (format === "jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        var mime = format === "png" ? "image/png" : format === "webp" ? "image/webp" : "image/jpeg";
        var blob = await canvasBlob(canvas, mime, format === "png" ? 1 : Number(quality.value) / 100);
        result = { blob: blob, name: "nibras-image." + (format === "jpeg" ? "jpg" : format), mime: mime };
        var after = document.getElementById("after");
        if (after.src && after.src.indexOf("blob:") === 0) URL.revokeObjectURL(after.src);
        after.src = URL.createObjectURL(blob);
        document.getElementById("after-fig").hidden = false;
        document.getElementById("view").hidden = false;
        document.getElementById("save").hidden = false;
        document.getElementById("after-cap").textContent = t().after + " · " + canvas.width + "×" + canvas.height + " · " + kb(blob.size);
        document.getElementById("note").textContent = t().ready + " " + kb(file.size) + " → " + kb(blob.size) + (blob.size >= file.size ? " " + t().bigger : "");
      } catch (e) {
        document.getElementById("note").textContent = t().fail;
      } finally {
        button.disabled = !file;
        button.textContent = t().run;
      }
    }
    function save() {
      if (!result) return;
      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = String(reader.result);
        if (window.NibrasApk && typeof window.NibrasApk.save === "function") {
          window.NibrasApk.save(result.name, dataUrl, result.mime);
          return;
        }
        var a = document.createElement("a");
        a.href = URL.createObjectURL(result.blob);
        a.download = result.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
      reader.readAsDataURL(result.blob);
    }
    document.body.addEventListener("click", function (event) {
      var el = event.target.closest("button");
      if (!el) return;
      if (el.dataset.lang) { lang = el.dataset.lang; localStorage.setItem("nibras-image-lang", lang); paint(); }
      if (el.dataset.job) { job = el.dataset.job; paint(); }
      if (el.dataset.format) { format = el.dataset.format; paint(); }
      if (el.id === "run") run();
      if (el.id === "save") save();
      if (el.id === "reset") {
        file = null; result = null; fileInput.value = "";
        document.getElementById("view").hidden = true;
        document.getElementById("after-fig").hidden = true;
        document.getElementById("save").hidden = true;
        document.getElementById("reset").hidden = true;
        document.getElementById("run").disabled = true;
        document.getElementById("note").textContent = "";
        paint();
      }
    });
    fileInput.addEventListener("change", function () {
      file = fileInput.files && fileInput.files[0];
      result = null;
      document.getElementById("save").hidden = true;
      document.getElementById("reset").hidden = !file;
      document.getElementById("run").disabled = !file;
      document.getElementById("note").textContent = "";
      if (beforeUrl) URL.revokeObjectURL(beforeUrl);
      if (file) {
        beforeUrl = URL.createObjectURL(file);
        document.getElementById("before").src = beforeUrl;
        document.getElementById("before-cap").textContent = t().before + " · " + kb(file.size);
        document.getElementById("after").removeAttribute("src");
        document.getElementById("after-fig").hidden = true;
        document.getElementById("view").hidden = false;
      }
      paint();
    });
    quality.addEventListener("input", paint);
    side.value = "1280";
    paint();
    window.NibrasImage = { version: 1 };
  </script>
</body>
</html>
