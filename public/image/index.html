<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Şəkil sıx və çevir — Nibras</title>
  <meta name="description" content="Şəkli sıx, JPG, PNG və WebP arasında çevir, ölçüsünü qısalt. Şəkil cihazdan çıxmır." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; color: #e7eefc;
      font: 16px/1.45 Manrope, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 80% -10%, rgb(70 110 255 / 0.28), transparent 60%),
        radial-gradient(700px 380px at 0% 100%, rgb(40 180 255 / 0.16), transparent 55%),
        #070b16;
    }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; }
    .brand { color: inherit; text-decoration: none; font-weight: 800; letter-spacing: -0.03em; }
    .brand em { color: #8eb6ff; font-style: normal; }
    .langs { display: flex; gap: 6px; }
    .langs button, .row button, .acts button, select {
      border: 1px solid rgb(150 180 255 / 0.28); background: rgb(12 18 36 / 0.8);
      color: #d7e2fb; border-radius: 999px; min-height: 34px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .langs button.on, .row button.on { background: #f4f7ff; color: #10131c; border-color: transparent; }
    main { width: min(720px, calc(100% - 28px)); margin: 0 auto 40px; }
    h1 { margin: 8px 0 6px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.04em; }
    .lead { margin: 0 0 16px; color: #b7c3de; }
    .card { padding: 16px; border-radius: 22px; border: 1px solid rgb(150 180 255 / 0.22); background: rgb(8 12 24 / 0.72); }
    .drop { display: grid; gap: 4px; padding: 18px; border: 1px dashed rgb(160 190 255 / 0.4); border-radius: 16px; cursor: pointer; }
    .drop input { display: none; }
    .row, .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    .row span, label.slide span { color: #9aabc8; font-size: 13px; }
    label.slide { display: grid; gap: 6px; margin-top: 12px; }
    input[type="range"] { width: 100%; accent-color: #7eb6ff; }
    select { border-radius: 12px; }
    .run { background: #2f6bff; color: white; border: 0; border-radius: 12px; min-height: 42px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .run:disabled { opacity: 0.45; cursor: default; }
    .note { min-height: 1.4em; margin: 12px 0 0; color: #9ef0d8; font-weight: 650; }
    .view { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .view figure { margin: 0; }
    .view img { width: 100%; max-height: 280px; object-fit: contain; border-radius: 14px; background: repeating-conic-gradient(#1a2233 0% 25%, #101621 0% 50%) 50% / 16px 16px; }
    .view figcaption { margin-top: 4px; color: #9aabc8; font-size: 12px; }
    @media (max-width: 640px) { .view { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Nibras <em>Image</em></a>
    <div class="langs" id="langs"></div>
  </header>
  <main>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <section class="card">
      <label class="drop">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
        <b id="drop"></b>
        <span id="meta"></span>
      </label>
      <div class="row" id="jobs"></div>
      <label class="slide" id="quality-wrap"><span id="quality-label"></span><input id="quality" type="range" min="40" max="95" value="72" /></label>
      <div class="row" id="formats"></div>
      <label class="slide" id="side-wrap"><span id="side-label"></span>
        <select id="side"></select>
      </label>
      <div class="view" id="view" hidden>
        <figure><img id="before" alt="" /><figcaption id="before-cap"></figcaption></figure>
        <figure><img id="after" alt="" /><figcaption id="after-cap"></figcaption></figure>
      </div>
      <div class="acts">
        <button class="run" id="run" type="button" disabled></button>
        <button id="save" type="button" hidden></button>
        <button id="reset" type="button" hidden></button>
      </div>
    </section>
    <p class="note" id="note"></p>
  </main>
  <script>
    var UI = {
      az: { title: "Şəkil sıx və çevir", lead: "Şəkli sıx, JPG, PNG və WebP arasında çevir, uzun tərəfi qısalt. Şəkil cihazdan çıxmır.", drop: "Şəkil seç", empty: "Şəkil cihazda qalır.", job: "İş", compress: "Sıx", convert: "Çevir", resize: "Ölçü", quality: "Keyfiyyət", format: "Format", side: "Uzun tərəf", original: "Orijinal", run: "Hazırla", working: "Hazırlanır…", save: "Yüklə", reset: "Başqa şəkil", ready: "Hazırdır.", fail: "Bu şəkil açılmadı. JPG, PNG və ya WebP yoxla.", bigger: "Bu format kiçilmədi. JPG və ya WebP seç.", before: "Əvvəl", after: "Sonra" },
      en: { title: "Compress and convert", lead: "Compress a photo, convert JPG, PNG and WebP, and shorten the long side. The photo never leaves the device.", drop: "Choose a photo", empty: "The photo stays on this device.", job: "Job", compress: "Compress", convert: "Convert", resize: "Resize", quality: "Quality", format: "Format", side: "Long side", original: "Original", run: "Make it", working: "Working…", save: "Download", reset: "Another photo", ready: "Done.", fail: "This photo did not open. Try JPG, PNG or WebP.", bigger: "This format did not get smaller. Choose JPG or WebP.", before: "Before", after: "After" },
      tr: { title: "Fotoğraf sıkıştır ve çevir", lead: "Fotoğrafı sıkıştır, JPG, PNG ve WebP arasında çevir, uzun kenarı kısalt. Fotoğraf cihazdan çıkmaz.", drop: "Fotoğraf seç", empty: "Fotoğraf cihazda kalır.", job: "İş", compress: "Sıkıştır", convert: "Çevir", resize: "Boyut", quality: "Kalite", format: "Biçim", side: "Uzun kenar", original: "Orijinal", run: "Hazırla", working: "Hazırlanıyor…", save: "İndir", reset: "Başka fotoğraf", ready: "Hazır.", fail: "Bu fotoğraf açılmadı. JPG, PNG veya WebP dene.", bigger: "Bu biçim küçülmedi. JPG veya WebP seç.", before: "Önce", after: "Sonra" },
      ar: { title: "اضغط الصورة وحوّلها", lead: "اضغط الصورة، حوّل بين JPG وPNG وWebP، وقصّر الضلع الطويل. الصورة لا تغادر الجهاز.", drop: "اختر صورة", empty: "تبقى الصورة على الجهاز.", job: "العمل", compress: "اضغط", convert: "حوّل", resize: "الحجم", quality: "الجودة", format: "الصيغة", side: "الضلع الطويل", original: "الأصل", run: "جهّز", working: "جارٍ التجهيز…", save: "تنزيل", reset: "صورة أخرى", ready: "تم.", fail: "لم تُفتح الصورة. جرّب JPG أو PNG أو WebP.", bigger: "هذه الصيغة لم تصغر. اختر JPG أو WebP.", before: "قبل", after: "بعد" },
      ru: { title: "Сжать и конвертировать", lead: "Сожмите фото, переведите JPG, PNG и WebP и укоротите длинную сторону. Фото не уходит с устройства.", drop: "Выберите фото", empty: "Фото остаётся на устройстве.", job: "Задача", compress: "Сжать", convert: "Конвертировать", resize: "Размер", quality: "Качество", format: "Формат", side: "Длинная сторона", original: "Оригинал", run: "Сделать", working: "Готовится…", save: "Скачать", reset: "Другое фото", ready: "Готово.", fail: "Фото не открылось. Попробуйте JPG, PNG или WebP.", bigger: "Этот формат не стал меньше. Выберите JPG или WebP.", before: "До", after: "После" }
    };
    var lang = localStorage.getItem("nibras-image-lang") || ((navigator.language || "az").slice(0, 2));
    if (!UI[lang]) lang = "az";
    var job = "compress", format = "webp", file = null, result = null, beforeUrl = "";
    var fileInput = document.getElementById("file");
    var quality = document.getElementById("quality");
    var side = document.getElementById("side");

    function t() { return UI[lang]; }
    function kb(n) { return n < 1024 ? n + " B" : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
    function paint() {
      var c = t();
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = c.title + " — Nibras";
      document.getElementById("title").textContent = c.title;
      document.getElementById("lead").textContent = c.lead;
      document.getElementById("drop").textContent = c.drop;
      document.getElementById("meta").textContent = file ? file.name + " · " + kb(file.size) : c.empty;
      document.getElementById("quality-label").textContent = c.quality + " " + quality.value;
      document.getElementById("side-label").textContent = c.side;
      document.getElementById("run").textContent = c.run;
      document.getElementById("save").textContent = c.save;
      document.getElementById("reset").textContent = c.reset;
      document.getElementById("before-cap").textContent = c.before;
      document.getElementById("after-cap").textContent = c.after;
      document.getElementById("quality-wrap").hidden = job === "resize";
      document.getElementById("side-wrap").hidden = job !== "resize";
      document.getElementById("langs").innerHTML = ["az", "en", "tr", "ar", "ru"].map(function (id) {
        return '<button type="button" data-lang="' + id + '"' + (id === lang ? ' class="on"' : "") + ">" + id.toUpperCase() + "</button>";
      }).join("");
      document.getElementById("jobs").innerHTML = '<span>' + c.job + "</span>" + ["compress", "convert", "resize"].map(function (id) {
        return '<button type="button" data-job="' + id + '"' + (id === job ? ' class="on"' : "") + ">" + c[id] + "</button>";
      }).join("");
      document.getElementById("formats").innerHTML = '<span>' + c.format + "</span>" + ["webp", "jpeg", "png"].map(function (id) {
        return '<button type="button" data-format="' + id + '"' + (id === format ? ' class="on"' : "") + ">" + (id === "jpeg" ? "JPG" : id.toUpperCase()) + "</button>";
      }).join("");
      side.innerHTML = [0, 640, 1280, 1920].map(function (px) {
        return '<option value="' + px + '"' + (Number(side.value || 1280) === px ? " selected" : "") + ">" + (px ? px + "px" : c.original) + "</option>";
      }).join("");
    }
    function loadImage(blob) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(blob);
        var image = new Image();
        image.onload = function () { URL.revokeObjectURL(url); resolve(image); };
        image.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image")); };
        image.src = url;
      });
    }
    function canvasBlob(canvas, mime, q) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("blob")); }, mime, q);
      });
    }
    async function run() {
      if (!file) return;
      var button = document.getElementById("run");
      button.disabled = true;
      button.textContent = t().working;
      document.getElementById("note").textContent = "";
      try {
        var image = await loadImage(file);
        var limit = job === "resize" ? Number(side.value) : job === "compress" ? 2560 : 0;
        var scale = limit > 0 ? Math.min(1, limit / Math.max(image.width, image.height)) : 1;
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        var ctx = canvas.getContext("2d");
        if (format === "jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        var mime = format === "png" ? "image/png" : format === "webp" ? "image/webp" : "image/jpeg";
        var blob = await canvasBlob(canvas, mime, format === "png" ? 1 : Number(quality.value) / 100);
        result = { blob: blob, name: "nibras-image." + (format === "jpeg" ? "jpg" : format), mime: mime };
        var after = document.getElementById("after");
        if (after.src && after.src.indexOf("blob:") === 0) URL.revokeObjectURL(after.src);
        after.src = URL.createObjectURL(blob);
        document.getElementById("view").hidden = false;
        document.getElementById("save").hidden = false;
        document.getElementById("after-cap").textContent = t().after + " · " + canvas.width + "×" + canvas.height + " · " + kb(blob.size);
        document.getElementById("note").textContent = t().ready + " " + kb(file.size) + " → " + kb(blob.size) + (blob.size >= file.size ? " " + t().bigger : "");
      } catch (e) {
        document.getElementById("note").textContent = t().fail;
      } finally {
        button.disabled = !file;
        button.textContent = t().run;
      }
    }
    function save() {
      if (!result) return;
      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = String(reader.result);
        if (window.NibrasApk && typeof window.NibrasApk.save === "function") {
          window.NibrasApk.save(result.name, dataUrl, result.mime);
          return;
        }
        var a = document.createElement("a");
        a.href = URL.createObjectURL(result.blob);
        a.download = result.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
      reader.readAsDataURL(result.blob);
    }
    document.body.addEventListener("click", function (event) {
      var el = event.target.closest("button");
      if (!el) return;
      if (el.dataset.lang) { lang = el.dataset.lang; localStorage.setItem("nibras-image-lang", lang); paint(); }
      if (el.dataset.job) { job = el.dataset.job; paint(); }
      if (el.dataset.format) { format = el.dataset.format; paint(); }
      if (el.id === "run") run();
      if (el.id === "save") save();
      if (el.id === "reset") {
        file = null; result = null; fileInput.value = "";
        document.getElementById("view").hidden = true;
        document.getElementById("save").hidden = true;
        document.getElementById("reset").hidden = true;
        document.getElementById("run").disabled = true;
        document.getElementById("note").textContent = "";
        paint();
      }
    });
    fileInput.addEventListener("change", function () {
      file = fileInput.files && fileInput.files[0];
      result = null;
      document.getElementById("save").hidden = true;
      document.getElementById("reset").hidden = !file;
      document.getElementById("run").disabled = !file;
      document.getElementById("note").textContent = "";
      if (beforeUrl) URL.revokeObjectURL(beforeUrl);
      if (file) {
        beforeUrl = URL.createObjectURL(file);
        document.getElementById("before").src = beforeUrl;
        document.getElementById("before-cap").textContent = t().before + " · " + kb(file.size);
        document.getElementById("after").removeAttribute("src");
        document.getElementById("view").hidden = false;
      }
      paint();
    });
    quality.addEventListener("input", paint);
    side.value = "1280";
    paint();
    window.NibrasImage = { version: 1 };
  </script>
</body>
</html>
