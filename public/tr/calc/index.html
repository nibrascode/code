<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>ProCalc — hesap makinesi</title>
  <meta name="description" content="Bilimsel hesap makinesi, birim çevirici, indirim, kredi, VKİ ve tarih farkı. Hesap cihazda kalır." />
  <link rel="canonical" href="https://nibrascode.com/tr/calc" />
  <link rel="alternate" hreflang="az" href="https://nibrascode.com/calc" />
  <link rel="alternate" hreflang="en" href="https://nibrascode.com/en/calc" />
  <link rel="alternate" hreflang="tr" href="https://nibrascode.com/tr/calc" />
  <link rel="alternate" hreflang="ar" href="https://nibrascode.com/ar/calc" />
  <link rel="alternate" hreflang="ru" href="https://nibrascode.com/ru/calc" />
  <link rel="alternate" hreflang="x-default" href="https://nibrascode.com/calc" />
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-alt: #0b1120; --btn: #334155; --btn-hover: #475569;
      --btn-sci: #1e293b; --accent: #6366f1; --accent-hover: #4f46e5; --op: #3b82f6; --danger: #ef4444;
      --success: #10b981; --text: #f8fafc; --muted: #94a3b8; --border: #334155;
    }
    [data-theme="light"] {
      --bg: #f1f5f9; --panel: #ffffff; --panel-alt: #f8fafc; --btn: #e2e8f0; --btn-hover: #cbd5e1;
      --btn-sci: #f1f5f9; --accent: #4f46e5; --accent-hover: #4338ca; --op: #2563eb; --danger: #dc2626;
      --success: #059669; --text: #0f172a; --muted: #64748b; --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input, select { user-select: text; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100dvh; }
    .app-container { width: 100%; max-width: 460px; height: 100dvh; display: flex; flex-direction: column; background: var(--panel); box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--panel-alt); border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: var(--btn); color: var(--text); border: none; padding: 6px 10px; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel-alt); padding: 6px; gap: 4px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: transparent; color: var(--muted); border: none; padding: 8px 4px; border-radius: 8px; font-size: .8rem; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; min-height: 0; }
    .view.active { display: flex; }
    .display-box { padding: 16px; background: var(--panel-alt); display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; min-height: 125px; border-bottom: 1px solid var(--border); position: relative; }
    .status-row { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); font-weight: 600; }
    .expression { font-size: 1.05rem; color: var(--muted); min-height: 24px; word-break: break-all; text-align: right; margin-top: 18px; }
    .result { font-size: clamp(1.35rem, 7vw, 2.3rem); font-weight: 700; word-break: break-all; text-align: right; margin-top: 4px; cursor: pointer; }
    .toolbar-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .mem-btn { background: var(--btn-sci); color: var(--muted); border: 1px solid var(--border); padding: 7px 0; border-radius: 6px; font-size: .78rem; font-weight: 600; cursor: pointer; }
    .mem-btn.active-mode { color: var(--accent); border-color: var(--accent); }
    .sci-pad { display: none; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 12px 0; background: var(--panel); }
    .sci-pad.open { display: grid; }
    .sci-btn { background: var(--btn-sci); color: var(--text); border: 1px solid var(--border); padding: 10px 0; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .keypad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: var(--panel); }
    .key { border: none; border-radius: 12px; font-size: 1.25rem; font-weight: 600; background: var(--btn); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 48px; }
    .key:active, .sci-btn:active, .mem-btn:active { transform: scale(.95); }
    .key.op { background: rgba(59,130,246,.18); color: var(--op); font-size: 1.35rem; }
    .key.danger { background: rgba(239,68,68,.16); color: var(--danger); }
    .key.equal { background: var(--accent); color: #fff; }
    .section-pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card-title { font-size: .95rem; font-weight: 700; color: var(--accent); }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: .78rem; color: var(--muted); font-weight: 600; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: .95rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    .output-box { background: var(--panel); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 6px; font-size: .9rem; line-height: 1.5; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { background: var(--panel-alt); border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
    .history-exp { font-size: .85rem; color: var(--muted); word-break: break-all; }
    .history-res { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: .82rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="brand" href="/tr">⚡ ProCalc</a>
      <div class="header-actions">
        <select class="icon-btn" id="langPick" aria-label="Language">
          <option value="az">AZ</option>
          <option value="en">EN</option>
          <option value="tr">TR</option>
          <option value="ar">AR</option>
          <option value="ru">RU</option>
        </select>
        <button class="icon-btn" id="copyBtn" type="button">📋 Kopyala</button>
        <button class="icon-btn" id="themeBtn" type="button">☀️/🌙</button>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" type="button" onclick="switchTab('calc', this)">🧮 Hesapla</button>
      <button class="tab-btn" type="button" onclick="switchTab('conv', this)">🔄 Çevirici</button>
      <button class="tab-btn" type="button" onclick="switchTab('tools', this)">💼 Araçlar</button>
      <button class="tab-btn" type="button" onclick="switchTab('hist', this)">🕒 Geçmiş</button>
    </div>
    <div id="view-calc" class="view active">
      <div class="display-box" onclick="copyResult()">
        <div class="status-row"><span id="angleIndicator">MOD: DEG</span><span id="memIndicator"></span></div>
        <div class="expression" id="expDisplay"></div>
        <div class="result" id="resDisplay">0</div>
      </div>
      <div class="toolbar-row">
        <button class="mem-btn active-mode" id="sciToggleBtn" type="button" onclick="toggleSci()">BİLİM ▾</button>
        <button class="mem-btn" id="degRadBtn" type="button" onclick="toggleDegRad()">DEG</button>
        <button class="mem-btn" type="button" onclick="memAction('MC')">MC</button>
        <button class="mem-btn" type="button" onclick="memAction('MR')">MR</button>
        <button class="mem-btn" type="button" onclick="memAction('M+')">M+</button>
        <button class="mem-btn" type="button" onclick="memAction('M-')">M-</button>
      </div>
      <div class="sci-pad open" id="sciPad">
        <button class="sci-btn" type="button" onclick="insertToken('sin(')">sin</button>
        <button class="sci-btn" type="button" onclick="insertToken('cos(')">cos</button>
        <button class="sci-btn" type="button" onclick="insertToken('tan(')">tan</button>
        <button class="sci-btn" type="button" onclick="insertToken('log(')">log</button>
        <button class="sci-btn" type="button" onclick="insertToken('ln(')">ln</button>
        <button class="sci-btn" type="button" onclick="insertToken('(')">(</button>
        <button class="sci-btn" type="button" onclick="insertToken(')')">)</button>
        <button class="sci-btn" type="button" onclick="insertToken('sqrt(')">√x</button>
        <button class="sci-btn" type="button" onclick="insertToken('^2')">x²</button>
        <button class="sci-btn" type="button" onclick="insertToken('^')">xʸ</button>
        <button class="sci-btn" type="button" onclick="applyFactorial()">n!</button>
        <button class="sci-btn" type="button" onclick="insertToken('π')">π</button>
        <button class="sci-btn" type="button" onclick="insertToken('e')">e</button>
        <button class="sci-btn" type="button" onclick="invertVal()">1/x</button>
        <button class="sci-btn" type="button" onclick="absVal()">|x|</button>
      </div>
      <div class="keypad">
        <button class="key danger" type="button" onclick="clearAll()">AC</button>
        <button class="key danger" type="button" onclick="backspace()">⌫</button>
        <button class="key op" type="button" onclick="insertToken('%')">%</button>
        <button class="key op" type="button" onclick="insertToken('÷')">÷</button>
        <button class="key" type="button" onclick="insertToken('7')">7</button>
        <button class="key" type="button" onclick="insertToken('8')">8</button>
        <button class="key" type="button" onclick="insertToken('9')">9</button>
        <button class="key op" type="button" onclick="insertToken('×')">×</button>
        <button class="key" type="button" onclick="insertToken('4')">4</button>
        <button class="key" type="button" onclick="insertToken('5')">5</button>
        <button class="key" type="button" onclick="insertToken('6')">6</button>
        <button class="key op" type="button" onclick="insertToken('-')">−</button>
        <button class="key" type="button" onclick="insertToken('1')">1</button>
        <button class="key" type="button" onclick="insertToken('2')">2</button>
        <button class="key" type="button" onclick="insertToken('3')">3</button>
        <button class="key op" type="button" onclick="insertToken('+')">+</button>
        <button class="key" type="button" onclick="toggleSign()">±</button>
        <button class="key" type="button" onclick="insertToken('0')">0</button>
        <button class="key" type="button" onclick="insertToken('.')">.</button>
        <button class="key equal" type="button" onclick="calculate()">=</button>
      </div>
    </div>
    <div id="view-conv" class="view">
      <div class="section-pad">
        <div class="card">
          <div class="card-title">🔄 Birim çevirici</div>
          <div class="form-group">
            <label>Kategori seçin</label>
            <select id="convCategory" onchange="populateUnits()">
              <option value="length">Uzunluk (m, km, cm, mil...)</option>
              <option value="weight">Ağırlık (kg, gram, ton, libre...)</option>
              <option value="temp">Sıcaklık (°C, °F, K)</option>
              <option value="speed">Hız (km/saat, m/sn, mil/saat)</option>
              <option value="area">Alan (m², hektar, km², sot)</option>
              <option value="data">Veri boyutu (KB, MB, GB, TB)</option>
            </select>
          </div>
          <div class="form-group"><label>Değer girin</label><input type="number" id="convInput" value="1" oninput="runConversion()" /></div>
          <div class="form-row">
            <div class="form-group"><label>Hangi birimden</label><select id="convFrom" onchange="runConversion()"></select></div>
            <div class="form-group"><label>Hangi birime</label><select id="convTo" onchange="runConversion()"></select></div>
          </div>
          <div class="output-box" id="convResult">Sonuç: 100 cm</div>
        </div>
      </div>
    </div>
    <div id="view-tools" class="view">
      <div class="section-pad">
        <div class="card">
          <div class="card-title">🏷️ İndirim ve KDV</div>
          <div class="form-row">
            <div class="form-group"><label>İlk fiyat</label><input type="number" id="discPrice" placeholder="100" oninput="calcDiscount()" /></div>
            <div class="form-group"><label>İndirim (%)</label><input type="number" id="discPercent" placeholder="20" value="0" oninput="calcDiscount()" /></div>
          </div>
          <div class="form-group"><label>KDV / Vergi (%)</label><input type="number" id="discTax" placeholder="18" value="0" oninput="calcDiscount()" /></div>
          <div class="output-box" id="discOutput">Fiyatı girin...</div>
        </div>
        <div class="card">
          <div class="card-title">🏦 Kredi ve faiz</div>
          <div class="form-row">
            <div class="form-group"><label>Tutar</label><input type="number" id="loanAmount" placeholder="5000" oninput="calcLoan()" /></div>
            <div class="form-group"><label>Yıllık faiz (%)</label><input type="number" id="loanRate" placeholder="14" oninput="calcLoan()" /></div>
          </div>
          <div class="form-group"><label>Süre (ay)</label><input type="number" id="loanMonths" placeholder="12" oninput="calcLoan()" /></div>
          <div class="output-box" id="loanOutput">Bilgileri girin...</div>
        </div>
        <div class="card">
          <div class="card-title">⚖️ Vücut kitle indeksi (VKİ)</div>
          <div class="form-row">
            <div class="form-group"><label>Boy (cm)</label><input type="number" id="bmiHeight" placeholder="175" oninput="calcBMI()" /></div>
            <div class="form-group"><label>Kilo (kg)</label><input type="number" id="bmiWeight" placeholder="72" oninput="calcBMI()" /></div>
          </div>
          <div class="output-box" id="bmiOutput">Boy ve kiloyu girin...</div>
        </div>
        <div class="card">
          <div class="card-title">📅 Tarih ve yaş farkı</div>
          <div class="form-row">
            <div class="form-group"><label>Başlangıç tarihi</label><input type="date" id="dateStart" onchange="calcDateDiff()" /></div>
            <div class="form-group"><label>Bitiş tarihi</label><input type="date" id="dateEnd" onchange="calcDateDiff()" /></div>
          </div>
          <div class="output-box" id="dateOutput">Tarihleri seçin...</div>
        </div>
      </div>
    </div>
    <div id="view-hist" class="view">
      <div class="section-pad">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:700;">Hesap geçmişi</span>
          <button class="icon-btn" style="color:var(--danger)" type="button" onclick="clearHistory()">🗑️ Temizle</button>
        </div>
        <div id="historyContainer" class="history-list"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Sonuç kopyalandı!</div>
  <script>
    const CALC_LANG = (location.pathname.match(/^\/(en|tr|ar|ru)(?=\/|$)/) || [])[1] || "az";
    const CALC_I = { az: 0, en: 1, tr: 2, ar: 3, ru: 4 }[CALC_LANG];
    const CT = (row) => row[CALC_I];
    const ERR = CT(["Xəta", "Error", "Hata", "خطأ", "Ошибка"]);
    const TIME_LOCALE = CT(["az-AZ", "en-GB", "tr-TR", "ar", "ru-RU"]);
    const UNIT_LABEL = {
      az: { length: { m: "Metr (m)", km: "Kilometr (km)", cm: "Santimetr (sm)", mm: "Millimetr (mm)", mi: "Mil", ft: "Fut (ft)", "in": "Düym (in)" }, weight: { kg: "Kiloqram (kq)", g: "Qram (q)", t: "Ton (t)", lb: "Funt (lb)", oz: "Unsiya (oz)" }, speed: { kmh: "km/saat", ms: "m/saniyə", mph: "Mil/saat", kn: "Knot" }, area: { m2: "Kvadrat metr (m²)", sot: "Sot", ha: "Hektar", km2: "Kvadrat km" }, data: { KB: "Kilobayt (KB)", MB: "Meqabayt (MB)", GB: "Giqabayt (GB)", TB: "Terabayt (TB)" }, temp: { C: "Selsi (°C)", F: "Farenheyt (°F)", K: "Kelvin (K)" } },
      en: { length: { m: "Metre (m)", km: "Kilometre (km)", cm: "Centimetre (cm)", mm: "Millimetre (mm)", mi: "Mile", ft: "Foot (ft)", "in": "Inch (in)" }, weight: { kg: "Kilogram (kg)", g: "Gram (g)", t: "Tonne (t)", lb: "Pound (lb)", oz: "Ounce (oz)" }, speed: { kmh: "km/h", ms: "m/s", mph: "mph", kn: "Knot" }, area: { m2: "Square metre (m²)", sot: "Are (sot)", ha: "Hectare", km2: "Square km" }, data: { KB: "Kilobyte (KB)", MB: "Megabyte (MB)", GB: "Gigabyte (GB)", TB: "Terabyte (TB)" }, temp: { C: "Celsius (°C)", F: "Fahrenheit (°F)", K: "Kelvin (K)" } },
      tr: { length: { m: "Metre (m)", km: "Kilometre (km)", cm: "Santimetre (cm)", mm: "Milimetre (mm)", mi: "Mil", ft: "Fit (ft)", "in": "İnç (in)" }, weight: { kg: "Kilogram (kg)", g: "Gram (g)", t: "Ton (t)", lb: "Libre (lb)", oz: "Ons (oz)" }, speed: { kmh: "km/saat", ms: "m/saniye", mph: "Mil/saat", kn: "Knot" }, area: { m2: "Metrekare (m²)", sot: "Sot", ha: "Hektar", km2: "Kilometrekare" }, data: { KB: "Kilobayt (KB)", MB: "Megabayt (MB)", GB: "Gigabayt (GB)", TB: "Terabayt (TB)" }, temp: { C: "Santigrat (°C)", F: "Fahrenhayt (°F)", K: "Kelvin (K)" } },
      ar: { length: { m: "متر (m)", km: "كيلومتر (km)", cm: "سنتيمتر (cm)", mm: "مليمتر (mm)", mi: "ميل", ft: "قدم (ft)", "in": "بوصة (in)" }, weight: { kg: "كيلوغرام (kg)", g: "غرام (g)", t: "طن (t)", lb: "رطل (lb)", oz: "أونصة (oz)" }, speed: { kmh: "كم/ساعة", ms: "م/ثانية", mph: "ميل/ساعة", kn: "عقدة" }, area: { m2: "متر مربع (m²)", sot: "سوت", ha: "هكتار", km2: "كيلومتر مربع" }, data: { KB: "كيلوبايت (KB)", MB: "ميغابايت (MB)", GB: "غيغابايت (GB)", TB: "تيرابايت (TB)" }, temp: { C: "مئوية (°C)", F: "فهرنهايت (°F)", K: "كلفن (K)" } },
      ru: { length: { m: "Метр (m)", km: "Километр (km)", cm: "Сантиметр (cm)", mm: "Миллиметр (mm)", mi: "Миля", ft: "Фут (ft)", "in": "Дюйм (in)" }, weight: { kg: "Килограмм (kg)", g: "Грамм (g)", t: "Тонна (t)", lb: "Фунт (lb)", oz: "Унция (oz)" }, speed: { kmh: "км/ч", ms: "м/с", mph: "миль/ч", kn: "Узел" }, area: { m2: "Квадратный метр (m²)", sot: "Сотка", ha: "Гектар", km2: "Квадратный км" }, data: { KB: "Килобайт (KB)", MB: "Мегабайт (MB)", GB: "Гигабайт (GB)", TB: "Терабайт (TB)" }, temp: { C: "Цельсий (°C)", F: "Фаренгейт (°F)", K: "Кельвин (K)" } }
    };
    const CHROME = {
      "📋 Kopyala": CT(["📋 Kopyala", "📋 Copy", "📋 Kopyala", "📋 انسخ", "📋 Копировать"]),
      "🧮 Hesabla": CT(["🧮 Hesabla", "🧮 Calculate", "🧮 Hesapla", "🧮 احسب", "🧮 Считать"]),
      "🔄 Çevirici": CT(["🔄 Çevirici", "🔄 Convert", "🔄 Çevirici", "🔄 حوّل", "🔄 Перевод"]),
      "💼 Alətlər": CT(["💼 Alətlər", "💼 Tools", "💼 Araçlar", "💼 أدوات", "💼 Инструменты"]),
      "🕒 Tarixçə": CT(["🕒 Tarixçə", "🕒 History", "🕒 Geçmiş", "🕒 السجل", "🕒 История"]),
      "REJİM: DEG": CT(["REJİM: DEG", "MODE: DEG", "MOD: DEG", "الوضع: DEG", "РЕЖИМ: DEG"]),
      "ELMİ ▾": CT(["ELMİ ▾", "SCI ▾", "BİLİM ▾", "علمي ▾", "НАУЧ ▾"]),
      "🔄 Universal Vahid Çevirici": CT(["🔄 Universal Vahid Çevirici", "🔄 Unit converter", "🔄 Birim çevirici", "🔄 محوّل الوحدات", "🔄 Перевод единиц"]),
      "Kateqoriya seçin": CT(["Kateqoriya seçin", "Category", "Kategori seçin", "اختر الفئة", "Категория"]),

        if (to === "C") out = celsius;
        if (to === "F") out = celsius * 9 / 5 + 32;
        if (to === "K") out = celsius + 273.15;
      } else {
        out = (val * unitsData[cat].rates[from]) / unitsData[cat].rates[to];
      }
      resBox.innerHTML = CT(["Nəticə: ", "Result: ", "Sonuç: ", "النتيجة: ", "Результат: "]) + "<strong>" + Number(out.toPrecision(8)) + " " + to + "</strong>";
    }
    function calcDiscount() {
      const p = parseFloat(document.getElementById("discPrice").value) || 0;
      const d = parseFloat(document.getElementById("discPercent").value) || 0;
      const t = parseFloat(document.getElementById("discTax").value) || 0;
      const saved = p * (d / 100);
      const discounted = p - saved;
      const taxAmt = discounted * (t / 100);
      document.getElementById("discOutput").innerHTML = CT(["Yekun ödəniş: ", "Final: ", "Son ödeme: ", "الدفع النهائي: ", "Итог: "]) + "<strong>" + (discounted + taxAmt).toFixed(2) + "</strong><br>" + CT(["Qənaət: ", "Saved: ", "Tasarruf: ", "التوفير: ", "Экономия: "]) + "<span style=\"color:var(--success)\">" + saved.toFixed(2) + "</span> | " + CT(["ƏDV: ", "VAT: ", "KDV: ", "الضريبة: ", "НДС: "]) + taxAmt.toFixed(2);
    }
    function calcLoan() {
      const P = parseFloat(document.getElementById("loanAmount").value);
      const annualRate = parseFloat(document.getElementById("loanRate").value);
      const n = parseInt(document.getElementById("loanMonths").value, 10);
      const out = document.getElementById("loanOutput");
      if (!P || isNaN(annualRate) || !n || n <= 0) { out.textContent = CT(["Məlumatları tam daxil edin...", "Enter the full figures...", "Bilgileri tam girin...", "أدخل البيانات كاملة...", "Введите данные полностью..."]); return; }
      const r = annualRate / 12 / 100;
      const emi = r === 0 ? P / n : (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      out.innerHTML = CT(["Aylıq ödəniş: ", "Monthly payment: ", "Aylık ödeme: ", "القسط الشهري: ", "Платёж в месяц: "]) + "<strong>" + emi.toFixed(2) + "</strong><br>" + CT(["Ümumi: ", "Total: ", "Toplam: ", "الإجمالي: ", "Итого: "]) + (emi * n).toFixed(2) + " | " + CT(["Faiz: ", "Interest: ", "Faiz: ", "الفائدة: ", "Проценты: "]) + "<span style=\"color:var(--danger)\">" + (emi * n - P).toFixed(2) + "</span>";
    }
    function calcBMI() {
      const h = parseFloat(document.getElementById("bmiHeight").value) / 100;
      const w = parseFloat(document.getElementById("bmiWeight").value);
      const out = document.getElementById("bmiOutput");
      if (!h || !w || h <= 0) { out.textContent = CT(["Boy və çəkini daxil edin...", "Enter height and weight...", "Boy ve kiloyu girin...", "أدخل الطول والوزن...", "Введите рост и вес..."]); return; }
      const bmi = w / (h * h);
      let status = CT(["Normal çəki", "Normal weight", "Normal kilo", "وزن طبيعي", "Нормальный вес"]);
      if (bmi < 18.5) status = CT(["Çəki azlığı", "Underweight", "Zayıf", "نقص الوزن", "Недостаток веса"]);
      else if (bmi >= 25 && bmi < 30) status = CT(["Artıq çəki", "Overweight", "Fazla kilolu", "زيادة الوزن", "Избыточный вес"]);
      else if (bmi >= 30) status = CT(["Piylənmə", "Obese", "Obez", "سمنة", "Ожирение"]);
      out.innerHTML = CT(["BKİ: ", "BMI: ", "VKİ: ", "مؤشر الكتلة: ", "ИМТ: "]) + "<strong>" + bmi.toFixed(1) + "</strong> — <span>" + status + "</span>";
    }
    function calcDateDiff() {
      const s = document.getElementById("dateStart").value;
      const e = document.getElementById("dateEnd").value;
      const out = document.getElementById("dateOutput");
      if (!s || !e) return;
      const diffMs = Math.abs(new Date(e) - new Date(s));
      const totalDays = Math.floor(diffMs / 86400000);
      const years = Math.floor(totalDays / 365.25);
      const months = Math.floor((totalDays % 365.25) / 30.4375);
      const days = Math.floor((totalDays % 365.25) % 30.4375);
      out.innerHTML = CT(["Fərq: ", "Difference: ", "Fark: ", "الفرق: ", "Разница: "]) + "<strong>" + years + CT([" il, ", " years, ", " yıl, ", " سنة، ", " г., "]) + months + CT([" ay, ", " months, ", " ay, ", " شهر، ", " мес., "]) + days + CT([" gün", " days", " gün", " يوم", " дн."]) + "</strong><br>" + CT(["Ümumi gün: ", "Total days: ", "Toplam gün: ", "مجموع الأيام: ", "Всего дней: "]) + "<strong>" + totalDays + CT([" gün", " days", " gün", " يوم", " дн."]) + "</strong>";
    }
    document.addEventListener("keydown", (event) => {
      const tag = (event.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      const key = event.key;
      if (/^[0-9]$/.test(key) || key === ".") { insertToken(key); event.preventDefault(); }
      else if (key === "+") { insertToken("+"); event.preventDefault(); }
      else if (key === "-") { insertToken("-"); event.preventDefault(); }
      else if (key === "*") { insertToken("×"); event.preventDefault(); }
      else if (key === "/") { insertToken("÷"); event.preventDefault(); }
      else if (key === "(" || key === ")") { insertToken(key); event.preventDefault(); }
      else if (key === "%") { insertToken("%"); event.preventDefault(); }
      else if (key === "^") { insertToken("^"); event.preventDefault(); }
      else if (key === "Enter" || key === "=") { calculate(); event.preventDefault(); }
      else if (key === "Backspace") { backspace(); event.preventDefault(); }
      else if (key === "Escape") { clearAll(); event.preventDefault(); }
    });
    applyChrome();
    populateUnits();
    updateDisplay();
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("dateStart").value = today;
    document.getElementById("dateEnd").value = today;
  </script>
</body>
</html>
