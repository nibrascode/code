  <style>
    @property --nx-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes nx-edge { to { --nx-angle: 360deg; } }
    @keyframes blink { 50% { opacity: .25; } }
    :root {
      --ink: #04060f;
      --fg: #f4f7ff;
      --muted: #9aa3bd;
      --line: rgba(130, 170, 255, .28);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fg);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      background: #03040c;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    .glow, .glow svg { position: fixed; inset: 0; pointer-events: none; }
    .glow svg { width: 100%; height: 100%; }
    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 38px; height: 34px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(80,140,255,.55)); }
    .brand b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .meta { display: flex; align-items: center; gap: 8px; flex: none; }
    .crown, .home {
      border: 1px solid rgba(120, 170, 255, .45);
      background: rgba(8, 12, 28, .72);
      color: #eef3ff;
      box-shadow: 0 0 16px rgba(70, 120, 255, .18);
    }
    .crown, .home {
      width: 38px; height: 38px; border-radius: 999px;
      display: grid; place-items: center; padding: 0; cursor: pointer;
    }
    .home {
      width: auto;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(180deg, rgba(40,70,160,.35), rgba(20,24,48,.8));
    }
    .crown { position: relative; }
    .crown svg { width: 18px; height: 18px; }
    .crown i {
      position: absolute; right: -2px; bottom: -2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #121624; border: 1px solid rgba(255,255,255,.16);
      display: grid; place-items: center;
    }
    .crown i svg { width: 8px; height: 8px; }
    #msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 16px 8px;
    }
    .hello { margin: auto; width: 100%; text-align: center; padding: 6px 0 10px; }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .whisper {
      margin: 0;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.4;
      color: rgba(176, 186, 214, .82);
    }
    .whisper small {
      display: block;
      margin-top: 7px;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.35;
      color: rgba(196, 206, 232, .7);
    }
    .script {
      margin: 0;
      text-align: right;
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 650;
      font-style: italic;
      line-height: 1.35;
      color: #f2f4ff;
    }
    .script span { display: block; }
    .script em {
      display: block;
      height: 8px;
      margin-top: 2px;
      background: radial-gradient(60% 100% at 70% 0%, rgba(160,110,255,.95), transparent 72%);
      border-radius: 50%;
      transform: rotate(-6deg);
    }
    .logo {
      width: min(118px, 30vw);
      height: auto;
      justify-self: center;
      filter: drop-shadow(0 10px 24px rgba(40, 90, 255, .35));
    }
    h1 {
      margin: 2px 0 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    h1 span {
      background: linear-gradient(100deg, #8fd0ff 0%, #7aa6ff 42%, #b388ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .kicker {
      margin: 8px 0 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .28em;
      color: #aeb6ce;
    }
    .acts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .act {
      border: 1px solid rgba(120, 168, 255, .28);
      background: linear-gradient(180deg, rgba(16, 22, 42, .9), rgba(8, 12, 26, .9));
      color: #d7def2;
      border-radius: 12px;
      padding: 6px 2px 5px;
      cursor: pointer;
    }
    .act svg { width: 15px; height: 15px; display: block; margin: 0 auto 3px; }
    .act b { display: block; font-size: 9px; font-weight: 600; line-height: 1.15; }
    .msg {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .u {
      margin-left: auto;
      background: linear-gradient(180deg, #6ea2ff, #7a6bff);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .b {
      margin-right: auto;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }
    .err { border-color: rgba(255,120,140,.35); color: #ffd0d6; }
    .msg pre {
      margin: 8px 0 0;
      padding: 10px;
      overflow: auto;
      border-radius: 10px;
      background: #070b16;
      color: #d7e6ff;
      font-size: 12px;
      line-height: 1.45;
    }
    .msg .ay {
      white-space: normal;
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(120, 170, 255, .08);
      border: 1px solid rgba(130, 170, 255, .28);
      border-inline-start: 3px solid #7aa7ff;
    }
    .msg .ay .at {
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
      font-family: "Amiri Quran", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif;
      font-size: 23px;
      line-height: 2.1;
      color: #f4f7ff;
    }
    .msg .ay .al { display: block; }
    .msg .ay .atr { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(130, 170, 255, .28); font-size: 14px; line-height: 1.6; color: #cfd6e6; unicode-bidi: plaintext; }
    .msg .ay .atr .trl { font-size: 11px; line-height: 1.4; color: #8d96ad; margin-bottom: 3px; }
    .msg .ay .atr .tl { display: block; }
    .msg .nt { white-space: normal; margin: 0 0 10px; padding: 8px 11px; border-radius: 10px; background: rgba(255, 190, 90, .07); border: 1px solid rgba(255, 190, 90, .38); border-inline-start: 3px solid #ffbe5a; font-size: 12.5px; line-height: 1.55; color: #f3dfb8; unicode-bidi: plaintext; }
    .msg .nt .nl { display: block; }
    .msg .nt .nq { display: block; margin-top: 2px; color: #ffe9c2; }
    .msg .nt .na { display: block; margin-top: 4px; direction: rtl; text-align: right; unicode-bidi: plaintext; font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif; font-size: 17px; line-height: 1.9; color: #fff3da; }
    .msg .nt .ns { display: block; margin-top: 4px; font-size: 10.5px; line-height: 1.4; color: #b9a67c; }
    /* Təfsir bloku: ::tafsir kitab::  ::tl:: ad  [::tv:: (ayə)]  mətn...  ::src:: mənbə  ::/tafsir:: */
    .msg .tf { white-space: normal; margin: 8px 0; padding: 9px 12px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .14); border-inline-start: 3px solid #6f7a96; }
    .msg .tf .tfl { font-size: 11px; line-height: 1.4; color: #8d96ad; margin-bottom: 4px; unicode-bidi: plaintext; }
    .msg .tf .tft { direction: rtl; text-align: right; unicode-bidi: plaintext; font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif; font-size: 18px; line-height: 2; color: #e8edf9; }
    .msg .tf .tfp { display: block; margin: 0 0 6px; }
    .msg .tf .tfv { display: block; margin: 6px 0 2px; font-size: 12px; line-height: 1.4; color: #8d96ad; font-family: inherit; }
    .msg .tf .as { margin-top: 6px; font-size: 11px; line-height: 1.45; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .tf .as a { color: #8fb4ff; text-decoration: underline; }
    .msg .sg { white-space: normal; margin: 10px 0 2px; unicode-bidi: plaintext; }
    .msg .sg .sgl { font-size: 11.5px; line-height: 1.4; color: #8d96ad; margin-bottom: 5px; unicode-bidi: plaintext; }
    .msg .sg .sgb { display: flex; flex-wrap: wrap; gap: 6px; }
    .msg .sg .chip { font: inherit; font-size: 12px; line-height: 1.2; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(143, 180, 255, .4); background: rgba(143, 180, 255, .08); color: #bcd2ff; cursor: pointer; }
    .msg .sg .chip:hover { background: rgba(143, 180, 255, .18); }
    .msg .sg .chip:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
    .msg .an { white-space: normal; margin: 6px 0; font-size: 11.5px; line-height: 1.5; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .ay .as { margin-top: 6px; font-size: 11px; line-height: 1.45; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .ay .as a { color: #8fb4ff; text-decoration: underline; }
    .msg .ay.warn { border-color: rgba(255, 190, 90, .5); background: rgba(255, 190, 90, .07); border-inline-start-color: #ffbe5a; }
    .msg .ay.warn .at { font-size: 17px; line-height: 1.9; opacity: .85; }
    .msg .ay.warn .as { color: #ffd08a; }
    .msg .cb { margin-top: 8px; white-space: normal; }
    .msg .cb pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg .cb .cw { position: relative; }
    .msg .cb pre { box-sizing: border-box; }
    .msg .cb.col pre { max-height: 300px; overflow-y: hidden; }
    .msg .cb .fade { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 72px; border-radius: 0 0 10px 10px; background: linear-gradient(to bottom, rgba(7, 11, 22, 0), #070b16 88%); pointer-events: none; }
    .msg .cb.col .fade { display: block; }
    .msg .cb .bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .msg .cb .bar .runbtn { margin-left: auto; }
    .morebtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      min-width: 34px;
      padding: 0 12px;
      border: 1px solid rgba(143, 180, 255, .4);
      border-radius: 10px;
      background: rgba(143, 180, 255, .1);
      color: #bcd1ff;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .morebtn[hidden] { display: none; }
    .morebtn:hover, .morebtn:focus-visible { border-color: #8fb4ff; color: #e6efff; }
    .runbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(94, 234, 212, .45);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(45, 212, 191, .22), rgba(20, 184, 166, .12));
      color: #8ff5e4;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .runbtn svg { width: 12px; height: 12px; display: block; }
    .runbtn:hover { border-color: #5eead4; color: #d6fff7; }
    .runbtn:disabled { opacity: .5; cursor: wait; }
    .msg.b.ht { position: relative; padding-top: 32px; }
    .msg .tools { position: absolute; top: 0; right: 3px; display: flex; gap: 0; white-space: normal; user-select: none; -webkit-user-select: none; }
    .msg .tools button { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: #8d96ad; cursor: pointer; opacity: .75; -webkit-tap-highlight-color: transparent; }
    .msg .tools button svg { width: 15px; height: 15px; display: block; }
    .msg .tools button:hover, .msg .tools button:focus-visible { opacity: 1; color: #cfe0ff; background: rgba(143, 180, 255, .12); }
    .msg .tools button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: -2px; }
    .msg .tools button.ok { color: #8ff5e4; opacity: 1; }
    .msg .trn { white-space: normal; margin: 6px 0 10px; padding: 8px 12px; border-radius: 10px; background: rgba(143, 180, 255, .06); border: 1px solid rgba(143, 180, 255, .16); border-inline-start: 3px solid #8fb4ff; font-size: 14px; line-height: 1.6; color: #dfe6f7; unicode-bidi: plaintext; }
    .msg .trn .trl { font-size: 11px; line-height: 1.4; color: #8d96ad; margin-bottom: 3px; }
    .msg .trn .trl a { color: #8fb4ff; text-decoration: underline; }
    .msg .trn .trx { white-space: pre-wrap; }
    .msg .trn .trx + .trl { margin-top: 8px; }
    .msg .trn .trw { margin-top: 5px; font-size: 11.5px; line-height: 1.4; color: #d9b36a; }
    .msg .trn .trf { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: #7b8499; }
    .msg .trn.none { background: transparent; border-style: dashed; color: #8d96ad; font-size: 12.5px; }
    .msg .tools button.busy { opacity: .5; cursor: wait; }
    .shm { position: fixed; z-index: 6; width: 188px; padding: 5px; border-radius: 14px; background: rgba(12, 16, 32, .98); border: 1px solid rgba(160, 140, 255, .35); box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
    .shm[hidden] { display: none; }
    .shm a, .shm button { display: flex; align-items: center; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #e6ecfb; font: inherit; font-size: 13.5px; text-align: left; text-decoration: none; cursor: pointer; }
    .shm a:hover, .shm button:hover, .shm a:focus-visible, .shm button:focus-visible { background: rgba(143, 180, 255, .14); outline: none; }
    .msg img.shot {
      display: block;
      width: 100%;
      margin-top: 8px;
      border-radius: 12px;
    }
    .mode {
      margin: 0 4px 8px;
      color: #9fd6ff;
      font-size: 12px;
      font-weight: 650;
    }
    .thumb {
      display: none;
      width: 42px;
      height: 42px;
      margin-right: 8px;
      border-radius: 10px;
      object-fit: cover;
    }
    .thumb.on { display: block; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: #9fd6ff;
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    .dock { padding: 4px 16px 18px; }
    .ring {
      position: relative;
      isolation: isolate;
      border-radius: 24px;
    }
    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(
        from var(--nx-angle),
        transparent 0deg,
        #7ee7ff 55deg,
        #8d7bff 110deg,
        #ffd27a 155deg,
        #ff7eb3 200deg,
        transparent 255deg,
        transparent 360deg
      );
      animation: nx-edge 4.2s linear infinite;
    }
    .ring::before {
      inset: 0;
      z-index: 2;
      padding: 1px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .ring::after {
      display: none;
    }
    .composer {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(7, 10, 22, .94);
      padding: 12px 12px 10px;
    }
    textarea {
      display: block;
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--fg);
      font-size: 16px;
      line-height: 1.4;
      min-height: 46px;
      padding: 2px 2px 8px;
    }
    textarea::placeholder { color: #8b93ad; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .clip {
      width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: #d5dced;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .send {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      padding: 0;
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, #3aa0ff, #7a5cff 55%, #b14bff);
      box-shadow: 0 8px 18px rgba(80, 70, 255, .28);
    }
    .send:disabled, textarea:disabled { opacity: .45; cursor: not-allowed; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      z-index: 5;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(12, 16, 32, .96);
      border: 1px solid rgba(160, 140, 255, .35);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      color: #f4f7ff;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .vault { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 18px; background: rgb(4 8 16 / 0.72); }
    .vault[hidden] { display: none; }
    .vault-card { width: min(520px, 100%); padding: 16px; border-radius: 16px; border: 1px solid rgb(140 170 230 / 0.28); background: #10182a; color: #eef4ff; }
    .vault-card h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .vault-card p { margin: 0 0 10px; color: #c5d0e6; font-size: 14px; }
    .vault-card textarea { width: 100%; min-height: 140px; padding: 10px; border-radius: 12px; border: 1px solid rgb(140 170 230 / 0.28); background: #070d18; color: #eef4ff; font: 14px/1.45 ui-monospace, monospace; }
    .vault-acts { display: flex; gap: 8px; margin-top: 10px; }
    .vault-acts button { padding: 8px 12px; border: 0; border-radius: 10px; background: #2f5bff; color: #fff; font-weight: 700; cursor: pointer; }
    .menu {
      width: 38px; height: 38px; border-radius: 999px; padding: 0; cursor: pointer;
      display: grid; place-items: center; flex: none;
      border: 1px solid rgba(94, 234, 212, .45);
      background: rgba(8, 12, 28, .72);
      color: #8ff5e4;
      box-shadow: 0 0 16px rgba(45, 212, 191, .16);
    }
    .menu svg { width: 20px; height: 20px; display: block; }

          else {

    // ---- Söhbətlərin saxlanması: dərhal localStorage (24 saat) + Supabase (/api/chats, imkan varsa)
    const CH_KEY = "nibras_chats_v1";
    const DEV_KEY = "nibras_device_v1";
    const KEEP_MS = 24 * 3600 * 1000;
    const TITLE_MAX = 40;
    const SYNC_MAX = 190000;
    let store = { cur: "", items: {} };
    let curItem = null;

    function rid() {
      try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
      let s = "";
      for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s;
    }
    function deviceId() {
      let d = "";
      try { d = localStorage.getItem(DEV_KEY) || ""; } catch (e) {}
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(d)) {
        d = rid();
        try { localStorage.setItem(DEV_KEY, d); } catch (e) {}
      }
      return d;
    }
    function prune() {
      const lim = Date.now() - KEEP_MS;
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (!it || !Array.isArray(it.msgs) || !(it.t > lim)) delete store.items[id];
      });
      if (!store.items[store.cur]) store.cur = "";
    }
    function readStore() {
      let o = null;
      try { o = JSON.parse(localStorage.getItem(CH_KEY)); } catch (e) {}
      store = o && typeof o === "object" && o.items && typeof o.items === "object" ? { cur: String(o.cur || ""), items: o.items, pm: o.pm || null } : { cur: "", items: {}, pm: null };
      prune();
    }
    function writeStore() {
      prune();
      for (let tries = 0; tries < 6; tries++) {
        try { localStorage.setItem(CH_KEY, JSON.stringify(store)); return; } catch (e) {
          // yer qurtarıb: ən köhnə (cari olmayan) söhbəti atırıq
          const ids = Object.keys(store.items).filter(function (k) { return k !== store.cur; }).sort(function (a, b) { return store.items[a].t - store.items[b].t; });
          if (!ids.length) return;
          delete store.items[ids[0]];
        }
      }
    }
    function mkTitle(text) {
      const t = String(text || "").replace(/\s+/g, " ").trim();

      return a.length > TITLE_MAX ? a.slice(0, TITLE_MAX).join("").trim() + "…" : t;
    }
    // Bu söhbətdə artıq göstərilmiş hazır oyunlar (slug-lar, ardıcıllıqla): serverə yalnız son 8 mesaj getdiyi üçün ayrıca göndərilir
    function gamesShown() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x || m.k !== "b") return;
        String(m.t).replace(/^::game:: ([a-z0-9-]+) \|/gm, function (all, slug) { out.push(slug); return all; });
      });
      return out.slice(-60);
    }
    function threadOf() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x) return;
        if (m.k === "u") out.push({ role: "user", text: m.t });
        else if (m.k === "b") out.push({ role: "assistant", text: m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t }); // oyun kodu (40-90KB) hər sorğuda göndərilmir; yalnız gizli işarə qalır
      });
      return out;
    }
    // Hər dəyişiklikdə çağırılır: yerli yaddaşa yazır, serverə planlayır
    // Bu söhbətdə dini cavab bildirişi artıq göstərilibmi? (saxlanan tarixçədən; yeni söhbətdə false; yenidən yükləmədən sonra da işləyir)
    function noticeShown() {
      return !!curItem && curItem.msgs.some(function (m) {

    }
    function rec(k, t, i, x) {
      if (!curItem) {
        const id = rid();
        curItem = { id: id, title: mkTitle(t), mode: mode, msgs: [], t: Date.now() };
        store.items[id] = curItem;
        store.cur = id;
      }
      const m = { k: k, t: String(t) };
      if (i && /^https?:\/\//i.test(i) && i.length <= 2000) m.i = i;
      if (x) m.x = 1;
      curItem.msgs.push(m);
      curItem.mode = mode;
      curItem.t = Date.now();
      store.cur = curItem.id;
      writeStore();
      schedule(curItem.id);
      return m;
    }
    function serverOk() { return Date.now() >= serverOffUntil; }
    function schedule(id) {
      if (!serverOk()) return;
      dirty[id] = 1;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(flushNow, 800);
    }
    function apiHeaders(json) {
      const h = { "x-device-id": deviceId() };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }
    function noteReply(r) {
      return r.json().then(function (d) {
        if (!d || d.storage === false || d.ok === false && r.status >= 500) serverOffUntil = Date.now() + 5 * 60 * 1000;

    function fitForServer(msgs) {
      const out = msgs.map(function (m) {
        const c = { k: m.k, t: (m.k === "b" && m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t).slice(0, 20000) }; // serverdə mesaj limiti 20000: oyun kodu saxlanmır, işarə qalır
        if (m.i) c.i = m.i;
        if (m.x) c.x = 1;
        return c;
      }).slice(-200);
      while (out.length > 1 && JSON.stringify(out).length > SYNC_MAX) out.shift();
      return out;
    }
    function flushNow() {
      clearTimeout(syncTimer);
      const ids = Object.keys(dirty);
      ids.forEach(function (id) { delete dirty[id]; });
      if (!serverOk()) return;
      ids.forEach(function (id) {
        const it = store.items[id];
        if (!it || !it.msgs.length) return;
        const body = JSON.stringify({ title: it.title, messages: fitForServer(it.msgs) });
        try {
          fetch("/api/chats?id=" + encodeURIComponent(id), { method: "PUT", headers: apiHeaders(true), body: body, keepalive: body.length < 60000 })
            .then(noteReply).catch(function () {});
        } catch (e) {}
      });
    }
    function renderItem(it) {

    function restoreCurrent() {

      if (!it) {
        curItem = null;
        const pm = store.pm;
        if (pm && pm.t > Date.now() - KEEP_MS && (pm.m === "ask" || pm.m === "code" || pm.m === "create")) {
          restoring = true;
          setMode(pm.m);
          restoring = false;
        }
        return;
      }
      curItem = it;
      renderItem(it);
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" ? it.mode : "chat");
      restoring = false;
    }

    // ---- Söhbətlər paneli
    const drawer = document.getElementById("drawer");
    const scrim = document.getElementById("scrim");
    const dlist = document.getElementById("dlist");
    const menuBtn = document.getElementById("menu");
    function ago(t0) {
      const m = Math.max(0, Math.round((Date.now() - t0) / 60000));
      if (m < 1) return t("now");
      if (m < 60) return m + t("min");
      return Math.round(m / 60) + t("hour");
    }
    function listEntries() {
      const lim = Date.now() - KEEP_MS;
      const map = {};
      remoteList.forEach(function (r) { const t = Date.parse(r.updated_at); if (t > lim) map[r.id] = { id: r.id, title: r.title, t: t }; });
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (it.t > lim) map[id] = { id: id, title: it.title, t: it.t };
      });
      return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.t - a.t; });

    function refreshRemote() {
      if (!serverOk()) return Promise.resolve();
      return fetch("/api/chats", { headers: apiHeaders(false) }).then(noteReply).then(function (d) {
        if (d && d.ok && d.storage && Array.isArray(d.chats)) {
          remoteList.length = 0;
          d.chats.forEach(function (c) { if (c && typeof c.id === "string") remoteList.push(c); });

    }
    function guessLang() {
      const cand = [localStorage.getItem(LANG_KEY), navigator.language, (navigator.languages || [])[0]];
      for (let i = 0; i < cand.length; i++) {
        const c = String(cand[i] || "").toLowerCase().slice(0, 2);
        if (UI[c]) return c;
      }
      return "az";
    }
    function fillAbout() {
      const box = document.getElementById("aboutin");
      box.innerHTML = "";
      function p(cls, text) {
        const el = document.createElement(cls === "h2" ? "h2" : "p");
        if (cls === "lead") el.className = "leadline";
        el.textContent = text;
        box.appendChild(el);
      }
      p("lead", t("lead"));
      p("h2", t("limit"));
      p("p", t("lim1"));
      p("p", t("lim2"));
      p("p", t("lim3"));
      p("h2", t("model"));
      p("p", t("mod1"));
      p("p", t("mod2"));
      p("h2", t("privacy"));
      p("p", t("pri1"));
      p("p", t("pri2"));
      p("p", t("pri3"));
    }
    function applyLang(code) {
      if (!UI[code]) code = "az";
      uiLangCode = code;
      try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("aboutbtn").textContent = t("about");
      document.getElementById("chathead").textContent = t("chats");
      document.getElementById("newchat").textContent = t("newChat");
      document.getElementById("dnote").textContent = t("note");
      document.getElementById("kicker").textContent = t("kicker");
      document.querySelectorAll("[data-ui]").forEach(function (el) { el.textContent = t(el.getAttribute("data-ui")); });
      document.querySelectorAll("#langs button").forEach(function (el) { el.classList.toggle("on", el.getAttribute("data-lang") === code); });
      document.getElementById("langhead").textContent = LANG_NAME[code];
      menuBtn.setAttribute("aria-label", t("chats"));
      menuBtn.setAttribute("title", t("chats"));
      drawer.setAttribute("aria-label", t("chats"));
      document.getElementById("dclose").setAttribute("aria-label", t("close"));
      fillAbout();
      setMode(mode);
      if (typeof renderList === "function") renderList();
    }
    function setDrawer(on) {
      const was = drawer.classList.contains("on");
      drawer.classList.toggle("on", on);
      scrim.classList.toggle("on", on);
      drawer.setAttribute("aria-hidden", on ? "false" : "true");
      menuBtn.setAttribute("aria-expanded", on ? "true" : "false");
      if (on) {
        prune();
        renderList();
        refreshRemote();
        if (!was) { try { document.getElementById("dclose").focus(); } catch (e) {} }
      } else if (was && drawer.contains(document.activeElement)) {
        try { menuBtn.focus(); } catch (e) {} // klaviatura fokusu menyu düyməsinə qayıdır
      }
    }
    function resetView() {
      restoring = true;
      setMode("chat");
      restoring = false;
      pendingImage = "";
      const thumb = document.getElementById("thumb");
      thumb.classList.remove("on");
      thumb.removeAttribute("src");
      inp.value = "";
    }
    function newChat() {
      if (busy) { note(t("wait")); return; }
      flushNow();
      curItem = null;
      store.cur = "";
      store.pm = null;
      writeStore();
      renderItem(null);
      resetView();
      setDrawer(false);
    }
    async function openChat(id) {
      if (busy) { note(t("wait")); return; }
      flushNow();
      let it = store.items[id];
      if (!it) {
        try {
          const r = await fetch("/api/chats?id=" + encodeURIComponent(id), { headers: apiHeaders(false) });
          const d = await r.json();
          const c = d && d.ok && d.chat;
          if (!c || !Array.isArray(c.messages)) { note(t("missing")); return; }
          it = { id: id, title: c.title || t("chat"), mode: "chat", msgs: c.messages, t: Date.parse(c.updated_at) || Date.now() };
          store.items[id] = it;
        } catch (e) { note(t("noopen")); return; }
      }
      curItem = it;
      store.cur = id;
      writeStore();
      renderItem(it);
      resetView();
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" ? it.mode : "chat");
      restoring = false;
      setDrawer(false);
    }
    function deleteChat(id) {
      if (busy && curItem && curItem.id === id) { note(t("wait")); return; }
      delete store.items[id];
      delete dirty[id];
      for (let i = remoteList.length - 1; i >= 0; i--) if (remoteList[i].id === id) remoteList.splice(i, 1);
      if (curItem && curItem.id === id) {
        curItem = null;
        store.cur = "";
        renderItem(null);
        resetView();
      }
      writeStore();
      renderList();
      if (serverOk()) {
        try { fetch("/api/chats?id=" + encodeURIComponent(id), { method: "DELETE", headers: apiHeaders(false) }).then(noteReply).catch(function () {}); } catch (e) {}
      }
      note(t("deleted"));
    }
    menuBtn.addEventListener("click", function () { setDrawer(!drawer.classList.contains("on")); });
    document.getElementById("dclose").addEventListener("click", function () { setDrawer(false); });
    const aboutBtn = document.getElementById("aboutbtn");
    const aboutIn = document.getElementById("aboutin");
    const chatHead = document.getElementById("chathead");
    const chatBox = document.getElementById("chatbox");
    const langHead = document.getElementById("langhead");
    const langList = document.getElementById("langs");
    let aboutOn = false;
    function setLangOpen(on) {
      langList.classList.toggle("on", on);
      langHead.setAttribute("aria-expanded", on ? "true" : "false");
      langHead.classList.toggle("on", on);
    }
    function closeFolds() {
      aboutOn = false;
      aboutIn.classList.remove("on");
      aboutBtn.setAttribute("aria-expanded", "false");
      aboutBtn.classList.remove("on");
      chatBox.classList.remove("on");
      chatHead.setAttribute("aria-expanded", "false");
      chatHead.classList.remove("on");
      setLangOpen(false);
    }
    function setAbout(on) {
      closeFolds();
      if (!on) return;
      aboutOn = true;
      aboutIn.classList.add("on");
      aboutBtn.setAttribute("aria-expanded", "true");
      aboutBtn.classList.add("on");
      aboutIn.scrollTop = 0;
    }
    function setChats(on) {
      closeFolds();
      if (!on) return;
      chatBox.classList.add("on");
      chatHead.setAttribute("aria-expanded", "true");
      chatHead.classList.add("on");
      renderList();
    }
    aboutBtn.addEventListener("click", function () { setAbout(!aboutOn); });
    chatHead.addEventListener("click", function () { setChats(!chatBox.classList.contains("on")); });
    langHead.addEventListener("click", function () {
      const open = !langList.classList.contains("on");
      closeFolds();
      if (open) setLangOpen(true);
    });
    langList.addEventListener("click", function (e) {
      const btn = e.target.closest("button");
      if (!btn) return;
      applyLang(btn.getAttribute("data-lang"));
      setLangOpen(false);
    });
    scrim.addEventListener("click", function () { setDrawer(false); });
    document.getElementById("newchat").addEventListener("click", newChat);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setDrawer(false); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushNow(); });
    window.addEventListener("pagehide", flushNow);
    window.nibrasChats = { open: openChat, newChat: newChat, remove: deleteChat, flush: flushNow };
    restoreCurrent();
    applyLang(guessLang());
    paint();
  </script>
</body>
</html>
