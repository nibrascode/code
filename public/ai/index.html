<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nibras AI</title>
  <meta name="description" content="Nibras AI — Nibras Code köməkçisi. Gündə 5 qısa sual." />
  <link rel="icon" href="/nibras-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #05060c;
      --fg: #f4f5fb;
      --muted: #9aa1b8;
      --faint: #6c738c;
      --brand: #7c8cff;
      --ice: #9aebff;
      --line: rgba(255,255,255,.1);
      --user: #6d84ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--fg);
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(820px 420px at 100% -10%, rgba(109,132,255,.28), transparent 58%),
        radial-gradient(640px 380px at -10% 110%, rgba(126,231,255,.1), transparent 52%),
        var(--ink);
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
      background: rgba(5,6,12,.55);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      min-width: 0;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      object-fit: cover;
      outline: 1px solid rgba(255,255,255,.12);
    }
    .brand b {
      display: block;
      font-family: Syne, sans-serif;
      font-weight: 750;
      letter-spacing: -0.04em;
      font-size: 16px;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .meta { display: flex; align-items: center; gap: 8px; }
    .pill, .home {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--fg);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .pill em { font-style: normal; color: var(--ice); }
    main {
      width: min(760px, 100%);
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 14px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    #msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px 2px 8px;
    }
    .hello {
      margin: auto;
      text-align: center;
      max-width: 420px;
      padding: 12px;
    }
    .hello h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: -0.05em;
      margin: 0 0 8px;
    }
    .hello p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chips button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--fg);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chips button:hover { border-color: rgba(154,235,255,.45); }
    .msg {
      max-width: min(86%, 560px);
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .u {
      margin-left: auto;
      background: linear-gradient(180deg, #8496ff, #6d7ff0);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .b {
      margin-right: auto;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }
    .err { border-color: rgba(255,120,140,.4); color: #ffd0d6; }
    .dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ice);
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .25; } }
    form {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8,10,20,.82);
      box-shadow: 0 16px 50px rgba(0,0,0,.28);
    }
    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      padding: 10px 8px;
    }
    input::placeholder { color: var(--faint); }
    button.send {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      color: #061018;
      background: linear-gradient(180deg, var(--ice), #b9c4ff);
      cursor: pointer;
    }
    button.send:disabled { opacity: .45; cursor: not-allowed; }
    #warn {
      display: none;
      margin: 8px 4px 0;
      color: #ffb4c0;
      font-size: 13px;
      text-align: center;
    }
    #warn.on { display: block; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/nibras-icon.png" alt="" />
      <span>
        <b>Nibras AI</b>
        <small>Nibras Code köməkçisi</small>
      </span>
    </a>
    <div class="meta">
      <span class="pill" id="left"><em>5</em>/5</span>
      <a class="home" href="/">Sayt</a>
    </div>
  </header>
  <main>
    <div id="msgs">
      <div class="hello" id="hello">
        <h1>Sualını yaz.</h1>
        <p>Qısa və aydın cavab. Hər gün 5 sual. Limit dolanda sabah yenidən açılır.</p>
        <div class="chips">
          <button type="button" data-q="Nibras Code nədir?">Nibras Code nədir?</button>
          <button type="button" data-q="Nibras Arabic nə üçündür?">Nibras Arabic</button>
          <button type="button" data-q="PDF fayllarını telefonda necə birləşdirmək olar?">PDF birləşdirmək</button>
        </div>
      </div>
    </div>
    <form id="form">
      <input id="inp" type="text" maxlength="800" placeholder="Sualınızı yazın..." autocomplete="off" />
      <button class="send" id="btn" type="submit">Göndər</button>
    </form>
    <p id="warn">Gündəlik 5 sual limiti doldu. Sabah yenidən yoxlayın.</p>
  </main>
  <script>
    const LIMIT = 5;
    const KEY = "nibras_ai_v2";
    const msgs = document.getElementById("msgs");
    const hello = document.getElementById("hello");
    const form = document.getElementById("form");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const warn = document.getElementById("warn");
    const left = document.getElementById("left");
    const today = new Date().toISOString().slice(0, 10);

    function load() {
      let u = { d: today, c: 0 };
      try { u = JSON.parse(localStorage.getItem(KEY)) || u; } catch (e) {}
      if (u.d !== today) u = { d: today, c: 0 };
      return u;
    }
    function save(u) { localStorage.setItem(KEY, JSON.stringify(u)); }
    function remain() { return Math.max(0, LIMIT - load().c); }
    function paint() {
      const n = remain();
      left.innerHTML = "<em>" + n + "</em>/" + LIMIT;
      const full = n === 0;
      inp.disabled = full;
      btn.disabled = full;
      warn.classList.toggle("on", full);
      inp.placeholder = full ? "Limit doldu" : "Sualınızı yazın...";
    }
    function esc(s) {
      return s.replace(/[&<>"']/g, function (c) {
        return ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" })[c];
      });
    }
    function bubble(text, kind) {
      if (hello) hello.remove();
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
      return el;
    }
    async function send(text) {
      const m = (text || "").trim();
      if (!m || remain() <= 0) return;
      inp.value = "";
      bubble(m, "u");
      btn.disabled = true;
      const wait = document.createElement("div");
      wait.className = "msg b";
      wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      msgs.appendChild(wait);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: m })
        });
        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (e) {}
        wait.remove();
        const reply = data.reply || data.message || data.error;
        if (!r.ok || data.success === false || !reply) {
          bubble(reply || "Cavab gəlmədi. Bir az sonra yenidən yoxlayın.", "b err");
        } else {
          bubble(reply, "b");
          const u = load();
          u.c += 1;
          save(u);
        }
      } catch (e) {
        wait.remove();
        bubble("Şəbəkəyə qoşulmaq olmadı.", "b err");
      }
      paint();
      if (remain() > 0) inp.focus();
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      send(inp.value);
    });
    document.querySelectorAll("[data-q]").forEach(function (b) {
      b.addEventListener("click", function () { send(b.getAttribute("data-q")); });
    });
    paint();
  </script>
</body>
</html>
