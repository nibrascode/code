linir. Hesab açılmır. Bu brauzer üçün təsadüfi nömrə də burada saxlanır.", pri2: "Model lazım olanda mesaj və son söhbət serverə, oradan seçilən modelə gedir. Hazır cavabda mesajın mətni saxlanmır. Sayğac yalnız hadisənin növünü göndərir, yazdığın cümləni yox. Brauzerdə izləmə bağlıdırsa sayğac getmir.", pri3: "Server söhbəti qəbul edirsə, eyni mətn həmin cihaz nömrəsi ilə orada da saxlanmağa çalışılır. 24 saatdan sonra siyahıdan düşür.", who: "Bunu Nibras Code hazırlayır. Layihə Mahir Əliyevin müstəqil işidir. Ünvan nibrascode.com/ai-dir. Sual, silmə və məxfilik üçün nibrascode@gmail.com.", does: "Dörd iş var: sual vermək, fikir almaq, kod yazmaq, şəkil hazırlamaq və ya hazır şəkli düzəltmək. Hesab açılmır. Dil seçimi bu brauzerdə qalır: Azərbaycan, English, Türkçe, العربية və Русский.", notdo: "Nibras AI həkim, hüquqşünas və rəsmi dini hökm deyil. Cavabı yoxlamadan qərar vermə. Şifrə, kart nömrəsi, şəxsiyyət vəsiqəsi və gizli sənəd yazma.", pri4: "Şəkil göndərsən, şəkil də modelə gedir. Göndərilməzdən əvvəl ən uzun tərəfi 1024 pikselə endirilir. Format PNG, JPG və ya WEBP olur. Server söhbəti qəbul edirsə, mətn həmin cihaz nömrəsi ilə orada da ən çox 24 saat qalır, sonra siyahıdan düşür.", pri5: "Bir mesaj 800 simvoldan uzundursa, server artığını kəsir. Modelə gedən sual gündə 40-dır. Ayə, təfsir, hədis, lüğət, Wikidata və saytda hazır duran cavab bu saya düşmür.", pri6: "Uşaqsan və ya başqasının gizli məlumatını yazırsansa, bunu etmə. Şifrə, kart nömrəsi və şəxsi sənəd bu səhifəyə aid deyil.", pri7: "Gözləmək istəmirsənsə, bu saytın brauzerdə saxladığı məlumatı özün təmizləyə bilərsən. Serverdə qalan mətn üçün nibrascode@gmail.com ünvanına yaz. Məktub yalnız bu istəyə cavab vermək üçün oxunur." },
      en: { chats: "Chats", close: "Close", newChat: "+ New chat", about: "About", note: "A chat stays in this browser for 24 hours", empty: "No chat yet", chat: "Chat", del: "Delete chat", sure: "Delete?", deleted: "Chat deleted", missing: "Chat was not found", noopen: "Chat did not open", wait: "Waiting for a reply", now: "now", min: " min ago", hour: " h ago", kicker: "YOUR AI ASSISTANT", ask: "Ask", create: "Ideas", code: "Write code", image: "Edit image", ph: "How can I help?", codeL: "Code mode — what should I write?", codeP: "For example: a Python function that adds two numbers", imgL: "Make an image — what should I draw?", imgE: "Edit image — what should change?", imgP: "For example: a blue N logo on a dark desk", imgEp: "What should change in this image?", createL: "Idea mode — write the topic", createP: "For example: a short name for an app", askL: "Question mode — write your question", askP: "Write your question here", limit: "Limit", model: "Model", privacy: "Privacy", lead: "Nibras AI is Nibras Code’s separate assistant. It is apart from the app list: here you ask, get an idea, write code, and make an image. The project is Mahir Əliyev’s independent work.", lim1: "A question that reaches a model is limited to 40 a day. The counter grows only when a model is really called. A Quran verse, tafsir, hadith, a word meaning, a Wikidata fact, and a ready answer on the site do not use those 40.", lim2: "When the limit is full, the model stops until tomorrow. Ready answers still come that day. If one message is longer than 800 characters, the server cuts the rest.", lim3: "An image can be PNG, JPG, or WEBP. Before it is sent, the long side is reduced to 1024 pixels.", mod1: "There is no single model name. If a ready source exists, no model is called: a verse, tafsir, hadith, a word meaning, and the site’s own answer come from there.", mod2: "The remaining question goes to outside models in turn. Code, a calculation, and an ordinary chat do not use the same order. That is why an answer does not come from the same place every time.", pri1: "A chat stays in this browser for 24 hours, then it is deleted. No account is opened. A random number for this browser is also kept here.", pri2: "When a model is needed, the message and the recent chat go to the server, then to the chosen model. A ready answer does not keep the message text. The counter sends only the kind of event, not the sentence you wrote. If tracking is off in the browser, the counter does not go.", pri3: "If the server accepts the chat, the same text is also kept there with that device number. After 24 hours it drops off the list.", who: "Nibras Code makes this. The project is Mahir Əliyev’s independent work. The address is nibrascode.com/ai. For a question, deletion, or privacy, write to nibrascode@gmail.com.", does: "There are four jobs: ask a question, take an idea, write code, and make or edit an image. No account is opened. The language choice stays in this browser: Azerbaijani, English, Turkish, Arabic, and Russian.", notdo: "Nibras AI is not a doctor, a lawyer, or an official religious ruling. Do not decide before you check the answer. Do not write a password, a card number, an identity document, or a private file.", pri4: "If you send an image, the image also goes to the model. Before it is sent, the long side is reduced to 1024 pixels. The format is PNG, JPG, or WEBP. If the server accepts the chat, the text stays there with that device number for at most 24 hours, then it drops off the list.", pri5: "If one message is longer than 800 characters, the server cuts the rest. A question that reaches a model is limited to 40 a day. A verse, tafsir, hadith, a word meaning, Wikidata, and a ready answer on the site do not use that count.", pri6: "If you are a child, or you are about to write someone else’s private information, do not. A password, a card number, and a private document do not belong on this page.", pri7: "If you do not want to wait, you can clear what this site keeps in the browser yourself. For text still on the server, write to nibrascode@gmail.com. The letter is read only to answer that request." },
      tr: { chats: "Sohbetler", close: "Kapat", newChat: "+ Yeni sohbet", about: "Hakkında", note: "Sohbet bu tarayıcıda 24 saat kalır", empty: "Henüz sohbet yok", chat: "Sohbet", del: "Sohbeti sil", sure: "Sil?", deleted: "Sohbet silindi", missing: "Sohbet bulunamadı", noopen: "Sohbet açılmadı", wait: "Cevap bekleniyor", now: "şimdi", min: " dk önce", hour: " saat önce", kicker: "SENİN YAPAY ZEKA YARDIMCIN", ask: "Soru sor", create: "Fikir ver", code: "Kod yaz", image: "Görseli düzelt", ph: "Nasıl yardım edeyim?", codeL: "Kod modu — ne yazayım?", codeP: "Örneğin: Python’da iki sayıyı toplayan fonksiyon", imgL: "Görsel hazırla — ne çizeyim?", imgE: "Görseli düzelt — ne değişsin?", imgP: "Örneğin: koyu masada mavi N logosu", imgEp: "Bu görselde neyi değişeyim?", createL: "Fikir modu — konuyu yaz", createP: "Örneğin: uygulama için kısa ad", askL: "Soru modu — sorunu yaz", askP: "Sorunu buraya yaz", limit: "Limit", model: "Model", privacy: "Gizlilik", lead: "Nibras AI, Nibras Code’un ayrı yardımcısıdır. Uygulama listesinden ayrıdır: burada soru sorulur, fikir alınır, kod yazılır ve görsel hazırlanır. Proje, Mahir Əliyev’in bağımsız işidir.", lim1: "Modele giden soru günde 40’tır. Sayacı yalnız model gerçekten çağrılınca artar. Kuran ayeti, tefsir, hadis, sözlük, Wikidata faktı ve sitede hazır duran cevap bu 40’a düşmez.", lim2: "Limit dolunca model yarına kadar durur. Hazır cevaplar o gün de gelir. Bir mesaj 800 karakterden uzunsa sunucu fazlasını keser.", lim3: "Görsel PNG, JPG veya WEBP olabilir. Gönderilmeden önce uzun kenarı 1024 piksele indirilir.", mod1: "Tek bir model adı yoktur. Hazır kaynak varsa model çağrılmaz: ayet, tefsir, hadis, sözlük ve sitenin kendi cevabı oradan gelir. JSON, MD5, Base64, Unix, cron ve chmod gibi hizmet istekleri de hazır cevaptır.", mod2: "Kalan soru sunucuda sırayla dış modellere gider. Kod, hesap ve olağan sohbet aynı sırayı kullanmaz. Bu yüzden cevap her sefer aynı yerden gelmez.", pri1: "Sohbet bu tarayıcıda 24 saat kalır, sonra s       ar: { chats: "المحادثات", close: "إغلاق", newChat: "+ محادثة جديدة", about: "حول", note: "تبقى المحادثة في هذا المتصفح 24 ساعة", empty: "لا محادثة بعد", chat: "محادثة", del: "احذف المحادثة", sure: "حذف؟", deleted: "حُذفت المحادثة", missing: "لم تُوجد المحادثة", noopen: "لم تُفتح المحادثة", wait: "يُنتظر الجواب", now: "الآن", min: " د قبل", hour: " س قبل", kicker: "مساعدك", ask: "اسأل", create: "فكرة", code: "اكتب كوداً", image: "عدّل صورة", ph: "كيف أساعد؟", codeL: "وضع الكود — ماذا أكتب؟", codeP: "مثلاً: دالة بايثون تجمع عددين", imgL: "جهّز صورة — ماذا أرسم؟", imgE: "عدّل الصورة — ماذا يتغير؟", imgP: "مثلاً: شعار N أزرق على طاولة داكنة", imgEp: "ماذا أغيّر في هذه الصورة؟", createL: "وضع الفكرة — اكتب الموضوع", createP: "مثلاً: اسم قصير لتطبيق", askL: "وضع السؤال — اكتب سؤالك", askP: "اكتب سؤالك هنا", limit: "الحد", model: "النموذج", privacy: "الخصوصية", lead: "Nibras AI مساعد منفصل لـ Nibras Code. هو بعيد عن قائمة التطبيقات: هنا يُطرح سؤال وتُؤخذ فكرة ويُكتب كود وتُجهَّز صورة. المشروع عمل مستقل لماهِر علييف.", lim1: "السؤال الذي يصل إلى نموذج محدود بأربعين في اليوم. العداد يزيد فقط حين يُستدعى النموذج فعلاً. آية القرآن والتفسير والحديث ومعنى الكلمة وحقيقة من ويكي بيانات والجواب الجاهز في الموقع لا تدخل في هذه الأربعين.", lim2: "حين يمتلئ الحد يتوقف النموذج إلى الغد. الأجوبة الجاهزة تبقى في ذلك اليوم. إذا زادت رسالة عن 800 حرف يقطع الخادم الباقي.", lim3: "الصورة تكون PNG أو JPG أو WEBP. قبل الإرسال يُقصَر أطول ضلع إلى 1024 بكسل.", mod1: "لا اسم واحد للنموذج. إذا وُجد مصدر جاهز لا يُستدعى نموذج: الآية والتفسير والحديث ومعنى الكلمة وجواب الموقع نفسه تأتي من هناك.", mod2: "السؤال الباقي يذهب بالدور إلى نماذج خارجية. الكود والحساب والمحادثة العادية لا تستخدم الترتيب نفسه. لذلك لا يأتي الجواب من المكان نفسه كل مرة.", pri1: "تبقى المحادثة في هذا المتصفح 24 ساعة ثم تُحذف. لا يُفتح حساب. رقم عشوائي لهذا المتصفح يُحفظ هنا أيضاً.", pri2: "حين يُحتاج نموذج تذهب الرسالة وآخر المحادثة إلى الخادم ثم إلى النموذج المختار. الجواب الجاهز لا يحفظ نص الرسالة. العداد يرسل نوع الحد     function ensure3d(files, task) {
      const html = files.filter(function (file) { return /\.html?$/.test(file.path); })[0];
      const has = html && /id=["']scene["']/.test(html.content);
      if (!wants3d(task) && !has) return [];
      const notes = [];
      const found = html && html.content.match(/data-kind="(city|product|orbit)"/);
      const kind = sceneKind(task, found && found[1]);
      const color = sceneColor(task);
      const tag = '<canvas id="scene" data-kind="' + kind + '" data-color="' + color + '"></canvas>';
      if (html && !/<canvas\b/i.test(html.content)) {
        if (/<body[^>]*>/i.test(html.content)) html.content = html.content.replace(/<body[^>]*>/i, function (m) { return m + "\n" + tag; });
        else html.content += "\n" + tag;
        notes.push("canvas");
      } else if (html) {
        html.content = html.content.replace(/<canvas\b[^>]*>/i, tag);
      }
      notes.push(kind === "city" ? "şəhər" : kind === "product" ? "məhsul" : "orbit");
      if (color !== "0.45,0.7,1") notes.push("rəng");
      if (html && !/<h1\b/i.test(html.content)) {
        const title = String(task || "3D").replace(/[<>&]/g, "").trim().slice(0, 48) || "3D";
        const hud = "<h1>" + title + "</h1><p class=\"hint\">Meydan · 1 alış · 2 lampa</p><p id=\"near\"></p>";
        if (/<body[^>]*>/i.test(html.content)) html.content = html.content.replace(/<body[^>]*>/i, function (m) { return m + "\n" + hud; });
        else html.content = hud + "\n" + html.content;
        notes.push("başlıq");
      }
      if (html && !/id=["']near["']/.test(html.content)) {
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, "<p id=\"near\"></p>\n</body>");
        else html.content += "<p id=\"near\"></p>";
      }
      if (html && !/data-scene=/.test(html.content)) {
        const nav = "<nav class=\"modes\"><button type=\"button\" data-scene=\"orbit\">Orbit</button><button type=\"button\" data-scene=\"city\">Şəhər</button><button type=\"button\" data-scene=\"product\">Məhsul</button><button type=\"button\" data-sky=\"1\">Gecə</button><button type=\"button\" data-home=\"1\">Ev</button></nav>";
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, nav + "\n</body>");
        else html.content += nav;
        notes.push("düymə");
      } else if (html && !/data-sky=/.test(html.content)) {
        html.content = html.content.replace(/<\/nav>/i, "<button type=\"button\" data-sky=\"1\">Gecə</button></nav>");
        notes.push("gecə");
      } else if (html && !/data-home=/.test(html.content)) {
        html.content = html.content.replace(/<\/nav>/i, "<button type=\"button\" data-home=\"1\">Ev</button></nav>");
        notes.push("ev");
      }
      if (html && !/data-move=/.test(html.content)) {
        const pad = "<div class=\"pad\"><span></span><button type=\"button\" data-move=\"w\">↑</button><span></span><button type=\"button\" data-move=\"a\">←</button><button type=\"button\" data-move=\"s\">↓</button><button type=\"button\" data-move=\"d\">→</button></div>";
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, pad + "\n</body>");
        else html.content += pad;
        notes.push("get");
      }
      if (html && !/data-enter=/.test(html.content)) {
        const enter = "<button type=\"button\" id=\"enter\" data-enter=\"1\">Gir</button>";
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, enter + "\n</body>");
        else html.content += enter;
        notes.push("gir");
      }
      if (html && !/data-act=/.test(html.content)) {
        const act = "<button type=\"button\" id=\"act\" data-act=\"1\">Al</button>";
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, act + "\n</body>");
        else html.content += act;
        notes.push("iş");
      }
      if (html && !/id=["']score["']/.test(html.content)) {
        const score = "<p id=\"score\"></p>";
        if (/<\/body>/i.test(html.content)) html.content = html.content.replace(/<\/body>/i, score + "\n</body>");
        else html.content += score;
      }
      let js = files.filter(function (file) { return /\.js$/.test(file.path); })[0];
      if (!js) {
        js = { path: "app.js", content: "" };
        if (files.length < 12) files.push(js);
      }
      if (js && js.content.indexOf("data-win") < 0) {
        js.content = scene3d();
        notes.push("işıq");
        notes.push("zoom");
      }
      return notes;
    }

    }
    async function runPdf(data) {
      const byId = {};
      sessFiles.forEach(function (x) { byId[x.id] = x; });
      const files = (data.pdfAction.targets || []).map(function (id) { return byId[id]; }).filter(Boolean).map(function (x) { return x.file; });
      bubble(data.reply, "b");
      rec("b", data.reply, "", 0);
      const card = document.createElement("div");
      card.className = "msg b";
      card.setAttribute("data-pdf", data.pdfAction.tool);
      msgs.appendChild(card);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const mod = await loadRunner();
        await mod.default.handle({ action: data.pdfAction, files: files, lang: data.lang || uiLangCode, container: card });
        if (data.done) {
          const d = document.createElement("div");
          d.className = "nbp-done";
          d.textContent = data.done;
          card.appendChild(d);
          rec("b", data.done, "", 0);
        }
      } catch (e) {
        if (!card.querySelector("[data-nbp=error]")) { card.textContent = pu("fail"); }
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
    (function () {
      const ov = document.createElement("div");
      ov.id = "dropov";
      ov.innerHTML = "<div></div>";
      document.body.appendChild(ov);
      let depth = 0;
      const hasFiles = function (e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; };
      document.addEventListener("dragenter", function (e) { if (!hasFiles(e)) return; depth++; ov.firstChild.textContent = pu("drop"); ov.classList.add("on"); });
      document.addEventListener("dragover", function (e) { if (hasFiles(e)) e.preventDefault(); });
      document.addEventListener("dragleave", function (e) { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) ov.classList.remove("on"); });
      document.addEventListener("drop", function (e) {
        if (!hasFiles(e)) return;
        e.preventDefault();
        depth = 0;
        ov.classList.remove("on");
        Array.prototype.slice.call(e.dataTransfer.files).forEach(pdfAdd);
      });
    })();
    document.getElementById("file").addEventListener("change", function () {
      const list = Array.prototype.slice.call(this.files || []);
      this.value = "";
      list.forEach(pdfAdd);
      const file = list.length === 1 && /^image\/(png|jpeg|webp)$/.test(list[0].type) ? list[0] : null;
      if (!file) return;
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const max = 1024;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingImage = canvas.toDataURL("image/jpeg", 0.82);
        const thumb = document.getElementById("thumb");
        thumb.src = pendingImage;
        thumb.classList.add("on");
        setMode("image");
        URL.revokeObjectURL(url);
        inp.focus();
      };
      img.onerror = function () { note("Şəkil açılmadı."); };
      img.src = url;
    });
    document.getElementById("clip").addEventListener("click", function () {
      document.getElementById("file").click();
    });

    // ---- Söhbətlərin saxlanması: dərhal localStorage (24 saat) + Supabase (/api/chats, imkan varsa)
    const CH_KEY = "nibras_chats_v1";
    const DEV_KEY = "nibras_device_v1";
    const KEEP_MS = 24 * 3600 * 1000;
    const TITLE_MAX = 40;
    const SYNC_MAX = 190000;
    let store = { cur: "", items: {} };
    let curItem = null;
    let busy = false;
    let serverOffUntil = 0;
    let syncTimer = 0;
    const dirty = {};
    const remoteList = [];

    function rid() {
      try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
      let s = "";
      for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s;
    }
    function deviceId() {
      let d = "";
      try { d = localStorage.getItem(DEV_KEY) || ""; } catch (e) {}
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(d)) {
        d = rid();
        try { localStorage.setItem(DEV_KEY, d); } catch (e) {}
      }
      return d;
    }
    function prune() {
      const lim = Date.now() - KEEP_MS;
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (!it || !Array.isArray(it.msgs) || !(it.t > lim)) delete store.items[id];
      });
      if (!store.items[store.cur]) store.cur = "";
    }
    function readStore() {
      let o = null;
      try { o = JSON.parse(localStorage.getItem(CH_KEY)); } catch (e) {}
      store = o && typeof o === "object" && o.items && typeof o.items === "object" ? { cur: String(o.cur || ""), items: o.items, pm: o.pm || null } : { cur: "", items: {}, pm: null };
      prune();
    }
    function writeStore() {
      prune();
      for (let tries = 0; tries < 6; tries++) {
        try { localStorage.setItem(CH_KEY, JSON.stringify(store)); return; } catch (e) {
          // yer qurtarıb: ən köhnə (cari olmayan) söhbəti atırıq
          const ids = Object.keys(store.items).filter(function (k) { return k !== store.cur; }).sort(function (a, b) { return store.items[a].t - store.items[b].t; });
          if (!ids.length) return;
          delete store.items[ids[0]];
        }
      }
    }
    function mkTitle(text) {
      const t = String(text || "").replace(/\s+/g, " ").trim();
      const a = Array.from(t);
      return a.length > TITLE_MAX ? a.slice(0, TITLE_MAX).join("").trim() + "…" : t;
    }
    // Bu söhbətdə artıq göstərilmiş hazır oyunlar (slug-lar, ardıcıllıqla): serverə yalnız son 8 mesaj getdiyi üçün ayrıca göndərilir
    function gamesShown() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x || m.k !== "b") return;
        String(m.t).replace(/^::game:: ([a-z0-9-]+) \|/gm, function (all, slug) { out.push(slug); return all; });
      });
      return out.slice(-60);
    }
    function threadOf() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x) return;
        if (m.k === "u") out.push({ role: "user", text: m.t });
        else if (m.k === "b") out.push({ role: "assistant", text: m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t }); // oyun kodu (40-90KB) hər sorğuda göndərilmir; yalnız gizli işarə qalır
      });
      return out;
    }
    // Hər dəyişiklikdə çağırılır: yerli yaddaşa yazır, serverə planlayır
    // Bu söhbətdə dini cavab bildirişi artıq göstərilibmi? (saxlanan tarixçədən; yeni söhbətdə false; yenidən yükləmədən sonra da işləyir)
    function noticeShown() {
      return !!curItem && curItem.msgs.some(function (m) {
        return m.k === "b" && !m.x && (String(m.t).indexOf("::notice::") >= 0 || String(m.t).indexOf("süni intellektdən din öyrənilməz") >= 0);
      });
    }
    function rec(k, t, i, x) {
      if (!curItem) {
        const id = rid();
        curItem = { id: id, title: mkTitle(t), mode: mode, msgs: [], t: Date.now() };
        store.items[id] = curItem;
        store.cur = id;
      }
      const m = { k: k, t: String(t) };
      if (i && /^https?:\/\//i.test(i) && i.length <= 2000) m.i = i;
      if (x) m.x = 1;
      curItem.msgs.push(m);
      curItem.mode = mode;
      curItem.t = Date.now();
      store.cur = curItem.id;
      writeStore();
      schedule(curItem.id);
      return m;
    }
    function serverOk() { return Date.now() >= serverOffUntil; }
    function schedule(id) {
      if (!serverOk()) return;
      dirty[id] = 1;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(flushNow, 800);
    }
    function apiHeaders(json) {
      const h = { "x-device-id": deviceId() };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }
    function noteReply(r) {
      return r.json().then(function (d) {
        if (!d || d.storage === false || d.ok === false && r.status >= 500) serverOffUntil = Date.now() + 5 * 60 * 1000;
        return d;
      });
    }
    function fitForServer(msgs) {
      const out = msgs.map(function (m) {
        const c = { k: m.k, t: (m.k === "b" && m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t).slice(0, 20000) }; // serverdə mesaj limiti 20000: oyun kodu saxlanmır, işarə qalır
        if (m.i) c.i = m.i;
        if (m.x) c.x = 1;
        return c;
      }).slice(-200);
      while (out.length > 1 && JSON.stringify(out).length > SYNC_MAX) out.shift();
      return out;
    }
    function flushNow() {
      clearTimeout(syncTimer);
      const ids = Object.keys(dirty);
      ids.forEach(function (id) { delete dirty[id]; });
      if (!serverOk()) return;
      ids.forEach(function (id) {
        const it = store.items[id];
        if (!it || !it.msgs.length) return;
        const body = JSON.stringify({ title: it.title, messages: fitForServer(it.msgs) });
        try {
          fetch("/api/chats?id=" + encodeURIComponent(id), { method: "PUT", headers: apiHeaders(true), body: body, keepalive: body.length < 60000 })
            .then(noteReply).catch(function () {});
        } catch (e) {}
      });
    }
    function renderItem(it) {
      msgs.innerHTML = "";
      if (!it || !it.msgs.length) {
        msgs.appendChild(hello);
        return;
      }
      it.msgs.forEach(function (m) { bubble(m.t, m.k, m.i || "", true); });
      msgs.scrollTop = msgs.scrollHeight;
    }
    function restoreCurrent() {
      readStore();
      writeStore();
      const it = store.items[store.cur];
      if (!it) {
        curItem = null;
        const pm = store.pm;
        if (pm && pm.t > Date.now() - KEEP_MS && (pm.m === "ask" || pm.m === "code" || pm.m === "create")) {
          restoring = true;
          setMode(pm.m);
          restoring = false;
        }
        return;
      }
      curItem = it;
      renderItem(it);
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" || it.mode === "layihe" ? it.mode : "chat");
      restoring = false;
    }

    // ---- Söhbətlər paneli
    const drawer = document.getElementById("drawer");
    const scrim = document.getElementById("scrim");
    const dlist = document.getElementById("dlist");
    const menuBtn = document.getElementById("menu");
    function ago(t0) {
      const m = Math.max(0, Math.round((Date.now() - t0) / 60000));
      if (m < 1) return t("now");
      if (m < 60) return m + t("min");
      return Math.round(m / 60) + t("hour");
    }
    function listEntries() {
      const lim = Date.now() - KEEP_MS;
      const map = {};
      remoteList.forEach(function (r) { const t = Date.parse(r.updated_at); if (t > lim) map[r.id] = { id: r.id, title: r.title, t: t }; });
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (it.t > lim) map[id] = { id: id, title: it.title, t: it.t };
      });
      return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.t - a.t; });
    }
    function renderList() {
      const rows = listEntries();
      dlist.innerHTML = "";
      if (!rows.length) {
        const p = document.createElement("p");
        p.className = "dempty";
        p.textContent = t("empty");
        dlist.appendChild(p);
        return;
      }
      rows.forEach(function (r) {
        const row = document.createElement("div");
        row.className = "ditem" + (curItem && curItem.id === r.id ? " cur" : "");
        row.setAttribute("data-id", r.id);
        const open = document.createElement("button");
        open.type = "button";
        open.className = "dopen";
        const title = document.createElement("span");
        title.textContent = r.title || t("chat");
        const sm = document.createElement("small");
        sm.textContent = ago(r.t);
        open.appendChild(title);
        open.appendChild(sm);
        open.addEventListener("click", function () { openChat(r.id); });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "ddel";
        del.setAttribute("aria-label", t("del"));
        del.textContent = "×";
        let armed = 0;
        del.addEventListener("click", function () {
          if (!del.classList.contains("sure")) {
            del.classList.add("sure");
            del.textContent = t("sure");
            clearTimeout(armed);
            armed = setTimeout(function () { del.classList.remove("sure"); del.textContent = "×"; }, 3000);
            return;
          }
          deleteChat(r.id);
        });
        row.appendChild(open);
        row.appendChild(del);
        dlist.appendChild(row);
      });
    }
    function refreshRemote() {
      if (!serverOk()) return Promise.resolve();
      return fetch("/api/chats", { headers: apiHeaders(false) }).then(noteReply).then(function (d) {
        if (d && d.ok && d.storage && Array.isArray(d.chats)) {
          remoteList.length = 0;
          d.chats.forEach(function (c) { if (c && typeof c.id === "string") remoteList.push(c); });
          renderList();
        }
      }).catch(function () {});
    }
    function guessLang() {
      const fromPath = String(location.pathname || "").match(/^\/(en|tr|ar|ru)\/ai\/?$/);
      const cand = [fromPath && fromPath[1], localStorage.getItem(LANG_KEY), navigator.language, (navigator.languages || [])[0]];
      for (let i = 0; i < cand.length; i++) {
        const c = String(cand[i] || "").toLowerCase().slice(0, 2);
        if (UI[c]) return c;
      }
      return "az";
    }
    function fillAbout() {
      const box = document.getElementById("aboutin");
      box.innerHTML = "";
      function p(cls, text) {
        const el = document.createElement(cls === "h2" ? "h2" : "p");
        if (cls === "lead") el.className = "leadline";
        el.textContent = text;
        box.appendChild(el);
      }
      p("h2", t("about"));
      p("lead", t("lead"));
      p("p", t("who"));
      p("p", t("does"));
      p("p", t("notdo"));
      p("h2", t("limit"));
      p("p", t("lim1"));
      p("p", t("lim2"));
      p("p", t("lim3"));
      p("h2", t("model"));
      p("p", t("mod1"));
      p("p", t("mod2"));
      p("h2", t("privacy"));
      ["pri1","pri2","pri3","pri4","pri5","pri6","pri7"].forEach(function (k) { p("p", t(k)); });
    }
    function applyLang(code) {
      if (!UI[code]) code = "az";
      uiLangCode = code;
      try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
      document.documentElement.lang = code;
      document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      document.getElementById("aboutbtn").textContent = t("about");
      document.getElementById("chathead").textContent = t("chats");
      document.getElementById("newchat").textContent = t("newChat");
      document.getElementById("dnote").textContent = t("note");
      document.getElementById("kicker").textContent = t("kicker");
      document.querySelectorAll("[data-ui]").forEach(function (el) { el.textContent = t(el.getAttribute("data-ui")); });
      paintDock();
      document.querySelectorAll("#langs button").forEach(function (el) { el.classList.toggle("on", el.getAttribute("data-lang") === code); });
      document.getElementById("langhead").textContent = LANG_NAME[code];
      menuBtn.setAttribute("aria-label", t("chats"));
      menuBtn.setAttribute("title", t("chats"));
      drawer.setAttribute("aria-label", t("chats"));
      document.getElementById("dclose").setAttribute("aria-label", t("close"));
      const chrome = {
        az: ["Premium bağlıdır", "Fayl", "Göndər"],
        en: ["Premium is off", "File", "Send"],
        tr: ["Premium kapalı", "Dosya", "Gönder"],
        ar: ["بريميوم مغلق", "ملف", "أرسل"],
        ru: ["Премиум выключен", "Файл", "Отправить"]
      }[code];
      if (chrome) {
        document.getElementById("prem").setAttribute("aria-label", chrome[0]);
        document.getElementById("clip").setAttribute("aria-label", chrome[1]);
        document.getElementById("btn").setAttribute("aria-label", chrome[2]);
      }
      const brand = document.querySelector(".brand");
      if (brand) brand.setAttribute("href", code === "az" ? "/" : "/" + code);
      fillAbout();
      setMode(mode);
      if (typeof renderList === "function") renderList();
    }
    function setDrawer(on) {
      const was = drawer.classList.contains("on");
      drawer.classList.toggle("on", on);
      scrim.classList.toggle("on", on);
      drawer.setAttribute("aria-hidden", on ? "false" : "true");
      menuBtn.setAttribute("aria-expanded", on ? "true" : "false");
      if (on) {
        prune();
        renderList();
        refreshRemote();
        if (!was) { try { document.getElementById("dclose").focus(); } catch (e) {} }
      } else if (was && drawer.contains(document.activeElement)) {
        try { menuBtn.focus(); } catch (e) {} // klaviatura fokusu menyu düyməsinə qayıdır
      }
    }
    function resetView() {
      restoring = true;
      setMode("chat");
      restoring = false;
      pendingImage = "";
      const thumb = document.getElementById("thumb");
      thumb.classList.remove("on");
      thumb.removeAttribute("src");
      inp.value = "";
    }
    function newChat() {
      if (busy) { note(t("wait")); return; }
      flushNow();
      curItem = null;
      store.cur = "";
      store.pm = null;
      writeStore();
      renderItem(null);
      resetView();
      setDrawer(false);
    }
    async function openChat(id) {
      if (busy) { note(t("wait")); return; }
      flushNow();
      let it = store.items[id];
      if (!it) {
        try {
          const r = await fetch("/api/chats?id=" + encodeURIComponent(id), { headers: apiHeaders(false) });
          const d = await r.json();
          const c = d && d.ok && d.chat;
          if (!c || !Array.isArray(c.messages)) { note(t("missing")); return; }
          it = { id: id, title: c.title || t("chat"), mode: "chat", msgs: c.messages, t: Date.parse(c.updated_at) || Date.now() };
          store.items[id] = it;
        } catch (e) { note(t("noopen")); return; }
      }
      curItem = it;
      store.cur = id;
      writeStore();
      renderItem(it);
      resetView();
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" || it.mode === "layihe" ? it.mode : "chat");
      restoring = false;
      setDrawer(false);
    }
    function deleteChat(id) {
      if (busy && curItem && curItem.id === id) { note(t("wait")); return; }
      delete store.items[id];
      delete dirty[id];
      for (let i = remoteList.length - 1; i >= 0; i--) if (remoteList[i].id === id) remoteList.splice(i, 1);
      if (curItem && curItem.id === id) {
        curItem = null;
        store.cur = "";
        renderItem(null);
        resetView();
      }
      writeStore();
      renderList();
      if (serverOk()) {
        try { fetch("/api/chats?id=" + encodeURIComponent(id), { method: "DELETE", headers: apiHeaders(false) }).then(noteReply).catch(function () {}); } catch (e) {}
      }
      note(t("deleted"));
    }
    menuBtn.addEventListener("click", function () { setDrawer(!drawer.classList.contains("on")); });
    document.getElementById("dclose").addEventListener("click", function () { setDrawer(false); });
    const aboutBtn = document.getElementById("aboutbtn");
    const aboutIn = document.getElementById("aboutin");
    const chatHead = document.getElementById("chathead");
    const chatBox = document.getElementById("chatbox");
    const langHead = document.getElementById("langhead");
    const langList = document.getElementById("langs");
    let aboutOn = false;
    function setLangOpen(on) {
      langList.classList.toggle("on", on);
      langHead.setAttribute("aria-expanded", on ? "true" : "false");
      langHead.classList.toggle("on", on);
    }
    function closeFolds() {
      aboutOn = false;
      aboutIn.classList.remove("on");
      aboutBtn.setAttribute("aria-expanded", "false");
      aboutBtn.classList.remove("on");
      chatBox.classList.remove("on");
      chatHead.setAttribute("aria-expanded", "false");
      chatHead.classList.remove("on");
      setLangOpen(false);
    }
    function setAbout(on) {
      closeFolds();
      if (!on) return;
      aboutOn = true;
      aboutIn.classList.add("on");
      aboutBtn.setAttribute("aria-expanded", "true");
      aboutBtn.classList.add("on");
      aboutIn.scrollTop = 0;
    }
    function setChats(on) {
      closeFolds();
      if (!on) return;
      chatBox.classList.add("on");
      chatHead.setAttribute("aria-expanded", "true");
      chatHead.classList.add("on");
      renderList();
    }
    aboutBtn.addEventListener("click", function () { setAbout(!aboutOn); });
    chatHead.addEventListener("click", function () { setChats(!chatBox.classList.contains("on")); });
    langHead.addEventListener("click", function () {
      const open = !langList.classList.contains("on");
      closeFolds();
      if (open) setLangOpen(true);
    });
    langList.addEventListener("click", function (e) {
      const btn = e.target.closest("button");
      if (!btn) return;
      applyLang(btn.getAttribute("data-lang"));
      setLangOpen(false);
    });
    scrim.addEventListener("click", function () { setDrawer(false); });
    document.getElementById("newchat").addEventListener("click", newChat);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setDrawer(false); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushNow(); });
    window.addEventListener("pagehide", flushNow);
    window.nibrasChats = { open: openChat, newChat: newChat, remove: deleteChat, flush: flushNow };
    restoreCurrent();
    applyLang(guessLang());
    paint();
  </script>
</body>
