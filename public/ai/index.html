<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nibras AI</title>
  <meta name="description" content="Nibras AI — Nibras Code köməkçisi. Sual ver, düzəlt, həll et." />
  <link rel="icon" href="/nibras-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @property --nx-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes nx-edge { to { --nx-angle: 360deg; } }
    @keyframes blink { 50% { opacity: .25; } }
    :root {
      --ink: #04060f;
      --fg: #f4f7ff;
      --muted: #9aa3bd;
      --line: rgba(130, 170, 255, .28);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fg);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      background: #03040c;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    .glow, .glow svg { position: fixed; inset: 0; pointer-events: none; }
    .glow svg { width: 100%; height: 100%; }
    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 38px; height: 34px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(80,140,255,.55)); }
    .brand b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .meta { display: flex; align-items: center; gap: 8px; flex: none; }
    .crown, .home {
      border: 1px solid rgba(120, 170, 255, .45);
      background: rgba(8, 12, 28, .72);
      color: #eef3ff;
      box-shadow: 0 0 16px rgba(70, 120, 255, .18);
    }
    .crown, .home {
      width: 38px; height: 38px; border-radius: 999px;
      display: grid; place-items: center; padding: 0; cursor: pointer;
    }
    .home {
      width: auto;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(180deg, rgba(40,70,160,.35), rgba(20,24,48,.8));
    }
    .crown { position: relative; }
    .crown svg { width: 18px; height: 18px; }
    .crown i {
      position: absolute; right: -2px; bottom: -2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #121624; border: 1px solid rgba(255,255,255,.16);
      display: grid; place-items: center;
    }
    .crown i svg { width: 8px; height: 8px; }
    #msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 16px 8px;
    }
    .hello { margin: auto; width: 100%; text-align: center; padding: 6px 0 10px; }
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) auto minmax(0, 1.05fr);
      align-items: center;
      gap: 6px;
    }
    .whisper {
      margin: 0;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.4;
      color: rgba(176, 186, 214, .82);
    }
    .whisper small {
      display: block;
      margin-top: 7px;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.35;
      color: rgba(196, 206, 232, .7);
    }
    .script {
      margin: 0;
      text-align: right;
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 650;
      font-style: italic;
      line-height: 1.35;
      color: #f2f4ff;
    }
    .script span { display: block; }
    .script em {
      display: block;
      height: 8px;
      margin-top: 2px;
      background: radial-gradient(60% 100% at 70% 0%, rgba(160,110,255,.95), transparent 72%);
      border-radius: 50%;
      transform: rotate(-6deg);
    }
    .logo {
      width: min(118px, 30vw);
      height: auto;
      justify-self: center;
      filter: drop-shadow(0 10px 24px rgba(40, 90, 255, .35));
    }
    h1 {
      margin: 2px 0 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    h1 span {
      background: linear-gradient(100deg, #8fd0ff 0%, #7aa6ff 42%, #b388ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .kicker {
      margin: 8px 0 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .28em;
      color: #aeb6ce;
    }
    .acts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .act {
      border: 1px solid rgba(120, 168, 255, .28);
      background: linear-gradient(180deg, rgba(16, 22, 42, .9), rgba(8, 12, 26, .9));
      color: #d7def2;
      border-radius: 12px;
      padding: 6px 2px 5px;
      cursor: pointer;
    }
    .act svg { width: 15px; height: 15px; display: block; margin: 0 auto 3px; }
    .act b { display: block; font-size: 9px; font-weight: 600; line-height: 1.15; }
    .msg {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .u {
      margin-left: auto;
      background: linear-gradient(180deg, #6ea2ff, #7a6bff);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .b {
      margin-right: auto;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }
    .err { border-color: rgba(255,120,140,.35); color: #ffd0d6; }
    .msg pre {
      margin: 8px 0 0;
      padding: 10px;
      overflow: auto;
      border-radius: 10px;
      background: #070b16;
      color: #d7e6ff;
      font-size: 12px;
      line-height: 1.45;
    }
    .msg .ay {
      white-space: normal;
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(120, 170, 255, .08);
      border: 1px solid rgba(130, 170, 255, .28);
      border-inline-start: 3px solid #7aa7ff;
    }
    .msg .ay .at {
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
      font-family: "Amiri Quran", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif;
      font-size: 23px;
      line-height: 2.1;
      color: #f4f7ff;
    }
    .msg .ay .al { display: block; }
    .msg .ay .atr { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(130, 170, 255, .28); font-size: 14px; line-height: 1.6; color: #cfd6e6; unicode-bidi: plaintext; }
    .msg .ay .atr .trl { font-size: 11px; line-height: 1.4; color: #8d96ad; margin-bottom: 3px; }
    .msg .ay .atr .tl { display: block; }
    .msg .nt { white-space: normal; margin: 0 0 10px; padding: 8px 11px; border-radius: 10px; background: rgba(255, 190, 90, .07); border: 1px solid rgba(255, 190, 90, .38); border-inline-start: 3px solid #ffbe5a; font-size: 12.5px; line-height: 1.55; color: #f3dfb8; unicode-bidi: plaintext; }
    .msg .nt .nl { display: block; }
    .msg .nt .nq { display: block; margin-top: 2px; color: #ffe9c2; }
    .msg .nt .na { display: block; margin-top: 4px; direction: rtl; text-align: right; unicode-bidi: plaintext; font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif; font-size: 17px; line-height: 1.9; color: #fff3da; }
    .msg .nt .ns { display: block; margin-top: 4px; font-size: 10.5px; line-height: 1.4; color: #b9a67c; }
    /* Təfsir bloku: ::tafsir kitab::  ::tl:: ad  [::tv:: (ayə)]  mətn...  ::src:: mənbə  ::/tafsir:: */
    .msg .tf { white-space: normal; margin: 8px 0; padding: 9px 12px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .14); border-inline-start: 3px solid #6f7a96; }
    .msg .tf .tfl { font-size: 11px; line-height: 1.4; color: #8d96ad; margin-bottom: 4px; unicode-bidi: plaintext; }
    .msg .tf .tft { direction: rtl; text-align: right; unicode-bidi: plaintext; font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif; font-size: 18px; line-height: 2; color: #e8edf9; }
    .msg .tf .tfp { display: block; margin: 0 0 6px; }
    .msg .tf .tfv { display: block; margin: 6px 0 2px; font-size: 12px; line-height: 1.4; color: #8d96ad; font-family: inherit; }
    .msg .tf .as { margin-top: 6px; font-size: 11px; line-height: 1.45; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .tf .as a { color: #8fb4ff; text-decoration: underline; }
    .msg .sg { white-space: normal; margin: 10px 0 2px; unicode-bidi: plaintext; }
    .msg .sg .sgl { font-size: 11.5px; line-height: 1.4; color: #8d96ad; margin-bottom: 5px; unicode-bidi: plaintext; }
    .msg .sg .sgb { display: flex; flex-wrap: wrap; gap: 6px; }
    .msg .sg .chip { font: inherit; font-size: 12px; line-height: 1.2; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(143, 180, 255, .4); background: rgba(143, 180, 255, .08); color: #bcd2ff; cursor: pointer; }
    .msg .sg .chip:hover { background: rgba(143, 180, 255, .18); }
    .msg .sg .chip:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
    .msg .an { white-space: normal; margin: 6px 0; font-size: 11.5px; line-height: 1.5; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .ay .as { margin-top: 6px; font-size: 11px; line-height: 1.45; color: #8d96ad; unicode-bidi: plaintext; }
    .msg .ay .as a { color: #8fb4ff; text-decoration: underline; }
    .msg .ay.warn { border-color: rgba(255, 190, 90, .5); background: rgba(255, 190, 90, .07); border-inline-start-color: #ffbe5a; }
    .msg .ay.warn .at { font-size: 17px; line-height: 1.9; opacity: .85; }
    .msg .ay.warn .as { color: #ffd08a; }
    .msg .cb { margin-top: 8px; white-space: normal; }
    .msg .cb pre { margin: 0; white-space: pre; }
    .msg .cb .bar { display: flex; justify-content: flex-end; margin-top: 6px; }
    .runbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(94, 234, 212, .45);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(45, 212, 191, .22), rgba(20, 184, 166, .12));
      color: #8ff5e4;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .runbtn svg { width: 12px; height: 12px; display: block; }
    .runbtn:hover { border-color: #5eead4; color: #d6fff7; }
    .runbtn:disabled { opacity: .5; cursor: wait; }
    .msg img.shot {
      display: block;
      width: 100%;
      margin-top: 8px;
      border-radius: 12px;
    }
    .mode {
      margin: 0 4px 8px;
      color: #9fd6ff;
      font-size: 12px;
      font-weight: 650;
    }
    .thumb {
      display: none;
      width: 42px;
      height: 42px;
      margin-right: 8px;
      border-radius: 10px;
      object-fit: cover;
    }
    .thumb.on { display: block; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: #9fd6ff;
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    .dock { padding: 4px 16px 18px; }
    .ring {
      position: relative;
      isolation: isolate;
      border-radius: 24px;
    }
    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(
        from var(--nx-angle),
        transparent 0deg,
        #7ee7ff 55deg,
        #8d7bff 110deg,
        #ffd27a 155deg,
        #ff7eb3 200deg,
        transparent 255deg,
        transparent 360deg
      );
      animation: nx-edge 4.2s linear infinite;
    }
    .ring::before {
      inset: -1.5px;
      z-index: 2;
      padding: 1.5px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .ring::after {
      inset: -8px;
      z-index: 0;
      opacity: .55;
      filter: blur(10px);
    }
    .composer {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(7, 10, 22, .94);
      padding: 12px 12px 10px;
    }
    textarea {
      display: block;
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--fg);
      font-size: 16px;
      line-height: 1.4;
      min-height: 46px;
      padding: 2px 2px 8px;
    }
    textarea::placeholder { color: #8b93ad; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .clip {
      width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: #d5dced;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .send {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      padding: 0;
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, #3aa0ff, #7a5cff 55%, #b14bff);
      box-shadow: 0 8px 18px rgba(80, 70, 255, .28);
    }
    .send:disabled, textarea:disabled { opacity: .45; cursor: not-allowed; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      z-index: 5;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(12, 16, 32, .96);
      border: 1px solid rgba(160, 140, 255, .35);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      color: #f4f7ff;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .menu {
      width: 38px; height: 38px; border-radius: 999px; padding: 0; cursor: pointer;
      display: grid; place-items: center; flex: none;
      border: 1px solid rgba(94, 234, 212, .45);
      background: rgba(8, 12, 28, .72);
      color: #8ff5e4;
      box-shadow: 0 0 16px rgba(45, 212, 191, .16);
    }
    .menu svg { width: 20px; height: 20px; display: block; }
    .menu:hover { border-color: #5eead4; }
    .menu:focus-visible, .dx:focus-visible, .newchat:focus-visible, .dopen:focus-visible, .ddel:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
    html[dir="rtl"] .drawer { right: auto; left: 0; transform: translateX(-102%); border-left: 0; border-right: 1px solid rgba(94, 234, 212, .28); box-shadow: 12px 0 40px rgba(0, 0, 0, .5); }
    html[dir="rtl"] .drawer.on { transform: none; }
    html[dir="rtl"] .dopen { text-align: right; padding: 10px 12px 10px 6px; }
    html[dir="rtl"] .ddel { border-radius: 12px 0 0 12px; }
    .lead { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .scrim {
      position: fixed; inset: 0; z-index: 19;
      background: rgba(2, 4, 12, .62);
      opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s;
    }
    .scrim.on { opacity: 1; visibility: visible; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 20;
      width: min(320px, 86vw);
      display: flex; flex-direction: column; gap: 10px;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #08112a, #050918);
      border-left: 1px solid rgba(94, 234, 212, .28);
      box-shadow: -12px 0 40px rgba(0, 0, 0, .5);
      transform: translateX(102%); visibility: hidden;
      transition: transform .22s ease, visibility .22s;
    }
    .drawer.on { transform: none; visibility: visible; }
    .dh { display: flex; align-items: center; justify-content: space-between; }
    .dh b { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .dx {
      width: 34px; height: 34px; border-radius: 10px; cursor: pointer; padding: 0;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: #d5dced;
      font-size: 20px; line-height: 1;
    }
    .newchat {
      min-height: 42px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px;
      border: 1px solid rgba(94, 234, 212, .5);
      background: linear-gradient(180deg, rgba(45, 212, 191, .24), rgba(20, 184, 166, .12));
      color: #b8fbef;
    }
    .newchat:hover { border-color: #5eead4; }
    .dlist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .ditem {
      display: flex; align-items: stretch; gap: 6px;
      border: 1px solid rgba(130, 170, 255, .2); border-radius: 12px;
      background: rgba(255,255,255,.035);
    }
    .ditem.cur { border-color: rgba(94, 234, 212, .6); background: rgba(45, 212, 191, .09); }
    .dopen {
      flex: 1; min-width: 0; text-align: left; cursor: pointer;
      border: 0; background: transparent; color: var(--fg);
      padding: 10px 6px 10px 12px; font-size: 13.5px; font-weight: 600;
    }
    .dopen span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dopen small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .ddel {
      flex: none; min-width: 40px; border: 0; background: transparent; cursor: pointer;
      color: #9aa3bd; font-size: 18px; border-radius: 0 12px 12px 0; padding: 0 8px;
    }
    .ddel.sure { color: #ffb3bf; font-size: 12px; font-weight: 700; }
    .dempty { margin: 18px 4px; color: var(--muted); font-size: 13px; text-align: center; }
    .dnote { margin: 0; text-align: center; color: #8fd9cd; font-size: 12px; font-weight: 600; }
    @media (max-width: 380px) {
      .brand small { display: none; }
      .top { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: 30px; }
      .script { font-size: 10px; }
      .whisper { font-size: 9px; }
      .stage { gap: 4px; }
      .logo { width: 112px; }
      .act b { font-size: 8.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dots i, .ring::before, .ring::after { animation: none; }
      .drawer, .scrim { transition: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2f6bff" stop-opacity=".0"/>
          <stop offset=".5" stop-color="#3d7dff" stop-opacity=".85"/>
          <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a4bff" stop-opacity="0"/>
          <stop offset=".45" stop-color="#7d5cff" stop-opacity=".7"/>
          <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M-40 210 C 80 40, 220 20, 460 250" fill="none" stroke="url(#a)" stroke-width="18" opacity=".55"/>
      <path d="M460 430 C 300 360, 250 520, 430 760" fill="none" stroke="url(#b)" stroke-width="16" opacity=".5"/>
      <path d="M-20 690 C 80 640, 140 760, 40 860" fill="none" stroke="#2f7bff" stroke-width="14" opacity=".35"/>
    </svg>
  </div>

  <div class="app">
    <header class="top">
      <div class="lead">
        <a class="brand" href="/">
          <img src="/nibras-ai.png" alt="" />
          <span><b>Nibras AI</b><small>Nibras Code</small></span>
        </a>
      </div>
      <div class="meta">
        <button class="crown" id="prem" type="button" aria-label="Premium bağlıdır">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">

            <defs><linearGradient id="g" x1="3" y1="5" x2="21" y2="17"><stop stop-color="#ffe7a3"/><stop offset="1" stop-color="#e0aa3a"/></linearGradient></defs>

    <div class="dh"><b>Söhbətlər</b><button class="dx" id="dclose" type="button" aria-label="Bağla">&times;</button></div>
    <button class="newchat" id="newchat" type="button">+ Yeni söhbət</button>

    <p class="dnote">Söhbətlər 24 saat saxlanılır</p>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const LIMIT = 10;
    const KEY = "nibras_ai_v2";
    const msgs = document.getElementById("msgs");
    const hello = document.getElementById("hello");
    const form = document.getElementById("form");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const toast = document.getElementById("toast");
    const today = new Date().toISOString().slice(0, 10);
    let toastTimer = 0;
    let mode = "chat";
    let restoring = false;
    let pendingImage = "";

    function note(text) {
      toast.textContent = text;
      toast.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 2200);
    }
    function load() {
      let u = { d: today, c: 0 };
      try { u = JSON.parse(localStorage.getItem(KEY)) || u; } catch (e) {}
      if (!u || u.d !== today) u = { d: today, c: 0 };
      return u;
    }
    function save(u) { localStorage.setItem(KEY, JSON.stringify(u)); }
    function remain() { return Math.max(0, LIMIT - load().c); }
    // Limit ekranda göstərilmir. Sayğac yalnız xarici AI həqiqətən çağırılanda artır (server usedAI:true qaytarır).
    // Limit dolubsa giriş bağlanmır: server hazır cavabları (AI-siz) yenə verir, AI tələb edən suala isə sadə mesaj qaytarır.
    function paint() {
      if (mode === "chat") inp.placeholder = "Nə ilə kömək edim?";
    }
    function setMode(next) {
      mode = next;
      const label = document.getElementById("mode");
      if (next === "code") {
        label.hidden = false;
        label.textContent = "Kod rejimi — nə yazım?";
        inp.placeholder = "Məsələn: Python-da iki ədədi toplayan funksiya";
      } else if (next === "image") {
        label.hidden = false;
        label.textContent = pendingImage ? "Şəkil düzəlt — nə dəyişsin?" : "Şəkil hazırla — nə çəkim?";
        inp.placeholder = pendingImage ? "Bu şəkildə nəyi dəyişim?" : "Məsələn: qaranlıq masada mavi N loqosu";
      } else if (next === "create") {
        label.hidden = false;
        label.textContent = "Fikir rejimi — mövzunu yaz";
        inp.placeholder = "Məsələn: tətbiq üçün qısa ad fikri";
      } else if (next === "ask") {
        label.hidden = false;
        label.textContent = "Sual rejimi — sualını yaz";
        inp.placeholder = "Sualını buraya yaz";
      } else {
        label.hidden = true;
        label.textContent = "";
        inp.placeholder = "Nə ilə kömək edim?";
      }
      if (!restoring) {
        if (curItem) curItem.mode = next;
        else store.pm = next === "chat" ? null : { m: next, t: Date.now() };
        writeStore();
      }
    }
    function wantsImage(text) {
      return /(şəkil|sekil|resim).{0,30}(hazırla|hazirla|yarat|çək|cek|düzəlt|duzelt|çiz|ciz|et\b)|şəkil hazırla|sekil hazirla|draw an image|generate an image/i.test(text);
    }
    function escapeHtml(text) {
      const map = { "&": "amp", "<": "lt", ">": "gt" };
      return String(text).replace(/[&<>]/g, function (ch) { return "&" + map[ch] + ";"; });
    }
    // Gizlilik dostu say: yalnız hadisə növü və adı göndərilir (IP, cookie, mətn yoxdur). Xəta olsa səssiz keçilir.
    let statErrors = 0;
    function stat(type, name) {
      try {
        if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
        const body = JSON.stringify({ type: type, name: name });
        if (navigator.sendBeacon && navigator.sendBeacon("/api/stats", new Blob([body], { type: "application/json" }))) return;
        fetch("/api/stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true }).catch(function () {});
      } catch (e) {}
    }
    try {
      if (!sessionStorage.getItem("nai_v")) {
        sessionStorage.setItem("nai_v", "1");
        stat("visit", "ai");
      }
    } catch (e) { stat("visit", "ai"); }
    window.addEventListener("error", function () {
      if (statErrors++ < 3) stat("error", "js");
    });
    const RUN_BASE = "https://nibrasterminal.vercel.app/run";
    const RUN_MAX = 60000;
    const RUN_LANGS = { python: "python", py: "python", py3: "python", javascript: "javascript", js: "javascript", html: "html", htm: "html" };
    function b64u(bytes) {
      let s = "";
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    async function buildRunUrl(lang, code) {
      const raw = new TextEncoder().encode(code);
      let best = b64u(raw);
      let z = "";
      if (typeof CompressionStream !== "undefined") {
        try {
          const packed = b64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()));
          if (packed.length < best.length) { best = packed; z = "&z=1"; }
        } catch (e) {}
      }
      return RUN_BASE + "#l=" + lang + "&c=" + best + z;
    }
    // Ayə blokları (server yazır): ::ayah 2:255::  ərəbcə sətirlər  [::tr:: etiket + tərcümə sətirləri]  ::src:: mənbə sətri  ::/ayah::
    // Blokdan sonra "::note:: mətn" sətri kiçik boz qeyd kimi çəkilir. Hər şey escape olunur;
    // yalnız mənbə sətrindəki «Tanzil» və «QuranEnc.com» sözləri öz saytlarına linkə çevrilir. Köhnə mesajlar (::tr:: olmayan) əvvəlki kimi çəkilir.
    // Dini cavabın başındakı bildiriş bloku: ::notice::  sətir  sitat  [::ar:: ərəbcə]  ::src:: mənbə  ::/notice::
    function noticeHtml(body) {
      let lead = "", quote = "", ar = "", src = "";
      body.split("\n").forEach(function (ln) {
        if (ln.indexOf("::ar::") === 0) ar = ln.replace(/^::ar::[ \t]*/, "");
        else if (ln.indexOf("::src::") === 0) src = ln.replace(/^::src::[ \t]*/, "");
        else if (!lead) lead = ln;
        else quote += (quote ? " " : "") + ln;
      });
      return '<div class="nt" dir="auto"><span class="nl">' + escapeHtml(lead) + '</span><span class="nq">' + escapeHtml(quote) + "</span>" +
        (ar ? '<span class="na" dir="rtl" lang="ar">' + escapeHtml(ar) + "</span>" : "") +
        (src ? '<span class="ns">' + escapeHtml(src) + "</span>" : "") + "</div>";
    }
    // Təfsir bloku (ərəbcə mətn, kiçik boz ad, mənbə). Hər şey escape olunur.
    function tafsirHtml(book, body) {
      let label = "", src = "", cur = "";
      const parts = [];
      body.split("\n").forEach(function (ln) {
        if (ln.indexOf("::tl::") === 0) label = ln.replace(/^::tl::[ \t]*/, "");
        else if (ln.indexOf("::src::") === 0) src = ln.replace(/^::src::[ \t]*/, "");
        else if (ln.indexOf("::tv::") === 0) parts.push('<span class="tfv" dir="auto">' + escapeHtml(ln.replace(/^::tv::[ \t]*/, "")) + "</span>");
        else if (ln.trim()) parts.push('<span class="tfp">' + escapeHtml(ln) + "</span>");
      });
      src = escapeHtml(src);
      const qe = src.indexOf("QuranEnc.com");
      if (qe >= 0) {
        const key = book === "saadi" ? "arabic_saadi" : "arabic_moyassar";
        src = src.slice(0, qe) + '<a href="https://quranenc.com/en/browse/' + key + '" target="_blank" rel="noopener noreferrer">QuranEnc.com</a>' + src.slice(qe + 12);
      }
      const gh = src.indexOf("spa5k/tafsir_api");
      if (gh >= 0) src = src.slice(0, gh) + '<a href="https://github.com/spa5k/tafsir_api" target="_blank" rel="noopener noreferrer">spa5k/tafsir_api</a>' + src.slice(gh + 16);
      return '<div class="tf">' + (label ? '<div class="tfl" dir="auto">' + escapeHtml(label) + "</div>" : "") + '<div class="tft" dir="rtl" lang="ar">' + parts.join("") + "</div>" + (src ? '<div class="as" dir="auto">' + src + "</div>" : "") + "</div>";
    }
    // Təfsir təklifi: ::sug::  ::sl:: sual  ::sb:: etiket | hazır sorğu (3 dəfə)  ::/sug::. Düymələr data-sq indeksi ilə sorğu massivinə (chipQ) bağlanır; mətn attribut dəyərinə düşmür.
    let chipQ = [];
    function sugHtml(body) {
      let lead = "";
      const chips = [];
      body.split("\n").forEach(function (ln) {
        if (ln.indexOf("::sl::") === 0) lead = ln.replace(/^::sl::[ \t]*/, "");
        else if (ln.indexOf("::sb::") === 0) {
          const v = ln.replace(/^::sb::[ \t]*/, "");
          const k = v.indexOf(" | ");
          if (k > 0 && k < v.length - 3) {
            chipQ.push(v.slice(k + 3).trim());
            chips.push('<button type="button" class="chip" data-sq="' + (chipQ.length - 1) + '">' + escapeHtml(v.slice(0, k)) + "</button>");
          }
        }
      });
      if (!chips.length) return "";
      return '<div class="sg">' + (lead ? '<div class="sgl" dir="auto">' + escapeHtml(lead) + "</div>" : "") + '<div class="sgb">' + chips.join("") + "</div></div>";
    }
    function ayahHtml(text) {
      const nre = /(?:^|\n)::notice::\n([\s\S]*?)\n::\/notice::(?=\n|$)/;
      const nm = nre.exec(text);
      if (nm) {
        const before = text.slice(0, nm.index);
        const after = text.slice(nm.index + nm[0].length).replace(/^\n{1,2}/, "");
        return (before ? ayahHtml(before) : "") + noticeHtml(nm[1]) + (after ? ayahHtml(after) : "");
      }
      const tre = /(?:^|\n)::tafsir ([a-z]+)::\n([\s\S]*?)\n::\/tafsir::(?=\n|$)/;
      const tm = tre.exec(text);
      if (tm) {
        const before = text.slice(0, tm.index);
        const after = text.slice(tm.index + tm[0].length).replace(/^\n{1,2}/, "");
        return (before ? ayahHtml(before) : "") + tafsirHtml(tm[1], tm[2]) + (after ? ayahHtml(after) : "");
      }
      const sre = /(?:^|\n)::sug::\n([\s\S]*?)\n::\/sug::(?=\n|$)/;
      const sm = sre.exec(text);
      if (sm) {
        const before = text.slice(0, sm.index);
        const after = text.slice(sm.index + sm[0].length).replace(/^\n{1,2}/, "");
        return (before ? ayahHtml(before) : "") + sugHtml(sm[1]) + (after ? ayahHtml(after) : "");
      }
      const re = /(?:^|\n)::ayah( warn)?(?: [0-9:\-]+)?::\n([\s\S]*?)\n::src::[ \t]*([^\n]*)\n::\/ayah::(?=\n|$)/g;
      let out = "";
      let last = 0;
      let m;
      const plain = function (seg, trimStart, trimEnd) {
        if (trimStart) seg = seg.replace(/^\n{1,2}/, "");
        if (trimEnd) seg = seg.replace(/\n{1,2}$/, "");
        return escapeHtml(seg).replace(/(^|\n)::note::[ \t]*([^\n]*)(?=\n|$)/g, function (all, pre, t) {
          return pre + '<div class="an" dir="auto">' + t + "</div>";
        });
      };
      while ((m = re.exec(text))) {
        out += plain(text.slice(last, m.index), last > 0, true);
        let body = m[2];
        let trHtml = "";
        const ti = body.indexOf("\n::tr::");
        if (ti >= 0) {
          const trPart = body.slice(ti + 1).split("\n");
          body = body.slice(0, ti);
          const label = trPart.shift().replace(/^::tr::[ \t]*/, "");
          trHtml = '<div class="atr" dir="auto"><div class="trl">' + escapeHtml(label) + "</div>" + trPart.map(function (ln) { return '<span class="tl">' + escapeHtml(ln) + "</span>"; }).join("") + "</div>";
        }
        const lines = body.split("\n").map(function (ln) { return '<span class="al">' + escapeHtml(ln) + "</span>"; }).join("");
        let src = escapeHtml(m[3]);
        const at = src.lastIndexOf("Tanzil");
        if (at >= 0) src = src.slice(0, at) + '<a href="https://tanzil.net/" target="_blank" rel="noopener noreferrer">Tanzil</a>' + src.slice(at + 6);
        const qe = src.lastIndexOf("QuranEnc.com");
        if (qe >= 0) src = src.slice(0, qe) + '<a href="https://quranenc.com/en/browse/azeri_musayev" target="_blank" rel="noopener noreferrer">QuranEnc.com</a>' + src.slice(qe + 12);
        out += '<div class="ay' + (m[1] ? " warn" : "") + '"><div class="at" dir="rtl" lang="ar">' + lines + "</div>" + trHtml + '<div class="as" dir="auto">' + src + "</div></div>";
        last = m.index + m[0].length;
      }
      return out + plain(text.slice(last), last > 0, false);
    }
    function fillBubble(el, text) {
      // gizli kontekst sətri (::ctx:: …) «növbəti ayə» üçündür: göstərilmir
      let src = String(text || "").replace(/\n*^::ctx:: [^\n]*$/gm, "");
      // hazır oyun: gizli «::game:: slug | Ad» sətri göstərilmir; kod bloku yoxdursa (serverdən bərpa) «yenidən göstər» düyməsi
      if (src.indexOf("::game::") >= 0) {
        const hasCode = src.indexOf("```") >= 0;
        src = src.replace(/^::game:: ([a-z0-9-]+) \| ([^\n]+)$/gm, function (all, slug, title) {
          return hasCode ? "" : "::sug::\n::sl:: Oyunun kodu serverdə saxlanmır:\n::sb:: Oyunu yenidən göstər | " + title + " oyun kodu yaz\n::/sug::";
        });
      }
      const parts = src.split("```");
      const runs = [];
      chipQ = [];
      el.innerHTML = parts.map(function (part, i) {
        if (i % 2 === 0) return ayahHtml(part);
        const head = part.match(/^([a-zA-Z0-9+#-]+)\n/);
        const code = head ? part.slice(head[0].length) : part;
        const lang = head ? RUN_LANGS[head[1].toLowerCase()] : "";
        let bar = "";
        if (lang && code.trim()) {
          runs.push({ lang: lang, code: code.replace(/\n$/, "") });
          bar = '<div class="bar"><button type="button" class="runbtn" data-run="' + (runs.length - 1) + '" aria-label="Kodu işlət və nəticəyə bax"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Aç</button></div>';
        }
        return '<div class="cb"><pre><code>' + escapeHtml(code) + "</code></pre>" + bar + "</div>";
      }).join("");
      const queries = chipQ;
      el.querySelectorAll("button.chip[data-sq]").forEach(function (b) {
        const q = queries[Number(b.getAttribute("data-sq"))];
        b.removeAttribute("data-sq");
        b.addEventListener("click", function () {
          if (busy || btn.disabled) { note("Cavab gözlənilir"); return; }
          send(q);
        });
      });
      el.querySelectorAll("button.runbtn").forEach(function (b) {
        const r = runs[Number(b.getAttribute("data-run"))];
        b.removeAttribute("data-run");
        let url = "";
        let pending = buildRunUrl(r.lang, r.code).then(function (u) { url = u; return u; }, function () { return ""; });
        b.addEventListener("click", async function () {
          if (!url) {
            b.disabled = true;
            await pending;
            b.disabled = false;
          }
          if (!url || url.length > RUN_MAX) {
            note(url ? "Kod çox böyükdür" : "Kodu açmaq alınmadı");
            return;
          }
          flushNow();
          window.open(url, "_blank", "noopener");
        });
      });
    }
    // Yeni cavab: uzun cavabın BAŞI (balonun üstü) görünür; ekrana tam sığan qısa cavab tam görünür. İstifadəçinin öz mesajı isə həmişə aşağıya çəkilir.
    function revealAnswer(el) {
      if (el.offsetHeight <= msgs.clientHeight) { msgs.scrollTop = msgs.scrollHeight; return; }
      const delta = el.getBoundingClientRect().top - msgs.getBoundingClientRect().top;
      msgs.scrollTop = Math.max(0, msgs.scrollTop + delta - 8);
    }
    function bubble(text, kind, imageUrl, restore) {
      if (hello && hello.parentNode) hello.remove();
      const el = document.createElement("div");
      el.className = "msg " + kind;
      if (kind === "b" && !kind.includes("err")) fillBubble(el, text);
      else el.textContent = text;
      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "shot";
        img.alt = "Nibras AI şəkli";
        img.src = imageUrl;
        el.appendChild(img);
      }
      msgs.appendChild(el);
      if (restore) return el; // söhbət bərpasında renderItem özü sona çəkir
      if (kind.charAt(0) === "b") revealAnswer(el);
      else msgs.scrollTop = msgs.scrollHeight;
      return el;
    }
    async function send(text) {
      const m = (text || "").trim();
      if (!m || btn.disabled) return;
      const useImage = mode === "image" || pendingImage || wantsImage(m);
      const sentMode = useImage ? "image" : mode === "code" ? "code" : mode === "create" ? "create" : "ask";
      inp.value = "";
      busy = true;
      bubble(m, "u");
      const um = rec("u", m, "", useImage ? 1 : 0);
      btn.disabled = true;
      stat("mode", sentMode);
      const wait = document.createElement("div");
      wait.className = "msg b";
      wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      msgs.appendChild(wait);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const r = await fetch(useImage ? "/api/image" : "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(useImage
            ? { prompt: m, image: pendingImage, limitReached: remain() <= 0 }
            : { message: m, messages: threadOf().slice(-8), games: gamesShown(), mode: sentMode, limitReached: remain() <= 0, noticeShown: noticeShown() })
        });
        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (e) {}
        wait.remove();
        const reply = data.reply || data.message || data.error;
        if (!r.ok || data.success === false || (!reply && !data.url)) {
          stat("error", useImage ? "image" : "chat");
          const etext = reply || "Cavab gəlmədi. Bir az sonra yenidən yoxlayın.";
          bubble(etext, "b err");
          if (!useImage) um.x = 1;
          rec("b err", etext, "", 1);
        } else {
          const rtext = reply || (data.url ? "Şəkil hazırdır." : "");
          bubble(rtext, "b", data.url || "");
          rec("b", rtext, data.url || "", useImage ? 1 : 0);
          if (data.usedAI === true) {
            const u = load();
            u.c += 1;
            save(u);
          }
          pendingImage = "";
          const thumb = document.getElementById("thumb");
          thumb.classList.remove("on");
          thumb.removeAttribute("src");
          setMode("chat");
        }
      } catch (e) {
        wait.remove();
        if (!useImage) um.x = 1;
        stat("error", "network");
        bubble("Şəbəkəyə qoşulmaq olmadı.", "b err");
        rec("b err", "Şəbəkəyə qoşulmaq olmadı.", "", 1);
      } finally {
        // Hər halda (uğur, xəta, render istisnası) göndər düyməsi geri açılmalıdır.
        busy = false;
        btn.disabled = false;
        paint();
        inp.focus();
      }
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      send(inp.value);
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () {
        const next = b.getAttribute("data-mode");
        setMode(mode === next ? "chat" : next);
        inp.focus();
      });
    });
    document.getElementById("file").addEventListener("change", function () {
      const file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
        note("PNG və ya JPG seç.");
        return;
      }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const max = 1024;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingImage = canvas.toDataURL("image/jpeg", 0.82);
        const thumb = document.getElementById("thumb");
        thumb.src = pendingImage;
        thumb.classList.add("on");
        setMode("image");
        URL.revokeObjectURL(url);
        inp.focus();
      };
      img.onerror = function () { note("Şəkil açılmadı."); };
      img.src = url;
    });
    document.getElementById("clip").addEventListener("click", function () {
      document.getElementById("file").click();
    });

    // ---- Söhbətlərin saxlanması: dərhal localStorage (24 saat) + Supabase (/api/chats, imkan varsa)
    const CH_KEY = "nibras_chats_v1";
    const DEV_KEY = "nibras_device_v1";
    const KEEP_MS = 24 * 3600 * 1000;
    const TITLE_MAX = 40;
    const SYNC_MAX = 190000;
    let store = { cur: "", items: {} };
    let curItem = null;
    let busy = false;
    let serverOffUntil = 0;
    let syncTimer = 0;
    const dirty = {};
    const remoteList = [];

    function rid() {
      try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
      let s = "";
      for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s;
    }
    function deviceId() {
      let d = "";
      try { d = localStorage.getItem(DEV_KEY) || ""; } catch (e) {}
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(d)) {
        d = rid();
        try { localStorage.setItem(DEV_KEY, d); } catch (e) {}
      }
      return d;
    }
    function prune() {
      const lim = Date.now() - KEEP_MS;
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (!it || !Array.isArray(it.msgs) || !(it.t > lim)) delete store.items[id];
      });
      if (!store.items[store.cur]) store.cur = "";
    }
    function readStore() {
      let o = null;
      try { o = JSON.parse(localStorage.getItem(CH_KEY)); } catch (e) {}
      store = o && typeof o === "object" && o.items && typeof o.items === "object" ? { cur: String(o.cur || ""), items: o.items, pm: o.pm || null } : { cur: "", items: {}, pm: null };
      prune();
    }
    function writeStore() {
      prune();
      for (let tries = 0; tries < 6; tries++) {
        try { localStorage.setItem(CH_KEY, JSON.stringify(store)); return; } catch (e) {
          // yer qurtarıb: ən köhnə (cari olmayan) söhbəti atırıq
          const ids = Object.keys(store.items).filter(function (k) { return k !== store.cur; }).sort(function (a, b) { return store.items[a].t - store.items[b].t; });
          if (!ids.length) return;
          delete store.items[ids[0]];
        }
      }
    }
    function mkTitle(text) {
      const t = String(text || "").replace(/\s+/g, " ").trim();
      const a = Array.from(t);
      return a.length > TITLE_MAX ? a.slice(0, TITLE_MAX).join("").trim() + "…" : t;
    }
    // Bu söhbətdə artıq göstərilmiş hazır oyunlar (slug-lar, ardıcıllıqla): serverə yalnız son 8 mesaj getdiyi üçün ayrıca göndərilir
    function gamesShown() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x || m.k !== "b") return;
        String(m.t).replace(/^::game:: ([a-z0-9-]+) \|/gm, function (all, slug) { out.push(slug); return all; });
      });
      return out.slice(-60);
    }
    function threadOf() {
      const out = [];
      if (curItem) curItem.msgs.forEach(function (m) {
        if (m.x) return;
        if (m.k === "u") out.push({ role: "user", text: m.t });
        else if (m.k === "b") out.push({ role: "assistant", text: m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t }); // oyun kodu (40-90KB) hər sorğuda göndərilmir; yalnız gizli işarə qalır
      });
      return out;
    }
    // Hər dəyişiklikdə çağırılır: yerli yaddaşa yazır, serverə planlayır
    // Bu söhbətdə dini cavab bildirişi artıq göstərilibmi? (saxlanan tarixçədən; yeni söhbətdə false; yenidən yükləmədən sonra da işləyir)
    function noticeShown() {
      return !!curItem && curItem.msgs.some(function (m) {
        return m.k === "b" && !m.x && (String(m.t).indexOf("::notice::") >= 0 || String(m.t).indexOf("süni intellektdən din öyrənilməz") >= 0);
      });
    }
    function rec(k, t, i, x) {
      if (!curItem) {
        const id = rid();
        curItem = { id: id, title: mkTitle(t), mode: mode, msgs: [], t: Date.now() };
        store.items[id] = curItem;
        store.cur = id;
      }
      const m = { k: k, t: String(t) };
      if (i && /^https?:\/\//i.test(i) && i.length <= 2000) m.i = i;
      if (x) m.x = 1;
      curItem.msgs.push(m);
      curItem.mode = mode;
      curItem.t = Date.now();
      store.cur = curItem.id;
      writeStore();
      schedule(curItem.id);
      return m;
    }
    function serverOk() { return Date.now() >= serverOffUntil; }
    function schedule(id) {
      if (!serverOk()) return;
      dirty[id] = 1;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(flushNow, 800);
    }
    function apiHeaders(json) {
      const h = { "x-device-id": deviceId() };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }
    function noteReply(r) {
      return r.json().then(function (d) {
        if (!d || d.storage === false || d.ok === false && r.status >= 500) serverOffUntil = Date.now() + 5 * 60 * 1000;
        return d;
      });
    }
    function fitForServer(msgs) {
      const out = msgs.map(function (m) {
        const c = { k: m.k, t: (m.k === "b" && m.t.indexOf("::game::") >= 0 ? m.t.replace(/```[\s\S]*?```/, "") : m.t).slice(0, 20000) }; // serverdə mesaj limiti 20000: oyun kodu saxlanmır, işarə qalır
        if (m.i) c.i = m.i;
        if (m.x) c.x = 1;
        return c;
      }).slice(-200);
      while (out.length > 1 && JSON.stringify(out).length > SYNC_MAX) out.shift();
      return out;
    }
    function flushNow() {
      clearTimeout(syncTimer);
      const ids = Object.keys(dirty);
      ids.forEach(function (id) { delete dirty[id]; });
      if (!serverOk()) return;
      ids.forEach(function (id) {
        const it = store.items[id];
        if (!it || !it.msgs.length) return;
        const body = JSON.stringify({ title: it.title, messages: fitForServer(it.msgs) });
        try {
          fetch("/api/chats?id=" + encodeURIComponent(id), { method: "PUT", headers: apiHeaders(true), body: body, keepalive: body.length < 60000 })
            .then(noteReply).catch(function () {});
        } catch (e) {}
      });
    }
    function renderItem(it) {
      msgs.innerHTML = "";
      if (!it || !it.msgs.length) {
        msgs.appendChild(hello);
        return;
      }
      it.msgs.forEach(function (m) { bubble(m.t, m.k, m.i || "", true); });
      msgs.scrollTop = msgs.scrollHeight;
    }
    function restoreCurrent() {
      readStore();
      writeStore();
      const it = store.items[store.cur];
      if (!it) {
        curItem = null;
        const pm = store.pm;
        if (pm && pm.t > Date.now() - KEEP_MS && (pm.m === "ask" || pm.m === "code" || pm.m === "create")) {
          restoring = true;
          setMode(pm.m);
          restoring = false;
        }
        return;
      }
      curItem = it;
      renderItem(it);
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" ? it.mode : "chat");
      restoring = false;
    }

    // ---- Söhbətlər paneli
    const drawer = document.getElementById("drawer");
    const scrim = document.getElementById("scrim");
    const dlist = document.getElementById("dlist");
    const menuBtn = document.getElementById("menu");
    function ago(t) {
      const m = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (m < 1) return "indi";
      if (m < 60) return m + " dəq əvvəl";
      return Math.round(m / 60) + " saat əvvəl";
    }
    function listEntries() {
      const lim = Date.now() - KEEP_MS;
      const map = {};
      remoteList.forEach(function (r) { const t = Date.parse(r.updated_at); if (t > lim) map[r.id] = { id: r.id, title: r.title, t: t }; });
      Object.keys(store.items).forEach(function (id) {
        const it = store.items[id];
        if (it.t > lim) map[id] = { id: id, title: it.title, t: it.t };
      });
      return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.t - a.t; });
    }
    function renderList() {
      const rows = listEntries();
      dlist.innerHTML = "";
      if (!rows.length) {
        const p = document.createElement("p");
        p.className = "dempty";
        p.textContent = "Hələ söhbət yoxdur";
        dlist.appendChild(p);
        return;
      }
      rows.forEach(function (r) {
        const row = document.createElement("div");
        row.className = "ditem" + (curItem && curItem.id === r.id ? " cur" : "");
        row.setAttribute("data-id", r.id);
        const open = document.createElement("button");
        open.type = "button";
        open.className = "dopen";
        const t = document.createElement("span");
        t.textContent = r.title || "Söhbət";
        const sm = document.createElement("small");
        sm.textContent = ago(r.t);
        open.appendChild(t);
        open.appendChild(sm);
        open.addEventListener("click", function () { openChat(r.id); });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "ddel";
        del.setAttribute("aria-label", "Söhbəti sil");
        del.textContent = "×";
        let armed = 0;
        del.addEventListener("click", function () {
          if (!del.classList.contains("sure")) {
            del.classList.add("sure");
            del.textContent = "Sil?";
            clearTimeout(armed);
            armed = setTimeout(function () { del.classList.remove("sure"); del.textContent = "×"; }, 3000);
            return;
          }
          deleteChat(r.id);
        });
        row.appendChild(open);
        row.appendChild(del);
        dlist.appendChild(row);
      });
    }
    function refreshRemote() {
      if (!serverOk()) return Promise.resolve();
      return fetch("/api/chats", { headers: apiHeaders(false) }).then(noteReply).then(function (d) {
        if (d && d.ok && d.storage && Array.isArray(d.chats)) {
          remoteList.length = 0;
          d.chats.forEach(function (c) { if (c && typeof c.id === "string") remoteList.push(c); });
          renderList();
        }
      }).catch(function () {});
    }
    // Menyu düyməsinin adı (ekran oxuyucu üçün): səhifə dili / brauzer dili — az, tr, en, ru, ar
    const MENU_LABELS = { az: "Söhbətlər", tr: "Sohbetler", en: "Chats", ru: "Чаты", ar: "المحادثات" };
    const CLOSE_LABELS = { az: "Bağla", tr: "Kapat", en: "Close", ru: "Закрыть", ar: "إغلاق" };
    function uiLang() {
      const cand = [document.documentElement.getAttribute("lang"), navigator.language, (navigator.languages || [])[0]];
      for (let i = 0; i < cand.length; i++) {
        const c = String(cand[i] || "").toLowerCase().slice(0, 2);
        if (MENU_LABELS[c]) return c;
      }
      return "az";
    }
    (function () {
      const l = uiLang();
      menuBtn.setAttribute("aria-label", MENU_LABELS[l]);
      menuBtn.setAttribute("title", MENU_LABELS[l]);
      drawer.setAttribute("aria-label", MENU_LABELS[l]);
      document.getElementById("dclose").setAttribute("aria-label", CLOSE_LABELS[l]);
    })();
    function setDrawer(on) {
      const was = drawer.classList.contains("on");
      drawer.classList.toggle("on", on);
      scrim.classList.toggle("on", on);
      drawer.setAttribute("aria-hidden", on ? "false" : "true");
      menuBtn.setAttribute("aria-expanded", on ? "true" : "false");
      if (on) {
        prune();
        renderList();
        refreshRemote();
        if (!was) { try { document.getElementById("dclose").focus(); } catch (e) {} }
      } else if (was && drawer.contains(document.activeElement)) {
        try { menuBtn.focus(); } catch (e) {} // klaviatura fokusu menyu düyməsinə qayıdır
      }
    }
    function resetView() {
      restoring = true;
      setMode("chat");
      restoring = false;
      pendingImage = "";
      const thumb = document.getElementById("thumb");
      thumb.classList.remove("on");
      thumb.removeAttribute("src");
      inp.value = "";
    }
    function newChat() {
      if (busy) { note("Cavab gözlənilir"); return; }
      flushNow();
      curItem = null;
      store.cur = "";
      store.pm = null;
      writeStore();
      renderItem(null);
      resetView();
      setDrawer(false);
    }
    async function openChat(id) {
      if (busy) { note("Cavab gözlənilir"); return; }
      flushNow();
      let it = store.items[id];
      if (!it) {
        try {
          const r = await fetch("/api/chats?id=" + encodeURIComponent(id), { headers: apiHeaders(false) });
          const d = await r.json();
          const c = d && d.ok && d.chat;
          if (!c || !Array.isArray(c.messages)) { note("Söhbət tapılmadı"); return; }
          it = { id: id, title: c.title || "Söhbət", mode: "chat", msgs: c.messages, t: Date.parse(c.updated_at) || Date.now() };
          store.items[id] = it;
        } catch (e) { note("Söhbət açılmadı"); return; }
      }
      curItem = it;
      store.cur = id;
      writeStore();
      renderItem(it);
      resetView();
      restoring = true;
      setMode(it.mode === "ask" || it.mode === "code" || it.mode === "create" ? it.mode : "chat");
      restoring = false;
      setDrawer(false);
    }
    function deleteChat(id) {
      if (busy && curItem && curItem.id === id) { note("Cavab gözlənilir"); return; }
      delete store.items[id];
      delete dirty[id];
      for (let i = remoteList.length - 1; i >= 0; i--) if (remoteList[i].id === id) remoteList.splice(i, 1);
      if (curItem && curItem.id === id) {
        curItem = null;
        store.cur = "";
        renderItem(null);
        resetView();
      }
      writeStore();
      renderList();
      if (serverOk()) {
        try { fetch("/api/chats?id=" + encodeURIComponent(id), { method: "DELETE", headers: apiHeaders(false) }).then(noteReply).catch(function () {}); } catch (e) {}
      }
      note("Söhbət silindi");
    }
    menuBtn.addEventListener("click", function () { setDrawer(!drawer.classList.contains("on")); });
    document.getElementById("dclose").addEventListener("click", function () { setDrawer(false); });
    scrim.addEventListener("click", function () { setDrawer(false); });
    document.getElementById("newchat").addEventListener("click", newChat);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setDrawer(false); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushNow(); });
    window.addEventListener("pagehide", flushNow);
    window.nibrasChats = { open: openChat, newChat: newChat, remove: deleteChat, flush: flushNow };
    restoreCurrent();
    paint();
  </script>
</body>
</html>
