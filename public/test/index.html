<!doctype html>
<html lang="az" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nibras</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--soft:#f6f7f8;--card:#ffffff;--line:#e6e8eb;--text:#16181c;--mute:#6b7280;--accent:#0f9d6b;--accent-soft:#e7f6f0;--gold:#a87b14;--user:#f1f3f5;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--soft:#17191c;--card:#16181b;--line:#26292e;--text:#ececec;--mute:#9aa0a6;--accent:#34c38f;--accent-soft:#16302a;--gold:#e0b956;--user:#23262b;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme=light]{--bg:#ffffff;--soft:#f6f7f8;--card:#ffffff;--line:#e6e8eb;--text:#16181c;--mute:#6b7280;--accent:#0f9d6b;--accent-soft:#e7f6f0;--gold:#a87b14;--user:#f1f3f5;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
:root[data-theme=dark]{--bg:#0f1012;--soft:#17191c;--card:#16181b;--line:#26292e;--text:#ececec;--mute:#9aa0a6;--accent:#34c38f;--accent-soft:#16302a;--gold:#e0b956;--user:#23262b;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;font:700 16px Amiri,serif;color:#fff}
header h1{font-size:15px;font-weight:600;margin:0}.sp{flex:1}
.hbtn,select{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;cursor:pointer}
main{flex:1;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;padding:8px 16px 24px}
.hero{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0}
.hero .b{font:400 22px Amiri,serif;color:var(--gold);margin-bottom:6px}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em}.hero p{color:var(--mute);margin:0;max-width:520px;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:22px;width:100%}
.chip{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 14px;cursor:pointer;font:17px Amiri,"Noto Naskh Arabic",serif;direction:rtl;text-align:right;transition:.15s}.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.msg{margin:18px 0;display:flex;animation:in .25s ease}.msg.user{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.bubble{max-width:80%;padding:9px 15px;border-radius:20px;background:var(--user);font:18px/1.7 Amiri,"Noto Naskh Arabic",serif;unicode-bidi:plaintext}
.bot{gap:10px}.bot .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px Amiri,serif;margin-top:2px}
.bot .bubble{max-width:100%;flex:1;min-width:0;background:transparent;padding:0;font:inherit}
.intro{color:var(--mute);margin:2px 0 10px;font-size:14px}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:8px;direction:rtl}
.card .t{font-weight:600;color:var(--text);font-size:14px;font-family:"Noto Naskh Arabic",Amiri,serif}
.tag{font-size:11.5px;border-radius:99px;padding:1px 9px;background:var(--accent-soft);color:var(--accent)}.tag.g{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.ar{font:400 19px/2.05 Amiri,"Noto Naskh Arabic",serif;direction:rtl;text-align:right;white-space:pre-wrap;word-wrap:break-word}
.ar.clamp{max-height:8em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent)}
.info{font-size:13px;color:var(--mute);direction:rtl;text-align:right;margin-top:8px;display:grid;gap:2px;font-family:"Noto Naskh Arabic",serif}.info b{color:var(--text);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:99px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:var(--soft)}.btn.p{background:var(--text);color:var(--bg);border-color:var(--text)}.btn:disabled{opacity:.45;cursor:default}
.full{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}.err{color:#d9534f}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots span{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
footer{position:sticky;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
.composer{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:8px 8px 8px 14px;transition:border-color .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
textarea{width:100%;resize:none;background:transparent;border:0;color:var(--text);font:18px/1.6 Amiri,"Noto Naskh Arabic",serif;padding:6px 6px 2px;min-height:34px;max-height:160px;outline:none}
textarea::placeholder{color:var(--mute)}
.crow{display:flex;align-items:center;gap:6px}
.pills{display:flex;gap:4px;flex-wrap:wrap;direction:rtl}
.pill{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:4px 11px;font:13px "Noto Naskh Arabic",Amiri,serif;cursor:pointer;white-space:nowrap;transition:.15s}
.pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.send{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s}.send:disabled{opacity:.3}
.hint{max-width:760px;margin:6px auto 0;font-size:12.5px;color:#d9534f;text-align:center;min-height:0}
.disc{max-width:760px;margin:6px auto 0;font-size:11px;color:var(--mute);text-align:center}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;padding:12px;backdrop-filter:blur(3px)}
.viewer.on{display:flex;align-items:center;justify-content:center}
.vbox{background:var(--card);border:1px solid var(--line);border-radius:18px;width:min(800px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.vhead{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.vhead .t{flex:1;font:600 15px "Noto Naskh Arabic",serif;direction:rtl;text-align:right}
.vbody{overflow:auto;padding:18px}.vfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
@media (max-width:560px){.hero h2{font-size:21px}.chips{grid-template-columns:1fr}.bubble{max-width:88%}.pill{font-size:12px;padding:4px 9px}}
</style>
</head>
<body>
<header>
  <div class="logo">ن</div><h1 data-i="title"></h1><span class="sp"></span>
  <button class="hbtn" id="theme" type="button" aria-label="" title="">◐</button>
  <select id="lang"><option value="az">AZ</option><option value="en">EN</option><option value="tr">TR</option><option value="ru">RU</option><option value="ar">AR</option></select>

<main id="main"><div class="wrap" id="chat">

    <div class="chips" id="chips"></div>
  </div>
</div></main>
<footer>
  <form class="composer" id="f">
    <textarea id="q" rows="1" maxlength="300" dir="rtl" lang="ar" placeholder="اكتب سؤالك بالعربية…"></textarea>
    <div class="crow">
      <div class="pills" role="radiogroup">
        <button class="pill on" data-m="fatwa" type="button" role="radio" data-i="p1">فتاوى ابن باز وابن عثيمين</button>
        <button class="pill" data-m="library" type="button" role="radio" data-i="p2">الشاملة + الدرر</button>
      </div><span class="sp"></span>
      <button class="send" id="send" aria-label="">↑</button>
    </div>
  </form>
  <div class="hint" id="hint" role="alert"></div>
  <div class="disc" data-i="disc"></div>
</footer>
<div class="viewer" id="viewer"><div class="vbox">
  <div class="vhead"><button class="btn" id="vclose">✕</button><a class="btn" id="vlink" target="_blank" rel="noopener"></a><span class="t" id="vt"></span></div>
  <div class="vbody"><div class="ar" id="vtext"></div></div>
  <div class="vfoot"><button class="btn" id="vprev"></button><span class="note" id="vlabel"></span><button class="btn" id="vnext"></button></div>
</div></div>

let lang=(new URLSearchParams(location.search).get("lang")||localStorage.getItem("nt-lang")||"az");if(!I[lang])lang="az";

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("#lang").value=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));document.title=T("docTitle");
 $("#theme").title=$("#theme").ariaLabel=T("themeT");$("#lang").title=$("#lang").ariaLabel=T("langL");$("#send").ariaLabel=T("send");$(".pills").ariaLabel=T("modeL");$("#vclose").ariaLabel=$("#vclose").title=T("closeL");
 $("#q").placeholder=T("ph");$("#vlink").textContent=T("src")+" ↗";[...$("#lang").options].forEach((o,i)=>o.textContent=T("langNames")[i]);
 const c=$("#chips");if(c){c.innerHTML="";T("chips").forEach(x=>{const b=el("button","chip",x);b.type="button";b.onclick=()=>ask(x);c.appendChild(b)})}
 $("#vprev").textContent=T("prev");$("#vnext").textContent=T("next")}

const hasAr=t=>/[\u0600-\u06ff]/.test(t);
// Fətva: sualı at, yalnız cavabı göstər
function answerOnly(t){const m=/(?:^|\n|\s)(?:ج\s*[:：]|الجواب\s*[:：]?|فأجاب(?:\s+(?:فضيلته|سماحته|رحمه الله(?: تعالى)?|الشيخ))*\s*(?:بقوله)?\s*[:：]?)/.exec(t);if(!m)return {text:t,found:false};return {text:t.slice(m.index+m[0].length).replace(/^[\s:：-]+/,"").trim(),found:true}}
const akey=v=>v.replace(/[\u064b-\u065f\u0670\u0640]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
function score(it,q){const t=akey(it.text),ws=akey(q).split(/\s+/).filter(w=>w.length>1);let s=0;ws.forEach(w=>{const n=t.split(w).length-1;s+=n?2+Math.min(n,5):0});if(t.includes(akey(q)))s+=10;return s}
async function api(body){const r=await fetch("/api/religious-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(r.status===429)throw new Error("rate");if(r.status===400){const j=await r.json().catch(()=>({}));if(j.error==="arabic_only")throw new Error("arOnly")}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"err");return j}
function scrollTo(e){requestAnimationFrame(()=>e.scrollIntoView({behavior:"smooth",block:"start"}))}
function addUser(q){$("#hero")?.remove();const m=el("div","msg user");m.appendChild(el("div","bubble",q));chat.appendChild(m)}
function addBot(){const m=el("div","msg bot"),b=el("div","bubble");m.appendChild(el("div","av","ن"));m.appendChild(b);chat.appendChild(m);const d=el("div","dots");d.innerHTML="<span></span><span></span><span></span>";d.setAttribute("role","status");d.setAttribute("aria-label",T("loading"));d.title=T("loading");b.appendChild(d);scrollTo(m);return b}
function excerpt(t,q,max=320){const parts=t.split(/(?<=[.؟!:])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>8);if(!parts.length)return t.slice(0,max);
 let bi=0,bs=-1;parts.forEach((p,i)=>{const sc=score({text:p},q)-i*0.05;if(sc>bs){bs=sc;bi=i}});if(bs<=0)bi=0;let out=parts[bi];for(let i=bi+1;i<parts.length&&out.length+parts[i].length<max;i++)out+=" "+parts[i];
 return out.length>max+80?out.slice(0,max).replace(/\s+\S*$/,"")+" …":out}
function fatwaCard(it,main,q){const c=el("div","card"),a0=answerOnly(it.text);
 const short=main?excerpt(a0.text,q):a0.text;const tx=el("div","ar",short);c.appendChild(tx);if(!main&&a0.text.length>350)tx.classList.add("clamp");
 if(main&&short!==a0.text){const m=el("button","btn p",T("cont"));m.style.marginTop="8px";m.onclick=()=>{tx.textContent=a0.text;m.remove()};c.appendChild(m)}
 const meta=el("div","meta");meta.style.marginTop="10px";meta.style.marginBottom="0";meta.appendChild(el("span","tag g",it.author));meta.appendChild(el("span",null,T("book")+": "+it.title+(it.label?" · "+T("volPage")+": "+it.label:"")));c.appendChild(meta);
 const a=el("div","acts");if(!main&&a0.text.length>350){const m=el("button","btn",T("cont"));m.onclick=()=>{tx.classList.remove("clamp");m.remove()};a.appendChild(m)}
 const p=el("button","btn",T("page"));p.onclick=()=>openViewer(it.bookId,it.pageId);a.appendChild(p);const l=el("a","btn",T("src")+" ↗");l.href=it.url;l.target="_blank";l.rel="noopener";a.appendChild(l);c.appendChild(a);return c}
function shamelaCard(it,fatwa){if(fatwa)return fatwaCard(it,false,"");const c=el("div","card"),meta=el("div","meta");
 meta.appendChild(el("span","t",it.title));if(it.author)meta.appendChild(el("span","tag"+(fatwa?" g":""),it.author));if(it.label)meta.appendChild(el("span",null,T("volPage")+": "+it.label));c.appendChild(meta);
 const tx=el("div","ar",it.text);c.appendChild(tx);if(it.text.length>350)tx.classList.add("clamp");
 const a=el("div","acts");
 if(it.text.length>350){const m=el("button","btn",T("cont"));m.onclick=()=>{tx.classList.remove("clamp");m.remove()};a.appendChild(m)}
 const p=el("button","btn",T("page"));p.onclick=()=>openViewer(it.bookId,it.pageId);a.appendChild(p);
 const l=el("a","btn",T("src")+" ↗");l.href=it.url;l.target="_blank";l.rel="noopener";a.appendChild(l);c.appendChild(a);return c}
function dorarCard(it,query){const c=el("div","card"),meta=el("div","meta");
 if(it.grading)meta.appendChild(el("span","tag g",it.grading));if(it.source)meta.appendChild(el("span","t",it.source));c.appendChild(meta);
 c.appendChild(el("div","ar",it.text));const info=el("div","info");
 [[T("narrator"),it.narrator],[T("muhaddith"),it.muhaddith],[T("source"),it.source],[T("pageNo"),it.page]].forEach(([k,v])=>{if(!v)return;const d=el("div");d.appendChild(el("b",null,k+": "));d.appendChild(document.createTextNode(v));info.appendChild(d)});c.appendChild(info);
 const a=el("div","acts"),b=el("button","btn p",T("cont"));b.onclick=async()=>{b.disabled=true;const box=el("div","full");box.appendChild(el("div","dots")).innerHTML="<span></span><span></span><span></span>";c.appendChild(box);
  try{const r=await api({action:"hadith",query,text:it.text,source:it.source,muhaddith:it.muhaddith,page:it.page});box.innerHTML="";
   box.appendChild(el("div","note",r.status==="full"?T("fullOk"):r.status==="fragment"?T("frag"):T("origin")+(r.sourceTitle?" — "+r.sourceTitle:"")));
   box.appendChild(el("div","ar",r.text));if(r.takhrij){const t=el("div","info");t.appendChild(el("div",null,T("takhrij")+": "+r.takhrij));box.appendChild(t)}
   if(r.url){const l=el("a","btn",T("src")+" ↗");l.href=r.url;l.target="_blank";l.rel="noopener";const w=el("div","acts");w.appendChild(l);box.appendChild(w)}b.remove()}
  catch(e){box.innerHTML="";box.appendChild(el("div","note err",T(e.message==="rate"?"rate":e.message==="arOnly"?"arOnly":"err")));b.disabled=false}};
 a.appendChild(b);const l=el("a","btn",T("drSec")+" ↗");l.href="https://dorar.net/hadith/search?q="+encodeURIComponent(query);l.target="_blank";l.rel="noopener";a.appendChild(l);c.appendChild(a);return c}
function revealGroup(list,items,make,step){let shown=0;const more=el("button","btn",T("more"));const w=el("div","acts");w.appendChild(more);
 const show=()=>{const first=list.children.length;items.slice(shown,shown+step).forEach(i=>list.appendChild(make(i)));shown+=step;if(shown>=items.length)w.remove();return list.children[first]};
 more.onclick=()=>{const f=show();if(f)scrollTo(f)};show();return w}
async function shamelaBlock(b,q,fatwa){const r=await api({action:fatwa?"fatwa":"shamela",query:q});
 b.appendChild(el("p","intro",T(fatwa?"fatIntro":"shIntro")(r.original||q,r.items.length,"")));
 const list=el("div");
 if(fatwa&&r.items.length){const sorted=[...r.items].sort((x,y)=>score(y,q)-score(x,q));b.appendChild(el("div","sec",T("ans")));b.appendChild(fatwaCard(sorted[0],true,q));if(sorted.length>1)b.appendChild(el("div","sec",T("others")));b.appendChild(list);sorted.slice(1).forEach(i=>list.appendChild(fatwaCard(i,false,q)))}
 else{if(!fatwa&&r.items.length){const best=[...r.items].sort((x,y)=>score(y,q)-score(x,q))[0];const c=el("div","card");c.appendChild(el("div","ar",excerpt(best.text,q)));const m=el("div","meta");m.style.margin="8px 0 0";m.appendChild(el("span","tag",best.author||""));m.appendChild(el("span",null,T("book")+": "+best.title+(best.label?" · "+T("volPage")+": "+best.label:"")));c.appendChild(m);b.appendChild(el("div","sec",T("brief")));b.appendChild(c)}
  if(!fatwa)b.appendChild(el("div","sec",T("shSec")));b.appendChild(list);r.items.forEach(i=>list.appendChild(shamelaCard(i,fatwa)))}
 if(r.hasMore){let state={cursor:r.cursor,seen:r.seen};const w=el("div","acts"),m=el("button","btn",T("more"));w.appendChild(m);b.appendChild(w);
  m.onclick=async()=>{m.disabled=true;try{const n=await api({action:fatwa?"fatwa":"shamela",query:r.query,cursor:state.cursor,seen:state.seen});const first=list.children.length;
   n.items.forEach(i=>list.appendChild(shamelaCard(i,fatwa)));state={cursor:n.cursor,seen:n.seen};if(list.children[first])scrollTo(list.children[first]);if(!n.hasMore||!n.items.length)w.remove();else m.disabled=false}catch(e){m.disabled=false}}}}
async function dorarBlock(b,q){const r=await api({action:"dorar",query:q});
 if(r.error){b.appendChild(el("p","intro err",T("drErr")));return}
 b.appendChild(el("div","sec",T("drSec")));b.appendChild(el("p","intro",T("drIntro")(r.items.length)));const list=el("div");b.appendChild(list);

async function ask(q){q=(q||"").trim();if(!q||busy)return;
 if(!hasAr(q)){$("#hint").textContent=T("arOnly");return}$("#hint").textContent="";busy=true;addUser(q);const b=addBot();
 try{if(mode==="fatwa"){await shamelaBlock(b,q,true)}else{const sh=el("div"),dr=el("div");
   const p1=shamelaBlock(sh,q,false).catch(e=>sh.appendChild(el("p","intro err",T(e.message==="rate"?"rate":e.message==="arOnly"?"arOnly":"err"))));
   const p2=dorarBlock(dr,q).catch(e=>dr.appendChild(el("p","intro err",T(e.message==="rate"?"rate":"drErr"))));
   await Promise.all([p1,p2]);b.appendChild(sh);b.appendChild(dr)}}
 catch(e){b.appendChild(el("p","intro err",T(e.message==="rate"?"rate":e.message==="arOnly"?"arOnly":"err")))}
 finally{b.querySelector(".dots")?.remove();busy=false;scrollTo(b.parentElement)}}
let vcur=null;async function openViewer(book,page){const v=$("#viewer");v.classList.add("on");$("#vtext").textContent="";$("#vt").textContent="…";$("#vlabel").textContent="";
 $("#vprev").disabled=$("#vnext").disabled=true;const d=el("div","dots");d.innerHTML="<span></span><span></span><span></span>";$("#vtext").appendChild(d);
 try{const r=await api({action:"open",bookId:book,pageId:page});vcur=r;$("#vt").textContent=r.title;$("#vlabel").textContent=r.label?T("volPage")+": "+r.label:"";$("#vtext").textContent=r.text+(r.truncated?"\n\n— "+T("trunc"):"");
