<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nibras AI</title>
  <meta name="description" content="Nibras AI — Nibras Code köməkçisi." />
  <link rel="icon" href="/nibras-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    @property --nx-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes nx-edge { to { --nx-angle: 360deg; } }
    @keyframes blink { 50% { opacity: .25; } }

    :root {
      --ink: #05060c;
      --fg: #f4f5fb;
      --muted: #9aa1b8;
      --faint: #6d748c;
      --ice: #9aebff;
      --line: rgba(255,255,255,.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--fg);
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(520px 280px at 50% 0%, rgba(109,132,255,.2), transparent 70%),
        #05060c;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .frame {
      position: relative;
      isolation: isolate;
      width: min(520px, 100%);
      height: min(680px, calc(100dvh - 32px));
      border-radius: 28px;
    }
    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(
        from var(--nx-angle),
        transparent 0deg,
        rgba(126,231,255,.12) 40deg,
        #7ee7ff 78deg,
        #c9a6ff 118deg,
        #ffd27a 152deg,
        #ff8eb8 184deg,
        transparent 230deg,
        transparent 360deg
      );
      animation: nx-edge 5.5s linear infinite;
    }
    .frame::before {
      inset: 0;
      z-index: 3;
      padding: 1.5px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .frame::after {
      inset: -14px;
      z-index: 0;
      opacity: .72;
      filter: blur(16px);
    }
    .panel {
      position: absolute;
      inset: 2px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(18,22,38,.96), rgba(8,10,18,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      overflow: hidden;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img {
      width: 34px; height: 34px; border-radius: 10px; object-fit: cover;
      outline: 1px solid rgba(255,255,255,.12);
    }
    .brand b {
      display: block;
      font-family: Syne, sans-serif;
      font-size: 15px;
      letter-spacing: -0.04em;
    }
    .brand small { display: block; color: var(--muted); font-size: 12px; }
    .meta { display: flex; align-items: center; gap: 8px; }
    .pill, .home {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill em { font-style: normal; color: var(--ice); }
    #msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 14px;
    }
    .hello { margin: auto 0 8px; width: 100%; }
    .hello h1 {
      margin: 0 0 6px;
      font-family: Syne, sans-serif;
      font-size: 32px;
      letter-spacing: -0.05em;
    }
    .hello p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; font-size: 15px; }
    .chips { display: flex; flex-direction: column; gap: 8px; }
    .chips button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--fg);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .chips button:hover { border-color: rgba(154,235,255,.4); }
    .msg {
      max-width: 84%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .u {
      margin-left: auto;
      background: linear-gradient(180deg, #8b9bff, #6d7ff0);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .b {
      margin-right: auto;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }
    .err { border-color: rgba(255,120,140,.35); color: #ffd0d6; }
    .dots { display: inline-flex; gap: 5px; padding: 2px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--ice);
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    .dock { padding: 12px 12px 14px; border-top: 1px solid var(--line); }
    form {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 6px 6px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(5,6,12,.65);
    }
    input {
      flex: 1; min-width: 0; border: 0; outline: none;
      background: transparent; color: var(--fg);
      font: inherit; font-size: 15px; padding: 8px 0;
    }
    input::placeholder { color: var(--faint); }
    button.send {
      border: 0; border-radius: 12px; padding: 10px 14px;
      font: inherit; font-weight: 700; color: #071018;
      background: linear-gradient(180deg, #d7f7ff, #b7c4ff);
      cursor: pointer;
    }
    button.send:disabled { opacity: .4; cursor: not-allowed; }
    #warn { display: none; margin: 8px 2px 0; text-align: center; color: #ffb4c0; font-size: 12px; }
    #warn.on { display: block; }
    @media (max-width: 640px) {
      body { padding: 10px; }
      .frame { height: calc(100dvh - 20px); border-radius: 22px; }
      .panel { border-radius: 20px; }
      .hello h1 { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame::before, .frame::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <section class="panel">
      <header class="top">
        <a class="brand" href="/">
          <img src="/nibras-icon.png" alt="" />
          <span><b>Nibras AI</b><small>Nibras Code</small></span>
        </a>
        <div class="meta">
          <span class="pill" id="left"><em>10</em>/10</span>
          <a class="home" href="/">Sayt</a>
        </div>
      </header>
      <div id="msgs">
        <div class="hello" id="hello">
          <h1>Salam.</h1>
          <p>Bu gün nə haqqında danışaq?</p>
          <div class="chips">
            <button type="button" data-q="Bir mövzunu sadə dildə izah et.">Bir mövzunu sadə izah et</button>
            <button type="button" data-q="Qısa və səliqəli bir mətn yaz.">Qısa mətn yaz</button>
            <button type="button" data-q="Bu fikri yoxla və daha yaxşısını təklif et.">Fikri yoxla</button>
          </div>
        </div>
      </div>
      <div class="dock">
        <form id="form">
          <input id="inp" type="text" maxlength="800" placeholder="Nə soruşmaq istəyirsən?" autocomplete="off" />
          <button class="send" id="btn" type="submit">Göndər</button>
        </form>
        <p id="warn">Gündəlik 10 sual limiti doldu. Sabah yenidən yoxlayın.</p>
      </div>
    </section>
  </div>
  <script>
    const LIMIT = 10;
    const KEY = "nibras_ai_v2";
    const msgs = document.getElementById("msgs");
    const hello = document.getElementById("hello");
    const form = document.getElementById("form");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const warn = document.getElementById("warn");
    const left = document.getElementById("left");
    const today = new Date().toISOString().slice(0, 10);
    const thread = [];

    function load() {
      let u = { d: today, c: 0 };
      try { u = JSON.parse(localStorage.getItem(KEY)) || u; } catch (e) {}
      if (!u || u.d !== today) u = { d: today, c: 0 };
      return u;
    }
    function save(u) { localStorage.setItem(KEY, JSON.stringify(u)); }
    function remain() { return Math.max(0, LIMIT - load().c); }
    function paint() {
      const n = remain();
      left.innerHTML = "<em>" + n + "</em>/" + LIMIT;
      const full = n === 0;
      inp.disabled = full;
      btn.disabled = full;
      warn.classList.toggle("on", full);
      inp.placeholder = full ? "Limit doldu" : "Nə soruşmaq istəyirsən?";
    }
    function bubble(text, kind) {
      if (hello && hello.parentNode) hello.remove();
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }
    async function send(text) {
      const m = (text || "").trim();
      if (!m || remain() <= 0) return;
      inp.value = "";
      bubble(m, "u");
      thread.push({ role: "user", text: m });
      btn.disabled = true;
      const wait = document.createElement("div");
      wait.className = "msg b";
      wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      msgs.appendChild(wait);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: m, messages: thread.slice(-8) })
        });
        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (e) {}
        wait.remove();
        const reply = data.reply || data.message || data.error;
        if (!r.ok || data.success === false || !reply) {
          bubble(reply || "Cavab gəlmədi. Bir az sonra yenidən yoxlayın.", "b err");
          thread.pop();
        } else {
          bubble(reply, "b");
          thread.push({ role: "assistant", text: reply });
          const u = load();
          u.c += 1;
          save(u);
        }
      } catch (e) {
        wait.remove();
        thread.pop();
        bubble("Şəbəkəyə qoşulmaq olmadı.", "b err");
      }
      paint();
      if (remain() > 0) inp.focus();
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      send(inp.value);
    });
    document.querySelectorAll("[data-q]").forEach(function (b) {
      b.addEventListener("click", function () { send(b.getAttribute("data-q")); });
    });
    paint();
  </script>
</body>
</html>
