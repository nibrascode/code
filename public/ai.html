<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nibras AI</title>
  <meta name="description" content="Nibras AI — Nibras Code köməkçisi. Sual ver, düzəlt, həll et." />
  <link rel="icon" href="/nibras-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @property --nx-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes nx-edge { to { --nx-angle: 360deg; } }
    @keyframes blink { 50% { opacity: .25; } }
    :root {
      --ink: #04060f;
      --fg: #f4f7ff;
      --muted: #9aa3bd;
      --line: rgba(130, 170, 255, .28);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--fg);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      background: #03040c;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    .glow, .glow svg { position: fixed; inset: 0; pointer-events: none; }
    .glow svg { width: 100%; height: 100%; }
    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 38px; height: 34px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(80,140,255,.55)); }
    .brand b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .meta { display: flex; align-items: center; gap: 8px; }
    .pill, .crown, .home {
      border: 1px solid rgba(120, 170, 255, .45);
      background: rgba(8, 12, 28, .72);
      color: #eef3ff;
      box-shadow: 0 0 16px rgba(70, 120, 255, .18);
    }
    .pill {
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .pill em { font-style: normal; color: #d7e6ff; }
    .crown, .home {
      width: 38px; height: 38px; border-radius: 999px;
      display: grid; place-items: center; padding: 0; cursor: pointer;
    }
    .home {
      width: auto;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(180deg, rgba(40,70,160,.35), rgba(20,24,48,.8));
    }
    .crown { position: relative; }
    .crown svg { width: 18px; height: 18px; }
    .crown i {
      position: absolute; right: -2px; bottom: -2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #121624; border: 1px solid rgba(255,255,255,.16);
      display: grid; place-items: center;
    }
    .crown i svg { width: 8px; height: 8px; }
    #msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 16px 8px;
    }
    .hello { margin: auto; width: 100%; text-align: center; padding: 6px 0 10px; }
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) auto minmax(0, 1.05fr);
      align-items: center;
      gap: 6px;
    }
    .whisper {
      margin: 0;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.4;
      color: rgba(176, 186, 214, .82);
    }
    .whisper small {
      display: block;
      margin-top: 7px;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.35;
      color: rgba(196, 206, 232, .7);
    }
    .script {
      margin: 0;
      text-align: right;
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 650;
      font-style: italic;
      line-height: 1.35;
      color: #f2f4ff;
    }
    .script span { display: block; }
    .script em {
      display: block;
      height: 8px;
      margin-top: 2px;
      background: radial-gradient(60% 100% at 70% 0%, rgba(160,110,255,.95), transparent 72%);
      border-radius: 50%;
      transform: rotate(-6deg);
    }
    .logo {
      width: min(118px, 30vw);
      height: auto;
      justify-self: center;
      filter: drop-shadow(0 10px 24px rgba(40, 90, 255, .35));
    }
    h1 {
      margin: 2px 0 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    h1 span {
      background: linear-gradient(100deg, #8fd0ff 0%, #7aa6ff 42%, #b388ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .kicker {
      margin: 8px 0 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .28em;
      color: #aeb6ce;
    }
    .acts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .act {
      border: 1px solid rgba(120, 168, 255, .28);
      background: linear-gradient(180deg, rgba(16, 22, 42, .9), rgba(8, 12, 26, .9));
      color: #d7def2;
      border-radius: 12px;
      padding: 6px 2px 5px;
      cursor: pointer;
    }
    .act svg { width: 15px; height: 15px; display: block; margin: 0 auto 3px; }
    .act b { display: block; font-size: 9px; font-weight: 600; line-height: 1.15; }
    .msg {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .u {
      margin-left: auto;
      background: linear-gradient(180deg, #6ea2ff, #7a6bff);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .b {
      margin-right: auto;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }
    .err { border-color: rgba(255,120,140,.35); color: #ffd0d6; }
    .msg pre {
      margin: 8px 0 0;
      padding: 10px;
      overflow: auto;
      border-radius: 10px;
      background: #070b16;
      color: #d7e6ff;
      font-size: 12px;
      line-height: 1.45;
    }
    .msg .cb { margin-top: 8px; white-space: normal; }
    .msg .cb pre { margin: 0; white-space: pre; }
    .msg .cb .bar { display: flex; justify-content: flex-end; margin-top: 6px; }
    .runbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(94, 234, 212, .45);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(45, 212, 191, .22), rgba(20, 184, 166, .12));
      color: #8ff5e4;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .runbtn svg { width: 12px; height: 12px; display: block; }
    .runbtn:hover { border-color: #5eead4; color: #d6fff7; }
    .runbtn:disabled { opacity: .5; cursor: wait; }
    .msg img.shot {
      display: block;
      width: 100%;
      margin-top: 8px;
      border-radius: 12px;
    }
    .mode {
      margin: 0 4px 8px;
      color: #9fd6ff;
      font-size: 12px;
      font-weight: 650;
    }
    .thumb {
      display: none;
      width: 42px;
      height: 42px;
      margin-right: 8px;
      border-radius: 10px;
      object-fit: cover;
    }
    .thumb.on { display: block; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: #9fd6ff;
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    .dock { padding: 4px 16px 18px; }
    .ring {
      position: relative;
      isolation: isolate;
      border-radius: 24px;
    }
    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(
        from var(--nx-angle),
        transparent 0deg,
        #7ee7ff 55deg,
        #8d7bff 110deg,
        #ffd27a 155deg,
        #ff7eb3 200deg,
        transparent 255deg,
        transparent 360deg
      );
      animation: nx-edge 4.2s linear infinite;
    }
    .ring::before {
      inset: -1.5px;
      z-index: 2;
      padding: 1.5px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .ring::after {
      inset: -8px;
      z-index: 0;
      opacity: .55;
      filter: blur(10px);
    }
    .composer {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(7, 10, 22, .94);
      padding: 12px 12px 10px;
    }
    textarea {
      display: block;
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--fg);
      font-size: 16px;
      line-height: 1.4;
      min-height: 46px;
      padding: 2px 2px 8px;
    }
    textarea::placeholder { color: #8b93ad; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .clip {
      width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: #d5dced;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .send {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      padding: 0;
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, #3aa0ff, #7a5cff 55%, #b14bff);
      box-shadow: 0 8px 18px rgba(80, 70, 255, .28);
    }
    .send:disabled, textarea:disabled { opacity: .45; cursor: not-allowed; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      z-index: 5;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(12, 16, 32, .96);
      border: 1px solid rgba(160, 140, 255, .35);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      color: #f4f7ff;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 380px) {
      h1 { font-size: 30px; }
      .script { font-size: 10px; }
      .whisper { font-size: 9px; }
      .stage { gap: 4px; }
      .logo { width: 112px; }
      .act b { font-size: 8.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dots i, .ring::before, .ring::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2f6bff" stop-opacity=".0"/>
          <stop offset=".5" stop-color="#3d7dff" stop-opacity=".85"/>
          <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a4bff" stop-opacity="0"/>
          <stop offset=".45" stop-color="#7d5cff" stop-opacity=".7"/>
          <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M-40 210 C 80 40, 220 20, 460 250" fill="none" stroke="url(#a)" stroke-width="18" opacity=".55"/>
      <path d="M460 430 C 300 360, 250 520, 430 760" fill="none" stroke="url(#b)" stroke-width="16" opacity=".5"/>
      <path d="M-20 690 C 80 640, 140 760, 40 860" fill="none" stroke="#2f7bff" stroke-width="14" opacity=".35"/>
    </svg>
  </div>

  <div class="app">
    <header class="top">
      <a class="brand" href="/">
        <img src="/nibras-ai.png" alt="" />
        <span><b>Nibras AI</b><small>Nibras Code</small></span>
      </a>
      <div class="meta">
        <span class="pill" id="left"><em>0</em>/10</span>
        <button class="crown" id="prem" type="button" aria-label="Premium bağlıdır">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 17h18l-1.6-8.2-4.2 3.4L12 5 8.8 12.2 4.6 8.8 3 17z" fill="url(#g)" stroke="#f6d789" stroke-width="1"/>
            <defs><linearGradient id="g" x1="3" y1="5" x2="21" y2="17"><stop stop-color="#ffe7a3"/><stop offset="1" stop-color="#e0aa3a"/></linearGradient></defs>
          </svg>
          <i aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="11" width="12" height="9" rx="2" stroke="#d7deef" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#d7deef" stroke-width="2"/></svg>
          </i>
        </button>
        <a class="home" href="/">Sayt</a>
      </div>
    </header>

    <div id="msgs">
      <div class="hello" id="hello">
        <div class="stage">
          <p class="whisper">SUAL VER<br>ÖYRƏN<br>İNKİŞAF ET<small>AMMA BİLİK VƏ QÜDRƏTİN ƏSL SAHİBİNİ UNUTMA.</small></p>
          <img class="logo" src="/nibras-ai.png" alt="Nibras AI" />
          <p class="script"><span>Fikirlər başlanğıcdır,</span><span>müttəvəffəqiyyət</span><span>isə Allahdandır.</span></p>
        </div>
        <h1>Nibras <span>AI</span></h1>
        <p class="kicker">SƏNİN AI KÖMƏKÇİN</p>
      </div>
    </div>

    <div class="dock">
      <div class="ring">
        <form class="composer" id="form">
          <p class="mode" id="mode" hidden></p>
          <textarea id="inp" rows="2" maxlength="800" placeholder="Nə ilə kömək edim?"></textarea>
          <div class="row">
            <img class="thumb" id="thumb" alt="" />
            <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            <button class="clip" id="clip" type="button" aria-label="Fayl">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15.5 7.5-6.8 6.8a2.2 2.2 0 0 0 3.1 3.1l7-7a3.6 3.6 0 0 0-5.1-5.1l-7.2 7.2a5 5 0 0 0 7.1 7.1l5.2-5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
            <button class="send" id="btn" type="submit" aria-label="Göndər">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-2.2-6.2L4 12z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </div>
      <div class="acts">
        <button class="act" type="button" data-mode="ask">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 17.5 4.5 20v-4A7.5 7.5 0 1 1 12 19.5H8" stroke="#7ecbff" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9" cy="11" r="1" fill="#7ecbff"/><circle cx="12" cy="11" r="1" fill="#7ecbff"/><circle cx="15" cy="11" r="1" fill="#7ecbff"/></svg>
          <b>Sual ver</b>
        </button>
        <button class="act" type="button" data-mode="create">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4" stroke="#f4f7ff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3a6.5 6.5 0 0 0-3.2 12.1c.5.4.8 1 .8 1.6V17h5v-.3c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 3z" stroke="#f4f7ff" stroke-width="1.7"/></svg>
          <b>Fikir ver</b>
        </button>
        <button class="act" type="button" data-mode="code">
          <svg viewBox="0 0 24 24" fill="none"><path d="m8 8-4 4 4 4M16 8l4 4-4 4" stroke="#7ee7ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <b>Kod yaz</b>
        </button>
        <button class="act" type="button" data-mode="image">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="#d9a6ff" stroke-width="1.7"/><circle cx="9" cy="10" r="1.4" fill="#d9a6ff"/><path d="m8 16 3.2-3.2a1 1 0 0 1 1.4 0L16 16" stroke="#d9a6ff" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <b>Şəkil düzəlt</b>
        </button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const LIMIT = 10;
    const KEY = "nibras_ai_v2";
    const msgs = document.getElementById("msgs");
    const hello = document.getElementById("hello");
    const form = document.getElementById("form");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const left = document.getElementById("left");
    const toast = document.getElementById("toast");
    const today = new Date().toISOString().slice(0, 10);
    const thread = [];
    let toastTimer = 0;
    let mode = "chat";
    let pendingImage = "";

    function note(text) {
      toast.textContent = text;
      toast.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 2200);
    }
    function load() {
      let u = { d: today, c: 0 };
      try { u = JSON.parse(localStorage.getItem(KEY)) || u; } catch (e) {}
      if (!u || u.d !== today) u = { d: today, c: 0 };
      return u;
    }
    function save(u) { localStorage.setItem(KEY, JSON.stringify(u)); }
    function remain() { return Math.max(0, LIMIT - load().c); }
    function paint() {
      const used = load().c;
      const n = remain();
      left.innerHTML = "<em>" + used + "</em>/" + LIMIT;
      const full = n === 0;
      inp.disabled = full;
      btn.disabled = full;
      if (full) inp.placeholder = "Limit doldu";
      else if (mode === "chat") inp.placeholder = "Nə ilə kömək edim?";
    }
    function setMode(next) {
      mode = next;
      const label = document.getElementById("mode");
      if (next === "code") {
        label.hidden = false;
        label.textContent = "Kod rejimi — nə yazım?";
        inp.placeholder = "Məsələn: Python-da iki ədədi toplayan funksiya";
      } else if (next === "image") {
        label.hidden = false;
        label.textContent = pendingImage ? "Şəkil düzəlt — nə dəyişsin?" : "Şəkil hazırla — nə çəkim?";
        inp.placeholder = pendingImage ? "Bu şəkildə nəyi dəyişim?" : "Məsələn: qaranlıq masada mavi N loqosu";
      } else if (next === "create") {
        label.hidden = false;
        label.textContent = "Fikir rejimi — mövzunu yaz";
        inp.placeholder = "Məsələn: tətbiq üçün qısa ad fikri";
      } else if (next === "ask") {
        label.hidden = false;
        label.textContent = "Sual rejimi — sualını yaz";
        inp.placeholder = "Sualını buraya yaz";
      } else {
        label.hidden = true;
        label.textContent = "";
        inp.placeholder = remain() ? "Nə ilə kömək edim?" : "Limit doldu";
      }
    }
    function wantsImage(text) {
      return /(şəkil|sekil|resim).{0,30}(hazırla|hazirla|yarat|çək|cek|düzəlt|duzelt|çiz|ciz|et\b)|şəkil hazırla|sekil hazirla|draw an image|generate an image/i.test(text);
    }
    function escapeHtml(text) {
      const map = { "&": "amp", "<": "lt", ">": "gt" };
      return String(text).replace(/[&<>]/g, function (ch) { return "&" + map[ch] + ";"; });
    }
    // Gizlilik dostu say: yalnız hadisə növü və adı göndərilir (IP, cookie, mətn yoxdur). Xəta olsa səssiz keçilir.
    let statErrors = 0;
    function stat(type, name) {
      try {
        if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
        const body = JSON.stringify({ type: type, name: name });
        if (navigator.sendBeacon && navigator.sendBeacon("/api/stats", new Blob([body], { type: "application/json" }))) return;
        fetch("/api/stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true }).catch(function () {});
      } catch (e) {}
    }
    try {
      if (!sessionStorage.getItem("nai_v")) {
        sessionStorage.setItem("nai_v", "1");
        stat("visit", "ai");
      }
    } catch (e) { stat("visit", "ai"); }
    window.addEventListener("error", function () {
      if (statErrors++ < 3) stat("error", "js");
    });
    const RUN_BASE = "https://nibrasterminal.vercel.app/run";
    const RUN_MAX = 60000;
    const RUN_LANGS = { python: "python", py: "python", py3: "python", javascript: "javascript", js: "javascript", html: "html", htm: "html" };
    function b64u(bytes) {
      let s = "";
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    async function buildRunUrl(lang, code) {
      const raw = new TextEncoder().encode(code);
      let best = b64u(raw);
      let z = "";
      if (typeof CompressionStream !== "undefined") {
        try {
          const packed = b64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()));
          if (packed.length < best.length) { best = packed; z = "&z=1"; }
        } catch (e) {}
      }
      return RUN_BASE + "#l=" + lang + "&c=" + best + z;
    }
    function fillBubble(el, text) {
      const parts = String(text || "").split("```");
      const runs = [];
      el.innerHTML = parts.map(function (part, i) {
        if (i % 2 === 0) return escapeHtml(part);
        const head = part.match(/^([a-zA-Z0-9+#-]+)\n/);
        const code = head ? part.slice(head[0].length) : part;
        const lang = head ? RUN_LANGS[head[1].toLowerCase()] : "";
        let bar = "";
        if (lang && code.trim()) {
          runs.push({ lang: lang, code: code.replace(/\n$/, "") });
          bar = '<div class="bar"><button type="button" class="runbtn" data-run="' + (runs.length - 1) + '" aria-label="Kodu işlət və nəticəyə bax"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Aç</button></div>';
        }
        return '<div class="cb"><pre><code>' + escapeHtml(code) + "</code></pre>" + bar + "</div>";
      }).join("");
      el.querySelectorAll("button.runbtn").forEach(function (b) {
        const r = runs[Number(b.getAttribute("data-run"))];
        b.removeAttribute("data-run");
        let url = "";
        let pending = buildRunUrl(r.lang, r.code).then(function (u) { url = u; return u; }, function () { return ""; });
        b.addEventListener("click", async function () {
          if (!url) {
            b.disabled = true;
            await pending;
            b.disabled = false;
          }
          if (!url || url.length > RUN_MAX) {
            note(url ? "Kod çox böyükdür" : "Kodu açmaq alınmadı");
            return;
          }
          window.open(url, "_blank", "noopener");
        });
      });
    }
    function bubble(text, kind, imageUrl) {
      if (hello && hello.parentNode) hello.remove();
      const el = document.createElement("div");
      el.className = "msg " + kind;
      if (kind === "b" && !kind.includes("err")) fillBubble(el, text);
      else el.textContent = text;
      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "shot";
        img.alt = "Nibras AI şəkli";
        img.src = imageUrl;
        el.appendChild(img);
      }
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
      return el;
    }
    async function send(text) {
      const m = (text || "").trim();
      if (!m || remain() <= 0) return;
      const useImage = mode === "image" || pendingImage || wantsImage(m);
      const sentMode = useImage ? "image" : mode === "code" ? "code" : mode === "create" ? "create" : "ask";
      inp.value = "";
      bubble(m, "u");
      if (!useImage) thread.push({ role: "user", text: m });
      btn.disabled = true;
      stat("mode", sentMode);
      const wait = document.createElement("div");
      wait.className = "msg b";
      wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      msgs.appendChild(wait);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const r = await fetch(useImage ? "/api/image" : "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(useImage
            ? { prompt: m, image: pendingImage }
            : { message: m, messages: thread.slice(-8), mode: sentMode })
        });
        const raw = await r.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (e) {}
        wait.remove();
        const reply = data.reply || data.message || data.error;
        if (!r.ok || data.success === false || (!reply && !data.url)) {
          stat("error", useImage ? "image" : "chat");
          bubble(reply || "Cavab gəlmədi. Bir az sonra yenidən yoxlayın.", "b err");
          if (!useImage) thread.pop();
        } else {
          bubble(reply || (data.url ? "Şəkil hazırdır." : ""), "b", data.url || "");
          if (!useImage) thread.push({ role: "assistant", text: reply });
          const u = load();
          u.c += 1;
          save(u);
          pendingImage = "";
          const thumb = document.getElementById("thumb");
          thumb.classList.remove("on");
          thumb.removeAttribute("src");
          setMode("chat");
        }
      } catch (e) {
        wait.remove();
        if (!useImage) thread.pop();
        stat("error", "network");
        bubble("Şəbəkəyə qoşulmaq olmadı.", "b err");
      }
      paint();
      if (remain() > 0) inp.focus();
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      send(inp.value);
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (remain() <= 0) return;
        const next = b.getAttribute("data-mode");
        setMode(mode === next ? "chat" : next);
        inp.focus();
      });
    });
    document.getElementById("file").addEventListener("change", function () {
      const file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
        note("PNG və ya JPG seç.");
        return;
      }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const max = 1024;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingImage = canvas.toDataURL("image/jpeg", 0.82);
        const thumb = document.getElementById("thumb");
        thumb.src = pendingImage;
        thumb.classList.add("on");
        setMode("image");
        URL.revokeObjectURL(url);
        inp.focus();
      };
      img.onerror = function () { note("Şəkil açılmadı."); };
      img.src = url;
    });
    document.getElementById("clip").addEventListener("click", function () {
      if (remain() <= 0) return;
      document.getElementById("file").click();
    });
    paint();
  </script>
</body>
