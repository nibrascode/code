<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nibras AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat { width: 100%; max-width: 550px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flexDirection: column; box-sizing: border-box; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; }
        #msgs { height: 380px; overflow-y: auto; background: #0f172a; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.5; word-break: break-word; font-size: 14px; }
        .u-msg { background: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .b-msg { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        .in { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #0ea5e9; }
        button { padding: 12px 20px; background: #0ea5e9; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #warn { color: #f43f5e; text-align: center; font-weight: bold; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div id="chat">
        <h2>Nibras AI</h2>
        <div id="msgs"></div>
        <div class="in">
            <input type="text" id="inp" placeholder="Sualınızı yazın..." onkeypress="if(event.key==='Enter') send()">
            <button id="btn" onclick="send()">Göndər</button>
        </div>
        <p id="warn">⚠️ Gündəlik 5 sual limitiniz doldu.</p>
    </div>
    <script>
        let usg = JSON.parse(localStorage.getItem('n_ai')) || { d: new Date().toISOString().split('T')[0], c: 0 };
        const today = new Date().toISOString().split('T')[0];
        if(usg.d !== today) { usg = { d: today, c: 0 }; localStorage.setItem('n_ai', JSON.stringify(usg)); }
        
        let msgs = document.getElementById("msgs"), inp = document.getElementById("inp"), btn = document.getElementById("btn"), warn = document.getElementById("warn");
        
        function chk() { 
            if(usg.c >= 5) { 
                inp.disabled = true; 
                btn.disabled = true; 
                warn.style.display = "block"; 
                return false; 
            } 
            return true; 
        } 
        chk();

        async function send() {
            if(!chk()) return;
            let m = inp.value.trim();
            if(!m) return;
            
            inp.value = ""; 
            btn.disabled = true;
            msgs.innerHTML += '<div class="msg u-msg">' + m + '</div>'; 
            msgs.scrollTop = msgs.scrollHeight;
            
            try {
                let r = await fetch('/api/chat', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ message: m }) 
                });
                let data = await r.json();
                
                if(r.ok) {
                    msgs.innerHTML += '<div class="msg b-msg">' + (data.reply || "Cavab gəlmədi.") + '</div>';
                    usg.c++; 
                    localStorage.setItem('n_ai', JSON.stringify(usg)); 
                    chk();
                } else {
                    msgs.innerHTML += '<div class="msg b-msg">Xəta: ' + (data.message || "Problem yarandı.") + '</div>';
                }
            } catch(e) { 
                msgs.innerHTML += '<div class="msg b-msg">Sistemə qoşulmaq mümkün olmadı.</div>'; 
            }
            
            if(usg.c < 5) btn.disabled = false; 
            msgs.scrollTop = msgs.scrollHeight; 
            inp.focus();
        }
    </script>
</body>
</html>
