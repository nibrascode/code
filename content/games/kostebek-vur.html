<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Köstəbək vur</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#17224a,#070b18 70%);color:#e8f0ff;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px;text-align:center}
h1{margin:6px 0 8px;font-size:24px;letter-spacing:.5px}
.hud{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:15px}
.hud span{flex:1;background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;padding:6px 8px}
canvas{display:block;margin:0 auto;width:100%;height:auto;border-radius:14px;border:2px solid #4cc9f0;background:#0a1128;touch-action:none;box-shadow:0 0 24px #4cc9f044}
button{font:inherit;color:#fff;background:linear-gradient(#3a86ff,#2563eb);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #1b3f9a}
button:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.hint{opacity:.7;font-size:13px;margin:6px 0}
.msg{min-height:24px;font-weight:700;color:#ffd166;margin:6px 0}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px auto;width:min(92vw,380px)}
.hole{aspect-ratio:1;position:relative;overflow:hidden;border-radius:50%/42%;background:radial-gradient(ellipse at 50% 70%,#2a1a0c 55%,#6b4423 56%,#8a5a2f 100%);padding:0;box-shadow:none;border:0}
.hole span{position:absolute;left:0;right:0;bottom:-100%;text-align:center;font-size:clamp(40px,15vw,70px);line-height:1;transition:bottom .12s}
.hole.up span{bottom:12%}
.hole.hit span{bottom:12%;filter:grayscale(.6);transform:rotate(-20deg)}
.hole.bad{outline:3px solid #ff4d6d}
</style>
</head>
<body>
<div class="wrap">
<h1>🔨 Köstəbək vur</h1>
<div class="hud"><span>Xal: <b id="sc">0</b></span><span>Vaxt: <b id="tm">30</b></span><span>Rekord: <b id="bs">0</b></span></div>
<div class="holes" id="hs"></div>
<div class="msg" id="msg">Başlamaq üçün düyməyə bas</div>
<div class="row"><button id="go">Başla</button></div>
<p class="hint">Köstəbəyi 🐹 vur, bombaya 💣 toxunma! (−3 xal)</p>
</div>
<script>
const $ = id => document.getElementById(id);
const TIME = 30;
let holes = [], score = 0, best = 0, left = 0, running = false, spawnT = null, clockT = null;
try { best = +localStorage.getItem('nibras_kostebek') || 0; } catch (e) {}
$('bs').textContent = best;
for (let i = 0; i < 9; i++) {
  const h = document.createElement('button'); h.className = 'hole'; h.setAttribute('aria-label', 'Dəlik ' + (i + 1));
  h.innerHTML = '<span></span>'; h.state = null; h.timer = null;
  h.onpointerdown = e => { e.preventDefault(); whack(h); };
  $('hs').appendChild(h); holes.push(h);
}
function setScore(d) { score = Math.max(0, score + d); $('sc').textContent = score; }
function hide(h) { clearTimeout(h.timer); h.state = null; h.classList.remove('up', 'hit', 'bad'); }
function popUp() {
  if (!running) return;
  const free = holes.filter(h => !h.state);
  if (free.length) {
    const h = free[Math.random() * free.length | 0], bomb = Math.random() < 0.15;
    h.state = bomb ? 'bomb' : 'mole'; h.firstChild.textContent = bomb ? '💣' : '🐹'; h.classList.add('up');
    h.timer = setTimeout(() => hide(h), Math.max(380, 900 - (TIME - left) * 18));
  }
  spawnT = setTimeout(popUp, Math.max(320, 800 - (TIME - left) * 15));
}
function whack(h) {
  if (!running || !h.state || !h.classList.contains('up')) return;
  clearTimeout(h.timer);
  if (h.state === 'mole') { setScore(1); h.classList.add('hit'); }
  else { setScore(-3); h.classList.add('bad'); }
  h.state = 'done'; h.classList.remove('up');
  if (h.classList.contains('hit')) h.classList.add('up');
  h.timer = setTimeout(() => hide(h), 250);
}
function end() {
  running = false; clearTimeout(spawnT); clearInterval(clockT); holes.forEach(hide);
  $('msg').textContent = 'Vaxt bitdi! Xalın: ' + score + (score > best ? ' — yeni rekord! 🏆' : '');
  if (score > best) { best = score; $('bs').textContent = best; try { localStorage.setItem('nibras_kostebek', best); } catch (e) {} }
  $('go').textContent = 'Yenidən başla'; $('go').disabled = false;
}
$('go').onclick = () => {
  if (running) return;
  holes.forEach(hide); score = 0; left = TIME; running = true;
  $('sc').textContent = 0; $('tm').textContent = left; $('msg').textContent = 'Vur!'; $('go').disabled = true;
  clockT = setInterval(() => { left--; $('tm').textContent = left; if (left <= 0) end(); }, 1000);
  popUp();
};

</script>
</body>
</html>
