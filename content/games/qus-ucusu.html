<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quş uçuşu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#17224a,#070b18 70%);color:#e8f0ff;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px;text-align:center}
h1{margin:6px 0 8px;font-size:24px;letter-spacing:.5px}
.hud{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:15px}
.hud span{flex:1;background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;padding:6px 8px}
canvas{display:block;margin:0 auto;width:100%;height:auto;border-radius:14px;border:2px solid #4cc9f0;background:#0a1128;touch-action:none;box-shadow:0 0 24px #4cc9f044}
button{font:inherit;color:#fff;background:linear-gradient(#3a86ff,#2563eb);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #1b3f9a}
button:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.hint{opacity:.7;font-size:13px;margin:6px 0}
.msg{min-height:24px;font-weight:700;color:#ffd166;margin:6px 0}
canvas{max-width:360px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>🐤 Quş uçuşu</h1>
<div class="hud"><span>Xal: <b id="sc">0</b></span><span>Rekord: <b id="bs">0</b></span></div>
<canvas id="c" width="320" height="480"></canvas>
<p class="hint">Toxun, kliklə və ya Boşluq düyməsini bas — quş yuxarı uçur</p>
</div>
<script>
const W = 320, H = 480, GRAV = 0.42, FLAP = -7, GAP = 135, PW = 54, GROUND = 56, SPEED = 2.4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let bird, pipes, score, best = 0, state, frame, deadT, acc = 0, last = 0;
try { best = +localStorage.getItem('nibras_qus') || 0; } catch (e) {}
$('bs').textContent = best;

function reset() {
  bird = { x: 90, y: H / 2, v: 0, r: 13 }; pipes = []; score = 0; frame = 0; deadT = 0; state = 'ready';
  $('sc').textContent = 0;
}
function flap() {
  if (state === 'dead') { if (deadT > 25) reset(); return; }
  if (state === 'ready') state = 'play';
  bird.v = FLAP;
}
function die() {
  state = 'dead'; deadT = 0;
  if (score > best) { best = score; $('bs').textContent = best; try { localStorage.setItem('nibras_qus', best); } catch (e) {} }
}
function update() {
  frame++;
  if (state === 'ready') { bird.y = H / 2 + Math.sin(frame / 10) * 7; return; }
  if (state === 'dead') { deadT++; if (bird.y < H - GROUND - bird.r) { bird.v += GRAV; bird.y += bird.v; } return; }
  bird.v += GRAV; bird.y += bird.v;
  if (frame % 92 === 1) pipes.push({ x: W, top: 60 + Math.random() * (H - GROUND - GAP - 120), passed: false });
  for (const p of pipes) {
    p.x -= SPEED;
    if (!p.passed && p.x + PW < bird.x) { p.passed = true; score++; $('sc').textContent = score; }
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PW && (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP)) die();
  }
  pipes = pipes.filter(p => p.x > -PW);
  if (bird.y + bird.r >= H - GROUND) { bird.y = H - GROUND - bird.r; die(); }
  if (bird.y - bird.r < 0) { bird.y = bird.r; bird.v = 0; }
}
function pipe(x, y, h, flip) {
  ctx.fillStyle = '#5bbd3c'; ctx.fillRect(x, y, PW, h);
  ctx.fillStyle = '#7ce05a'; ctx.fillRect(x + 4, y, 8, h);
  ctx.fillStyle = '#3f8f28'; const cy = flip ? y + h - 20 : y;
  ctx.fillRect(x - 4, cy, PW + 8, 20);
  ctx.strokeStyle = '#2b6a1a'; ctx.strokeRect(x - 4, cy, PW + 8, 20);
}
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4cc9f0'); g.addColorStop(1, '#bde7ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffffaa';
  for (let i = 0; i < 4; i++) { const cx = ((i * 140 - frame * 0.4) % 520 + 520) % 520 - 60; ctx.beginPath(); ctx.arc(cx, 80 + i * 50, 22, 0, 7); ctx.arc(cx + 22, 86 + i * 50, 18, 0, 7); ctx.arc(cx - 20, 88 + i * 50, 16, 0, 7); ctx.fill(); }
  for (const p of pipes) { pipe(p.x, 0, p.top, true); pipe(p.x, p.top + GAP, H - GROUND - p.top - GAP, false); }
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#9ccc3b'; ctx.fillRect(0, H - GROUND, W, 10);
  ctx.fillStyle = '#c9c277'; for (let x = -(frame * SPEED) % 24; x < W; x += 24) ctx.fillRect(x, H - GROUND + 22, 12, 6);
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(Math.max(-0.5, Math.min(1.2, bird.v / 10)));
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4a100'; ctx.beginPath(); ctx.ellipse(-4, 3, 7, 4.5, Math.sin(frame / 3) * 0.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff6b35'; ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(19, 3); ctx.lineTo(9, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -5, 4.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(6.5, -5, 2, 0, 7); ctx.fill();
  ctx.restore();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0008'; ctx.lineWidth = 4;
  ctx.font = 'bold 44px system-ui'; ctx.strokeText(score, W / 2, 70); ctx.fillText(score, W / 2, 70);
  ctx.font = 'bold 20px system-ui';
  if (state === 'ready') { ctx.strokeText('Başlamaq üçün toxun', W / 2, 300); ctx.fillText('Başlamaq üçün toxun', W / 2, 300); }
  if (state === 'dead') {
    ctx.fillStyle = '#000a'; ctx.fillRect(40, 170, 240, 120); ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px system-ui'; ctx.fillText('Oyun bitdi', W / 2, 212);
    ctx.font = '18px system-ui'; ctx.fillText('Xal: ' + score + '  ·  Rekord: ' + best, W / 2, 242);
    ctx.fillText('Yenidən başlamaq üçün toxun', W / 2, 270);
  }
}
function frameLoop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(frameLoop);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); if (!e.repeat) flap(); } });
reset(); requestAnimationFrame(t => { last = t; frameLoop(t); });

</script>
</body>
</html>
