<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>İlan oyunu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#17224a,#070b18 70%);color:#e8f0ff;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px;text-align:center}
h1{margin:6px 0 8px;font-size:24px;letter-spacing:.5px}
.hud{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:15px}
.hud span{flex:1;background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;padding:6px 8px}
canvas{display:block;margin:0 auto;width:100%;height:auto;border-radius:14px;border:2px solid #4cc9f0;background:#0a1128;touch-action:none;box-shadow:0 0 24px #4cc9f044}
button{font:inherit;color:#fff;background:linear-gradient(#3a86ff,#2563eb);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #1b3f9a}
button:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.hint{opacity:.7;font-size:13px;margin:6px 0}
.msg{min-height:24px;font-weight:700;color:#ffd166;margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin:10px 0}
.pad button{padding:0;font-size:20px}
.pad .u{grid-column:2}
</style>
</head>
<body>
<div class="wrap">
<h1>🐍 İlan oyunu</h1>
<div class="hud"><span>Xal: <b id="sc">0</b></span><span>Rekord: <b id="bs">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div class="msg" id="msg"></div>
<div class="pad"><button class="u" data-d="u" aria-label="Yuxarı">▲</button><button data-d="l" aria-label="Sola" style="grid-row:2;grid-column:1">◀</button><button data-d="d" aria-label="Aşağı" style="grid-row:2;grid-column:2">▼</button><button data-d="r" aria-label="Sağa" style="grid-row:2;grid-column:3">▶</button></div>
<div class="row"><button id="pause">Fasilə</button><button id="re">Yenidən başla</button></div>
<p class="hint">Ox düymələri / WASD, sürüşdürmə və ya aşağıdakı düymələr</p>
</div>
<script>
const N = 20, cv = document.getElementById('c'), ctx = cv.getContext('2d'), S = cv.width / N;
const $ = id => document.getElementById(id);
let snake, dir, queue, food, score, best = 0, over, paused, tick, delay;
try { best = +localStorage.getItem('nibras_ilan') || 0; } catch (e) {}
$('bs').textContent = best;

function spawn() {
  do { food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function setScore() {
  $('sc').textContent = score;
  if (score > best) { best = score; $('bs').textContent = best; try { localStorage.setItem('nibras_ilan', best); } catch (e) {} }
}
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; queue = []; score = 0; over = false; paused = false; delay = 130;
  $('pause').textContent = 'Fasilə'; $('msg').textContent = '';
  spawn(); setScore(); loop();
}
function turn(dx, dy) {
  const l = queue.length ? queue[queue.length - 1] : dir;
  if ((l.x === -dx && l.y === -dy) || (l.x === dx && l.y === dy)) return;
  if (queue.length < 3) queue.push({ x: dx, y: dy });
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
    over = true; $('msg').textContent = 'Oyun bitdi! Xalın: ' + score; return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score++; setScore(); delay = Math.max(60, delay - 3); spawn(); }
  else snake.pop();
}
function loop() {
  clearTimeout(tick);
  if (!paused && !over) step();
  draw();
  if (!over) tick = setTimeout(loop, delay);
}
function draw() {
  ctx.fillStyle = '#0a1128'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ffffff08';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i * S, j * S, S, S);
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath();
  ctx.arc(food.x * S + S / 2, food.y * S + S / 2 + 1, S / 2 - 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#7ae582'; ctx.fillRect(food.x * S + S / 2 - 1, food.y * S + 1, 3, 5);
  snake.forEach((s, i) => {
    ctx.fillStyle = i ? 'hsl(' + (140 - Math.min(i * 3, 50)) + ',70%,50%)' : '#b8ff6a';
    ctx.beginPath(); (ctx.roundRect || ctx.rect).call(ctx, s.x * S + 1, s.y * S + 1, S - 2, S - 2, 6); ctx.fill();
  });
  const h = snake[0];
  ctx.fillStyle = '#10151f';
  const cx = h.x * S + S / 2, cy = h.y * S + S / 2;
  for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + dir.x * 4 - dir.y * 4 * k, cy + dir.y * 4 + dir.x * 4 * k, 2.2, 0, 7); ctx.fill(); }
  if (paused && !over) { ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff'; ctx.font = '28px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Fasilə', 200, 205); }
}
const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); turn(...KEYS[e.key]); }
  else if (e.key === ' ' || e.key === 'p') { e.preventDefault(); togglePause(); }
});
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); turn(...{ u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }[b.dataset.d]);
}));
let sx = 0, sy = 0;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
cv.addEventListener('pointerup', e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? turn(dx > 0 ? 1 : -1, 0) : turn(0, dy > 0 ? 1 : -1);
});
function togglePause() { if (over) return; paused = !paused; $('pause').textContent = paused ? 'Davam et' : 'Fasilə'; loop(); }
$('pause').onclick = togglePause;
$('re').onclick = reset;
reset();

</script>
</body>
</html>
